plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import groovy.json.JsonOutput

// Wall-clock anchor for the About → Stack "Gradle config phase" row — same
// proxy ea_cloud-superapp bakes (is the build getting slower over time?).
def gradleScriptStartMs = System.currentTimeMillis()

// ── Data-driven config bake ─────────────────────────────────────────────
// Everything the hub needs at runtime is read from the repo's source-of-truth
// JSON at config time and baked into BuildConfig — no parallel hardcoded list
// in Kotlin (FIRE rule 4). Bump a value in build.json / contract / data, get a
// rebuilt BuildConfig on the next gradle run.
def repoRoot   = rootDir                       // ea_cloud-comms/
def buildJson  = new groovy.json.JsonSlurper().parse(file("$repoRoot/build.json"))
def contract   = new groovy.json.JsonSlurper().parse(file("$repoRoot/contract/comms-ipc-v1.json"))
def endpoints  = new groovy.json.JsonSlurper().parse(file("$repoRoot/data/comms-endpoints.json"))
def chrome     = new groovy.json.JsonSlurper().parse(file("$repoRoot/data/constellation-chrome.json"))
def ghcr       = buildJson.release.ghcr
def au         = buildJson.release.auto_update

def runNumber  = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def codeBase   = (buildJson.android.version_code as Number).intValue()
def codeFinal  = codeBase + runNumber
def shortSha   = (System.getenv('GITHUB_SHA')
                  ?: providers.exec {
                         commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
                         ignoreExitValue = true
                     }.standardOutput.asText.get().trim()).take(8)
def buildTimestamp = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'").with {
    setTimeZone(java.util.TimeZone.getTimeZone('UTC')); format(new java.util.Date())
}

// IPC contract constants — single source of truth = contract/comms-ipc-v1.json.
def ipcAuthority  = contract.authority
def ipcPermission = contract.permission
def ipcVersion    = (contract.version as Number).intValue()
def ipcLaunchAction = contract.launch_action

// Fork registry baked as base64-JSON so the switcher + About render from
// build.json::forks, not a hardcoded list. (Now carries the `image` field too.)
def forksMap  = buildJson.forks.findAll { k, v -> !k.startsWith('_') }
def forksB64  = JsonOutput.toJson(forksMap).bytes.encodeBase64().toString()
def endpointsB64 = JsonOutput.toJson(endpoints).bytes.encodeBase64().toString()
// Constellation chrome (the permanent wrapper top bar) — single source of
// truth = data/constellation-chrome.json. The hub renders a back-button for
// every chain entry that isn't itself; the forks' branding patch does the same.
def chromeB64 = JsonOutput.toJson(chrome).bytes.encodeBase64().toString()

// ── Update fleet ────────────────────────────────────────────────────────
// The hub updates the WHOLE constellation: itself + each fork. Composed here
// from build.json (hub coords from release.ghcr + android; forks from forks.*)
// so the runtime fleet list is data-driven, never hardcoded.
def fleet = []
fleet << [label: 'hub', name: 'Hub (Cloud-Comms)',
          app_id: buildJson.android.application_id, image: ghcr.image, blocked: false]
forksMap.each { k, v ->
    // label = the fleet KEY (asset names/logs); name = the user-facing display
    // name from forks.<k>.label ("Mail (FairEmail)" …). alt_id = the REAL
    // package inside the stock upstream APK (forks.<k>.upstream_apk.package) —
    // until the patched fork (which carries app_id) replaces it, installed-
    // detection and launching accept EITHER id (forcing app_id caused
    // INSTALL_FAILED_INVALID_APK "inconsistent with com.mattermost.rnbeta").
    //
    // RUNTIME blocked ≠ fork-build blocked. `blocked_on` gates building OUR
    // patched fork (homeserver work for Matrix), NOT installing the bundled
    // stock client. If forks.<k>.upstream_apk exists, the stock APK is bundled
    // + installable → the installer/tiles must NOT show it blocked. So runtime
    // blocked = blocked_on set AND no obtainable upstream APK.
    def forkBlocked = (v.blocked_on != null && v.blocked_on != 'null')
    def hasUpstream = (v.upstream_apk?.url != null)
    fleet << [label: k, name: (v.label ?: k), app_id: v.app_id,
              alt_id: (v.upstream_apk?.package ?: ''),
              image: v.image, blocked: (forkBlocked && !hasUpstream)]
}
def fleetB64 = JsonOutput.toJson(fleet).bytes.encodeBase64().toString()

// ── About → Permissions catalog ─────────────────────────────────────────
// Same bake ea_cloud-superapp/app/build.gradle does: AboutActivity's
// Permissions section reads UI_PERMISSIONS_RUNTIME_B64 to render its row
// list — single source of truth = build.json::ui.permissions.runtime[]
// (copied from the superapp catalog for row-for-row About parity).
def uiPermissionsRuntimeJson = JsonOutput.toJson(buildJson.ui?.permissions?.runtime ?: [])
def uiPermissionsRuntimeB64  = uiPermissionsRuntimeJson.bytes.encodeBase64().toString()

// ── About stack-scan (lite) ─────────────────────────────────────────────
// Same idea as ea_cloud-superapp's About → Stack: compute "what's in this
// project" at config time so the About screen ships no static manifest to
// drift. Two blobs: languages {label:{files,loc}} + framework deps.
def stackExtMap = [ "kt":"Kotlin", "java":"Java", "json":"JSON (config)",
    "gradle":"Gradle (Groovy)", "xml":"XML (manifest/res)", "aidl":"AIDL",
    "nix":"Nix", "sh":"Shell", "md":"Markdown", "pro":"ProGuard" ]
def stackSkip = ["build", ".gradle", "dist", ".result", ".git"]
def stackStats = [:]
repoRoot.eachFileRecurse { f ->
    if (!f.isFile()) return
    def rel = f.absolutePath.replace(repoRoot.absolutePath + "/", "")
    if (stackSkip.any { rel.startsWith(it + "/") || rel.contains("/" + it + "/") }) return
    def ext = f.name.tokenize(".").last().toLowerCase()
    def label = stackExtMap[ext]; if (label == null) return
    def loc = 0; try { loc = f.readLines("UTF-8").size() } catch (Throwable t) { return }
    def b = stackStats[label] ?: [files: 0, loc: 0]; b.files += 1; b.loc += loc; stackStats[label] = b
}
def stackLanguagesB64 = JsonOutput.toJson(stackStats).bytes.encodeBase64().toString()

def stackDeps = new TreeSet()
def depPattern = ~/\b(implementation|api|androidTestImplementation|testImplementation)\s*[\(\s]\s*['"]([^'":]+:[^'":]+:[^'"]+)['"]/
repoRoot.eachFileRecurse { f ->
    if (!f.isFile() || !f.name.endsWith(".gradle")) return
    def text = ""; try { text = f.text } catch (Throwable t) { return }
    depPattern.matcher(text).each { m -> stackDeps.add(m[2]) }
}
def stackFrameworksB64 = JsonOutput.toJson(stackDeps.toList()).bytes.encodeBase64().toString()

// ── About → Stack folder tree ───────────────────────────────────────────
// Depth-2 directory tree of ea_cloud-comms/, computed at gradle config time
// (superapp renders the same monospace block from its UI_STACK_FOLDER_TREE_B64).
// Build artefact dirs are skipped so the tree is reproducible across machines.
def treeSkip = ["build", ".gradle", "dist", ".git"]
def treeLines = ["ea_cloud-comms/"]
repoRoot.listFiles()?.sort { it.name }?.each { d1 ->
    if (!d1.isDirectory() || treeSkip.contains(d1.name)) return
    treeLines << "  ${d1.name}/"
    d1.listFiles()?.sort { it.name }?.each { d2 ->
        if (!d2.isDirectory() || treeSkip.contains(d2.name)) return
        treeLines << "    ${d2.name}/"
    }
}
def stackTreeB64 = treeLines.join("\n").bytes.encodeBase64().toString()

// Build-time history (same as ea_cloud-superapp's About → Stack): pull the
// wall-clock duration of the last N successful ship runs so About can show
// "avg / last build time", not just this build's timestamp. Degrades to -1
// (UI shows "—") when gh is missing / unauthenticated / offline.
def buildHistorySecs = []
try {
    def ghOut = providers.exec {
        commandLine 'gh', 'run', 'list', '--workflow=ship-cloud-comms.yml',
            '--limit', '10', '--status', 'success', '--json', 'startedAt,updatedAt'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (ghOut.startsWith('[')) {
        new groovy.json.JsonSlurper().parseText(ghOut).each { r ->
            try {
                def s = java.time.Instant.parse(r.startedAt).epochSecond
                def e = java.time.Instant.parse(r.updatedAt).epochSecond
                if (e > s) buildHistorySecs << (e - s)
            } catch (Throwable t) { }
        }
    }
} catch (Throwable t) { }
def buildAvgSecs    = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs.sum() / buildHistorySecs.size()).longValue()
def buildLastSecs   = buildHistorySecs.isEmpty() ? -1L : (buildHistorySecs[0] as long)
def buildSampleSize = buildHistorySecs.size()

android {
    namespace 'com.diegonmarcos.comms'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diegonmarcos.comms'
        minSdk 26
        targetSdk 34
        versionCode codeFinal
        versionName "${buildJson.android.version_name} (sha-${shortSha})"

        buildConfigField "int",    "IPC_VERSION",       "${ipcVersion}"
        buildConfigField "String", "IPC_AUTHORITY",     "\"${ipcAuthority}\""
        buildConfigField "String", "IPC_PERMISSION",    "\"${ipcPermission}\""
        buildConfigField "String", "LAUNCH_ACTION",     "\"${ipcLaunchAction}\""
        buildConfigField "String", "FORKS_JSON_B64",    "\"${forksB64}\""
        buildConfigField "String", "ENDPOINTS_JSON_B64","\"${endpointsB64}\""
        buildConfigField "String", "CHROME_JSON_B64",   "\"${chromeB64}\""
        buildConfigField "String", "GIT_SHORT_SHA",     "\"${shortSha}\""
        buildConfigField "String", "BUILD_TIMESTAMP",   "\"${buildTimestamp}\""

        // ── In-app fleet updater (build.json::release.ghcr + auto_update) ──
        buildConfigField "String",  "GHCR_REGISTRY",   "\"${ghcr.registry}\""
        buildConfigField "String",  "GHCR_NAMESPACE",  "\"${ghcr.namespace}\""
        buildConfigField "String",  "GHCR_IMAGE",      "\"${ghcr.image}\""
        buildConfigField "String",  "GHCR_MEDIA_TYPE", "\"${ghcr.media_type}\""
        buildConfigField "String",  "AUTO_UPDATE_TAG", "\"${au.tag}\""
        buildConfigField "long",    "AUTO_UPDATE_INTERVAL_HOURS", "${au.interval_hours}L"
        buildConfigField "boolean", "AUTO_UPDATE_ENABLED",        "${au.enabled}"
        buildConfigField "boolean", "AU_REQUIRE_UNMETERED",       "${au.require_unmetered_network}"
        buildConfigField "boolean", "AU_REQUIRE_CHARGING",        "${au.require_charging}"
        buildConfigField "String",  "AU_INSTALL_MODE",            "\"${au.install_mode}\""
        buildConfigField "String",  "UPDATE_FLEET_JSON_B64",      "\"${fleetB64}\""

        // ── About → Stack ──
        buildConfigField "String", "STACK_LANGUAGES_JSON_B64",  "\"${stackLanguagesB64}\""
        buildConfigField "String", "STACK_FRAMEWORKS_JSON_B64", "\"${stackFrameworksB64}\""
        buildConfigField "String", "STACK_FOLDER_TREE_B64",     "\"${stackTreeB64}\""
        buildConfigField "long",   "STACK_BUILD_AVG_SECS",      "${buildAvgSecs}L"
        buildConfigField "long",   "STACK_BUILD_LAST_SECS",     "${buildLastSecs}L"
        buildConfigField "int",    "STACK_BUILD_SAMPLE",        "${buildSampleSize}"
        buildConfigField "long",   "STACK_GRADLE_CONFIG_MS",    "${System.currentTimeMillis() - gradleScriptStartMs}L"

        // ── About → Permissions (build.json::ui.permissions.runtime) ──
        buildConfigField "String", "UI_PERMISSIONS_RUNTIME_B64", "\"${uiPermissionsRuntimeB64}\""

        manifestPlaceholders = [ ipcPermission: ipcPermission, ipcAuthority: ipcAuthority ]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    // Stable signing — the WHOLE constellation (hub + 3 forks + SuperApp) must
    // share ONE key: the IPC permission is protectionLevel=signature, and the
    // fleet updater can only install an update over an app signed with the same
    // key. Keystore generated once in CI (cached) at hub/keystores/comms.keystore.
    signingConfigs {
        debug {
            def ks = file('keystores/comms.keystore')
            if (ks.exists()) {
                storeFile     ks
                storePassword 'android'
                keyAlias      'commskey'
                keyPassword   'android'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Fleet updater: WorkManager periodic check + coroutines for the worker.
    // GHCR JSON is parsed with built-in org.json (no serialization plugin).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
