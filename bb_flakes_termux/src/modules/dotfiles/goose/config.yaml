# Goose AI CLI config — managed by home-manager
# Source: ~/git/unix/bb_flakes_termux/src/modules/dotfiles/goose/

# Default provider and model
GOOSE_PROVIDER: openrouter
GOOSE_MODEL: z-ai/glm-5
OLLAMA_HOST: http://10.0.0.6:11435
GOOSE_CONTEXT_WINDOW: 4096
GOOSE_TELEMETRY_ENABLED: true

# Extensions (MCP servers) — mirrors Claude's mcp.json.tpl
# HTTP servers use ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN} env var for Bearer auth
# goose-malloc reads the token from vault and exports it before launch
extensions:
  # ── 7 remote HTTP MCPs ─────────────────────────────────────────────────────
  cloud-infra:
    name: Cloud Infra MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/c3-infra-mcp/mcp
    enabled: false
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  cloud-cgc-mcp:
    name: Cloud Code Graph Context MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/cloud-cgc-mcp/mcp
    enabled: true
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  cloud-services:
    name: Cloud Services MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/c3-services-mcp/mcp
    enabled: false
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  mattermost:
    name: Mattermost MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/mattermost-mcp/mcp
    enabled: false
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  mail-mcp:
    name: Mail MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/mail-mcp/mcp
    enabled: false
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  google-workspace:
    name: Google Workspace MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/g-workspace/mcp
    enabled: false
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  google-personal:
    name: Google Personal MCP
    type: streamable_http
    uri: https://mcp.diegonmarcos.com/g-personal/mcp
    enabled: false
    timeout: 300
    headers:
      Authorization: Bearer ${AUTHELIA_OIDC_TOKEN_CLAUDE-ADMIN}

  # ── 5 local stdio MCPs ──────────────────────────────────────────────────────
  unix:
    name: Unix API MCP
    type: stdio
    cmd: tsx
    args:
      - --import
      - /data/data/com.termux.nix/files/home/.node_modules/esm-loader-register.mjs
      - /data/data/com.termux.nix/files/home/git/tools/products/mcp-unix-api/src/index.ts
    enabled: false
    timeout: 300
    envs:
      NODE_PATH: /data/data/com.termux.nix/files/home/.node_modules/node_modules

  dtk:
    name: DTK MCP
    type: stdio
    cmd: tsx
    args:
      - --import
      - /data/data/com.termux.nix/files/home/.node_modules/esm-loader-register.mjs
      - /data/data/com.termux.nix/files/home/git/tools/products/mcp-dtk/src/index.ts
    enabled: false
    timeout: 300
    envs:
      NODE_PATH: /data/data/com.termux.nix/files/home/.node_modules/node_modules

  cloud-infra-local:
    name: Cloud Infra MCP (local)
    type: stdio
    cmd: tsx
    args:
      - --import
      - /data/data/com.termux.nix/files/home/.node_modules/esm-loader-register.mjs
      - /data/data/com.termux.nix/files/home/git/cloud/a_solutions/infra-api_c3-infra-mcp/src/code/mcp/index.ts
    enabled: false
    timeout: 300
    envs:
      NODE_PATH: /data/data/com.termux.nix/files/home/.node_modules/node_modules
      GIT_BASE: /data/data/com.termux.nix/files/home/git

  cloud-cgc-mcp-local:
    name: Cloud CGC MCP (local)
    type: stdio
    cmd: tsx
    args:
      - --import
      - /data/data/com.termux.nix/files/home/.node_modules/esm-loader-register.mjs
      - /data/data/com.termux.nix/files/home/git/cloud/a_solutions/bc-obs_cloud-cgc-mcp/src/code/index.ts
    enabled: false
    timeout: 300
    envs:
      NODE_PATH: /data/data/com.termux.nix/files/home/.node_modules/node_modules
      CONFIG_PATH: /data/data/com.termux.nix/files/home/git/cloud/config.json
      GIT_ROOT: /data/data/com.termux.nix/files/home/git
      OCTOCODE_BIN: /data/data/com.termux.nix/files/home/.nix-profile/bin/octocode

  diego-personal-data:
    name: Diego Personal Data MCP
    type: stdio
    cmd: tsx
    args:
      - --import
      - /data/data/com.termux.nix/files/home/.node_modules/esm-loader-register.mjs
      - /data/data/com.termux.nix/files/home/git/cloud/a_solutions/infra-api_c3-diego-personal-data-mcp/src/index.ts
    enabled: false
    timeout: 300
    envs:
      NODE_PATH: /data/data/com.termux.nix/files/home/.node_modules/node_modules
      VAULT_PATH: /data/data/com.termux.nix/files/home/git/vault
      CONFIG_PATH: /data/data/com.termux.nix/files/home/git/cloud/config.json

  # ── Platform extensions (bundled with goose) ────────────────────────────────
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
    available_tools: []

  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
    available_tools: []

  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
    available_tools: []

  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
    available_tools: []

  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
    available_tools: []

  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
    available_tools: []

  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
    available_tools: []

  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
    available_tools: []

  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
    available_tools: []

  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []

  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true

# Provider configuration
providers:
  ollama:
    enabled: true
    model: qwen2.5-4k
    configured: true
  openrouter:
    enabled: true
    model: z-ai/glm-5
    configured: true

active_provider: openrouter
