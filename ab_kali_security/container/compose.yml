# Driven by build.sh. Modularity split:
#   kali-os    — single bootable image (OS + tools + GUI) ~28 GB
#   kali-data  — pure-data sidecar (wordlists, seclists, exploitdb) ~6 GB
#
# kali-data populates named volumes on first run; all other services
# bind-mount those volumes at /usr/share/{wordlists,seclists,exploitdb}
# read-only.
#
# Override images via env: KALI_OS_IMAGE, KALI_DATA_IMAGE.
# Skip the data init entirely on minimal CI runs by setting NO_DATA=1
# (then services start without the bind-mounts — tools needing wordlists fail).

x-kali-common: &kali-common
  hostname: ${KALI_HOSTNAME:-kali}
  network_mode: host
  extra_hosts:
    - "kali:127.0.0.1"
  restart: unless-stopped
  shm_size: 2g
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
    - no-new-privileges:false
  environment:
    TZ: ${TZ:-Etc/UTC}
    LANG: ${LANG:-en_US.UTF-8}
    KALI_INSTALL_JSON: /install.json
    KALI_VNC_PASSWORD: ${KALI_VNC_PASSWORD:-kali}
  volumes:
    - ./install.json:/install.json:ro
    - ./data/home:/home/kali
    - ./data/workspace:/workspace
    - ./data/loot:/loot
    # kali-data bind-mounts (populated by kali-data-init)
    - kali-data-wordlists:/usr/share/wordlists:ro
    - kali-data-seclists:/usr/share/seclists:ro
    - kali-data-exploitdb:/usr/share/exploitdb:ro

volumes:
  kali-data-wordlists:
  kali-data-seclists:
  kali-data-exploitdb:

services:
  # ── kali-data init (one-shot, populates volumes) ─────────────────────────
  # All other services depend on this completing successfully.
  kali-data-init:
    image: ${KALI_DATA_IMAGE:-kali-data:latest}
    profiles: ["cli", "gui", "scan-network", "scan-local"]
    container_name: kali-data-init
    restart: "no"
    environment:
      DATA_DIRS: "wordlists seclists exploitdb"
      DEST: /vol
    volumes:
      - kali-data-wordlists:/vol/wordlists
      - kali-data-seclists:/vol/seclists
      - kali-data-exploitdb:/vol/exploitdb

  kali-cli:
    <<: *kali-common
    image: ${KALI_OS_IMAGE:-kali-os:latest}
    container_name: kali-linux-cli
    profiles: ["cli"]
    depends_on:
      kali-data-init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: ["cli"]

  kali-gui:
    <<: *kali-common
    image: ${KALI_OS_IMAGE:-kali-os:latest}
    container_name: kali-linux-gui
    profiles: ["gui"]
    depends_on:
      kali-data-init:
        condition: service_completed_successfully
    command: ["gui"]

  # ── Scanner: NETWORK profile ─────────────────────────────────────────────
  scanner-network:
    <<: *kali-common
    image: ${KALI_OS_IMAGE:-kali-os:latest}
    container_name: kali-scanner-network
    profiles: ["scan-network"]
    depends_on:
      kali-data-init:
        condition: service_completed_successfully
    restart: "no"
    entrypoint: ["/usr/local/bin/scanner.sh"]
    environment:
      TZ: ${TZ:-Etc/UTC}
      LANG: ${LANG:-en_US.UTF-8}
      KALI_INSTALL_JSON: /install.json
      VERBOSE: ${VERBOSE:-0}
      QUIET:   ${QUIET:-0}
    volumes:
      - ./install.json:/install.json:ro
      - ./scans.json:/scans.json:ro
      - ./targets.json:/targets.json:ro
      - ./scripts/scanner.sh:/usr/local/bin/scanner.sh:ro
      - ./scripts/reporter.sh:/usr/local/bin/reporter.sh:ro
      - ./scripts/survey-wifi.sh:/usr/local/bin/survey-wifi.sh:ro
      - ./scripts/safety-analyzer.sh:/usr/local/bin/safety-analyzer.sh:ro
      - ./data/home:/home/kali
      - ./data/loot:/loot
      - kali-data-wordlists:/usr/share/wordlists:ro
      - kali-data-seclists:/usr/share/seclists:ro
      - kali-data-exploitdb:/usr/share/exploitdb:ro

  # ── Scanner: LOCAL profile (root, read-only host fs at /host) ────────────
  scanner-local:
    <<: *kali-common
    image: ${KALI_OS_IMAGE:-kali-os:latest}
    container_name: kali-scanner-local
    profiles: ["scan-local"]
    depends_on:
      kali-data-init:
        condition: service_completed_successfully
    restart: "no"
    user: "0:0"
    pid: host
    entrypoint: ["/usr/local/bin/scanner.sh"]
    environment:
      TZ: ${TZ:-Etc/UTC}
      LANG: ${LANG:-en_US.UTF-8}
      KALI_INSTALL_JSON: /install.json
      FSROOT: /host
      VERBOSE: ${VERBOSE:-0}
      QUIET:   ${QUIET:-0}
    volumes:
      - ./install.json:/install.json:ro
      - ./scans.json:/scans.json:ro
      - ./targets.json:/targets.json:ro
      - ./scripts/scanner.sh:/usr/local/bin/scanner.sh:ro
      - ./scripts/reporter.sh:/usr/local/bin/reporter.sh:ro
      - ./scripts/survey-wifi.sh:/usr/local/bin/survey-wifi.sh:ro
      - ./scripts/safety-analyzer.sh:/usr/local/bin/safety-analyzer.sh:ro
      - ./data/loot:/loot
      - /:/host:ro
      - kali-data-wordlists:/usr/share/wordlists:ro
      - kali-data-seclists:/usr/share/seclists:ro
      - kali-data-exploitdb:/usr/share/exploitdb:ro
