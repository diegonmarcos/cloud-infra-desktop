name: "Ship → Builder images"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant (x86-cloudlight, x86-forge, arm-cloudlight, all)"
        required: false
        default: "x86-cloudlight"

permissions:
  contents: read
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ship via builder container
        run: |
          docker pull ghcr.io/diegonmarcos/cloud-builder-x86-nixos:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTOR="${{ github.actor }}" \
            ghcr.io/diegonmarcos/cloud-builder-x86-nixos:latest \
            bash -c "cd /workspace && sh cb_containers-builders/build.sh ship ${{ github.event.inputs.variant }}"
