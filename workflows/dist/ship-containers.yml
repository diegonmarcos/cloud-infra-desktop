name: "Ship → Container images"

on:
  push:
    paths:
      - "ba_flakes_desktop/src/**"
      - "aa_nixos-surface_host/src/**"
      - "cc_containers-compose/src/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: diego-deb-nix
            context: cc_containers-compose/src
            file: cc_containers-compose/src/Containerfile.deb-nix
          - name: diego-deb-apt
            context: cc_containers-compose/src
            file: cc_containers-compose/src/Containerfile.deb-apt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/diegonmarcos/${{ matrix.name }}:latest
            ghcr.io/diegonmarcos/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  build-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-24.11

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nix-hm image
        run: |
          nix build ./ba_flakes_desktop/src#container-nixos-hm --no-link --print-out-paths | while read -r tarball; do
            docker load < "$tarball"
          done

      - name: Push nix-hm image
        run: |
          docker tag ghcr.io/diegonmarcos/diego-nixos-hm:latest ghcr.io/diegonmarcos/diego-nixos-hm:${{ github.sha }}
          docker push ghcr.io/diegonmarcos/diego-nixos-hm:latest
          docker push ghcr.io/diegonmarcos/diego-nixos-hm:${{ github.sha }}
