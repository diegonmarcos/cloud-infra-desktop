[package]
name = "my-konsole"
version = "0.1.0"
edition = "2021"
description = "my-konsole — Rust KDE Konsole alternative (Tauri v2)"
authors = ["Diego Nepomuceno Marcos"]
license = "MIT"

[[bin]]
name = "my-konsole"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pty-core = { path = "../pty-core" }
# ponytail: PTY logic lives in the shared pty-core crate — no bundled node/pty-server.
tiny_http = "0.12"
# PNG -> raw RGBA decode for tray icons (tauri::image::Image has no from_path
# in this version — see setup_systrays in main.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
# Per-tray icons are SVGs (configs/systray-icons/<id>.svg) rasterised at load.
# Rasterising here rather than shipping PNGs keeps ONE source per icon: a PNG
# pair would be a generated file to regenerate by hand every time, and the
# alternative — imagemagick at install time — puts a build tool on every user
# machine for six 32x32 images.
resvg = { version = "0.44", default-features = false }
# Directory walk for the sidebar "Data" panel (fs_glob below) — filter_entry
# prunes a subtree BEFORE descending into it, which the `glob` crate this
# replaced could not do (it filtered .git/target/node_modules/result out of
# the *results*, after already walking every one of them in full).
walkdir = "2"
# Serves the vendored agentic-ui/dist static build to the native browser-tab
# webview (browser_open needs a real http:// URL, not a file:// root) — see
# agentic_ui_serve below. Smallest workable dep for this, per plan.

[profile.release]
strip = true
lto = true
codegen-units = 1
