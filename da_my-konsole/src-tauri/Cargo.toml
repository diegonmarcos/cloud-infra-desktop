[package]
name = "my-konsole"
version = "0.1.0"
edition = "2021"
description = "my-konsole — Rust KDE Konsole alternative (Tauri v2)"
authors = ["Diego Nepomuceno Marcos"]
license = "MIT"

[[bin]]
name = "my-konsole"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
# ponytail: portable-pty gives in-process PTYs — no bundled node/pty-server.

[profile.release]
strip = true
lto = true
codegen-units = 1
