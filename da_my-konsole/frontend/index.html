<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-konsole</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Top nav: row 1 = fixed Home actions, row 2 = data-driven profile pills -->
  <header id="topnav">
    <div class="nav-row" id="nav-row-home">
      <span class="nav-label">tauri-apps</span>
      <div id="home-actions">
        <button class="home-btn" id="btn-home-home">Home</button>
        <button class="home-btn" id="btn-home-filebrowser">File Browser</button>
        <div class="home-dropdown" id="editor-wrap">
          <button class="home-btn" id="btn-home-fileeditor">File Editor ▾</button>
          <div class="home-menu" id="editor-menu" hidden>
            <div class="menu-item" id="editor-plain">Plain (textarea)</div>
            <div class="menu-item" id="editor-vim">Vim</div>
          </div>
        </div>
        <button class="home-btn" id="btn-home-browser">Web Browser</button>
        <button class="home-btn" id="btn-home-agentic">Agentic</button>
      </div>
      <!-- Konsole-style menu button: an icon, and a menu whose entries open
           child menus rather than one flat list. -->
      <div id="menu-wrap">
        <button id="btn-menu" title="Menu (Ctrl+Shift+M)">☰</button>
        <div id="menu-dropdown" hidden>
          <div class="menu-item has-sub">Layout
            <div class="submenu">
              <div class="menu-item check" id="cfg-topnav">Top Nav Bar</div>
              <div class="menu-item check" id="cfg-sidebar">Left Side Bar</div>
            </div>
          </div>
          <div class="menu-sep"></div>
          <div class="menu-item has-sub">Application
            <div class="submenu">
              <div class="menu-item" id="menu-update">Update Binary (fetch release)</div>
              <div class="menu-item" id="menu-clone-build">Clone &amp; Build Locally</div>
              <div class="menu-item" id="menu-deps">Dependency Solver</div>
            </div>
          </div>
          <div class="menu-item has-sub">Session
            <div class="submenu">
              <div class="menu-item" id="menu-restore-session">Restore Last Session</div>
            </div>
          </div>
          <div class="menu-item has-sub">Logs
            <div class="submenu">
              <div class="menu-item" id="menu-logs">View Logs (console)</div>
              <div class="menu-item" id="menu-export-logs">Export Logs → file</div>
            </div>
          </div>
          <div class="menu-sep"></div>
          <div class="menu-item" id="menu-about">About</div>
        </div>
      </div>
    </div>
    <div class="nav-row" id="nav-row-profiles">
      <span class="nav-label">terminal-clis</span>
      <nav id="profiles"><!-- .profile-pill per profile (boot.js) --></nav>
    </div>
  </header>

  <!-- About dialog -->
  <div id="about" hidden>
    <div id="about-box">
      <h2>my-konsole</h2>
      <div id="about-body"></div>
      <div id="about-repo">
        <div class="about-row">Repo: <a id="about-repo-url" href="#" target="_blank" rel="noreferrer"></a>
          <button class="home-btn" id="about-clone">Clone</button></div>
        <div class="about-row">Local repo: <span id="about-repo-path"></span></div>
        <div class="about-row">Binary: <span id="about-bin-path"></span></div>
      </div>
      <button id="about-close">Close</button>
    </div>
  </div>

  <!-- Logs (logcat) viewer -->
  <div id="logs" hidden>
    <div id="logs-box">
      <div id="logs-head">
        <span>Console Logs</span>
        <button class="home-btn" id="logs-refresh">Refresh</button>
        <button class="home-btn" id="logs-export">Export</button>
        <button class="home-btn" id="logs-clear">Clear</button>
        <button class="home-btn" id="logs-close">Close</button>
      </div>
      <pre id="logs-body"></pre>
    </div>
  </div>

  <div id="body">
    <!-- Left: search + per-profile command sections -->
    <aside id="sidebar">
      <div id="sidebar-toggle">
        <button class="sidebar-toggle-btn active" data-view="commands">Commands</button>
        <button class="sidebar-toggle-btn" data-view="tabs">Tabs</button>
      </div>
      <div id="commands-panel">
        <input id="search" type="search" placeholder="Search commands…" autocomplete="off" />
        <div id="sections"><!-- .section per profile.sections[] (boot.js) --></div>
      </div>
      <div id="tabs-panel" hidden><!-- vertical tab list, grouped (tabs.js) --></div>
    </aside>

    <!-- Center: tab strip + terminals -->
    <main id="center">
      <div id="tabstrip">
        <!-- .tab per terminal (tabs.js) -->
        <button id="btn-newtab" title="New Tab (Ctrl+Shift+T)">＋ Tab</button>
      </div>
      <div id="terms"><!-- .term host per tab (term.js) --></div>
      <!-- Konsole-style find bar (Ctrl+Shift+F) -->
      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find…" />
        <button id="find-prev" title="Previous">▲</button>
        <button id="find-next" title="Next">▼</button>
        <button id="find-close" title="Close (Esc)">✕</button>
      </div>
    </main>
  </div>

  <!-- Vim-style ":" command palette — searches commands across ALL profiles -->
  <div id="palette" hidden>
    <input id="palette-input" type="text" spellcheck="false" autocomplete="off" />
    <div id="palette-results"></div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/xterm-addon-search.js"></script>
  <script src="js/devlog.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/term.js"></script>
  <script src="js/filebrowser.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
