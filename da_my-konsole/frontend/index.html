<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-konsole</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Top profile nav -->
  <header id="topnav">
    <button id="btn-sidebar" title="Toggle sidebar">☰</button>
    <div id="brand">my-konsole</div>
    <nav id="profiles"><!-- .profile-pill per profile (boot.js) --></nav>
    <div id="topnav-spacer"></div>
    <div id="menu-wrap">
      <button id="btn-menu" title="Menu">⋮</button>
      <div id="menu-dropdown" hidden>
        <div class="menu-item" id="menu-restore-session">Restore Last Session</div>
        <div class="menu-item" id="menu-about">About</div>
      </div>
    </div>
  </header>

  <!-- About dialog -->
  <div id="about" hidden>
    <div id="about-box">
      <h2>my-konsole</h2>
      <div id="about-body"></div>
      <button id="about-close">Close</button>
    </div>
  </div>

  <div id="body">
    <!-- Left: search + per-profile command sections -->
    <aside id="sidebar">
      <input id="search" type="search" placeholder="Search commands…" autocomplete="off" />
      <div id="sections"><!-- .section per profile.sections[] (boot.js) --></div>
    </aside>

    <!-- Center: tab strip + terminals -->
    <main id="center">
      <div id="tabstrip">
        <!-- .tab per terminal (tabs.js) -->
        <button id="btn-newtab" title="New Tab (Ctrl+Shift+T)">＋ Tab</button>
      </div>
      <div id="terms"><!-- .term host per tab (term.js) --></div>
      <!-- Konsole-style find bar (Ctrl+Shift+F) -->
      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find…" />
        <button id="find-prev" title="Previous">▲</button>
        <button id="find-next" title="Next">▼</button>
        <button id="find-close" title="Close (Esc)">✕</button>
      </div>
    </main>
  </div>

  <!-- Vim-style ":" command palette — searches commands across ALL profiles -->
  <div id="palette" hidden>
    <input id="palette-input" type="text" spellcheck="false" autocomplete="off" />
    <div id="palette-results"></div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <script src="vendor/xterm-addon-search.js"></script>
  <script src="js/term.js"></script>
  <script src="js/filebrowser.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/palette.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
