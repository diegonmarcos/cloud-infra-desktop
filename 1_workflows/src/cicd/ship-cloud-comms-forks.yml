name: "Ship → Cloud-Comms fork APKs (materialize + build + publish to GHCR)"

# Builds a Cloud-Comms FORK (upstream clone @ pinned tag + committed patch
# series) and publishes its APK to GHCR as cloud-comms-<key>:latest — the image
# the hub's bundle-forks embeds and the in-app FleetUpdater pulls. Everything
# routes through ea_cloud-comms/build.sh (materialize-fork / build-fork /
# publish-fork); this workflow only sequences engine commands.
#
# The fork builds with its OWN gradle wrapper (FairEmail pins Gradle 9.4.1 /
# AGP 9.2.1 / compileSdk 37) and signs with the SAME cached constellation
# keystore the hub uses — signature-IPC + the updater install chain require one
# key across all five APKs.
#
# On success, the fork APK lands on GHCR only. The hub is NOT re-bundled
# automatically — that was the original design, but it caused sha(bundle)==
# sha(GHCR) so the in-app fleet updater never detected fork updates for
# existing installs. Now fork CI → GHCR only; existing hubs detect the sha
# mismatch and pull the update directly from GHCR. Hub re-bundle is manual
# (workflow_dispatch on ship-cloud-comms.yml).
#
# Today only `mail` builds on push (chat awaits the push-notification decision;
# matrix is blocked on the Matrix stack ship). workflow_dispatch can request
# any fork key.

on:
  workflow_dispatch:
    inputs:
      fork:
        description: "Fork to build"
        required: false
        type: choice
        default: "mail"
        options:
          - mail
          - chat
          - matrix
          - dialer
  push:
    branches: [main]
    paths:
      - "ea_cloud-comms/forks/**"
      - "ea_cloud-comms/build.json"
      - "ea_cloud-comms/build.sh"   # the engine IS the fork pipeline
      - "1_workflows/src/cicd/ship-cloud-comms-forks.yml"
      # Generated .github/workflows/*.yml intentionally NOT watched (regenerated
      # by 1_workflows/build.sh → would self-trigger rebuilds on unrelated commits).

permissions:
  contents: write   # gh release create (RSS feed entries)
  packages: write   # ghcr push (oras)

env:
  WORK_DIR: ea_cloud-comms

jobs:
  detect-forks:
    name: "Detect which forks to build"
    runs-on: ubuntu-latest
    outputs:
      forks: ${{ steps.detect.outputs.forks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the push's `before` SHA is present
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORK="${{ inputs.fork || 'mail' }}"
            echo "forks=[\"$FORK\"]" >> $GITHUB_OUTPUT
          else
            # Diff the WHOLE push range (before..after), NOT just HEAD~1..HEAD.
            # BUG FIXED: a multi-commit push where the forks/ patch commit is a
            # PARENT (engine commit as HEAD) hid the change → HEAD~1..HEAD showed
            # only build.sh/build.json → detect fell back to `mail` and the fork
            # patches (e.g. dialer 0005-0007) were never built/published. Using
            # the full range catches every fork touched anywhere in the push.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="${{ github.sha }}~1"
            fi
            changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- ea_cloud-comms/forks/ \
              | sed 's|ea_cloud-comms/forks/||;s|/.*||' | sort -u \
              | jq -R . | jq -sc 'map(select(length>0))')
            if [ -z "$changed" ] || [ "$changed" = "[]" ]; then
              changed='["mail"]'
            fi
            echo "forks=$changed" >> $GITHUB_OUTPUT
          fi

  build_and_publish_fork:
    name: "Materialize + build + publish fork (${{ matrix.fork }})"
    needs: detect-forks
    strategy:
      matrix:
        fork: ${{ fromJson(needs.detect-forks.outputs.forks) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60   # FairEmail is a ~3500-file build
    env:
      FORK: ${{ matrix.fork }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-android / no sdkmanager: platforms;android-37 is not resolvable
      # via sdkmanager on the runner (runs 27413583240 + 27418273251), and
      # FairEmail's OWN CI (.github/workflows/android.yml in the upstream clone)
      # provisions NOTHING — just JDK 17 + ./gradlew. AGP 9 auto-installs the
      # compile platform from the runner's preinstalled, license-accepted SDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # exactly what upstream FairEmail CI uses
          cache: gradle

      # ── ONE shared Cloud-constellation signing key (vault) ──────────────
      # Same key + mechanism as ship-cloud-comms.yml: EVERY Android app (hub +
      # all forks + Nav / IDE / SuperApp) signs with the single vault key
      # (release.jks, OU=Cloud Constellation). The raw keystore + sops-encrypted
      # passwords live ONLY in the private vault repo. build.sh::_resolve_signing
      # reads $VAULT_DIR + sops-decrypts (SOPS_AGE_KEY) and exports
      # ANDROID_KEYSTORE_* which the fork's gradle signingConfig reads. NO
      # fallback: if the key is unavailable build.sh exits 1 (desired).
      - name: Checkout vault (shared Android signing key)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/vault
          token: ${{ secrets.ANDROID_SIGNING_VAULT_TOKEN }}
          path: .vault

      - name: Install ORAS + sops + jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            | sudo tee /usr/local/bin/sops >/dev/null
          sudo chmod +x /usr/local/bin/sops
          sops --version

      - name: Materialize fork (clone @ pin + patch series)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Generate build stamp (baked into APK BuildConfig AND release tag)
        run: |
          # ONE stamp (YYYYMMDD.HHMMSS, sorts lexicographically) used BOTH as
          # the baked COMMS_BUILD_TIMESTAMP and as the release-tag suffix — the
          # app detects updates by comparing its baked stamp against the tag
          # stamp, so an APK exactly equals its own release (published_at is
          # minutes later than build time → self-update loop). Must be set
          # BEFORE build-fork so the $ENV:COMMS_BUILD_TIMESTAMP gradle_prop
          # resolves; without it the engine bakes "dev" = updater disabled
          # (the bug that shipped update-blind APKs until patch 0045).
          echo "COMMS_BUILD_TIMESTAMP=$(date -u '+%Y%m%d.%H%M%S')" >> "$GITHUB_ENV"

      - name: Build fork APK (fork's own gradle wrapper + constellation signing)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Shared Cloud-constellation signing key (vault checkout above).
          VAULT_DIR: ${{ github.workspace }}/.vault
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          # Picked up by build.sh step_build_fork via $ENV:COMMS_BUILD_TIMESTAMP
          COMMS_BUILD_TIMESTAMP: ${{ env.COMMS_BUILD_TIMESTAMP }}
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload fork APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-comms-${{ matrix.fork }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/cloud-comms-${{ matrix.fork }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish fork APK to GHCR
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$FORK"

      - name: Create GitHub Release (RSS update notification)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag stamp MUST equal the COMMS_BUILD_TIMESTAMP baked into this very
          # APK — the app parses the stamp after the tag's last '-'.
          TAG="cloud-comms-${FORK}-${COMMS_BUILD_TIMESTAMP}"
          # APK attached as release asset — the in-app updater (CommsUpdateWorker,
          # patch 0046+) LISTS releases and picks the newest tag with its own
          # prefix (cloud-comms-<fork>-). It does NOT use /releases/latest: the
          # unix repo's release space is shared (qute-standalone, cloud-terminal,
          # waydroid-apks, ...) so the repo-wide "Latest" badge is contended —
          # --latest=false keeps comms releases out of that fight and leaves the
          # badge to rolling-tag artifacts whose download URLs depend on it.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Cloud Mail · ${{ env.COMMS_BUILD_TIMESTAMP }}" \
            --notes "New build published to ghcr.io/diegonmarcos/cloud-comms-${FORK}:latest — install via Cloud Mail → About → Check for updates." \
            --latest=false \
            "${{ env.WORK_DIR }}/dist/cloud-comms-${FORK}.apk"

      # Hub re-bundle deliberately NOT dispatched here. See top-of-file comment.
