name: "Ship → /boot kernel cache (GHCR public)"

# POST-INCIDENT 2026-05-15. Third backup layer for the linux-surface kernel
# after the @nixos wipe destroyed the only locally-cached binary, forcing a
# ~26h rebuild on Surface Pro 8.
#
# Backup layers (in order checked at install time):
#   1. /nix/store        (lost on @nixos wipe — the failure mode we're fixing)
#   2. /boot/.nix-kernel-closure (off-pool ext4 substituter, set by
#                                  configuration_kernel_preservation.nix)
#   3. ghcr.io/<owner>/unix-boot-cache:latest  (off-machine — this workflow)
#
# FOUR ARTIFACT FAMILIES PUBLISHED PER RUN (user spec 2026-05-16):
#   - :nix-linux-<version>           — our Nix-format closure (NixOS via
#                                       `nix copy --from`)
#   - :deb-linux-surface-<version>   — upstream linux-surface .deb pass-through
#                                       (Debian/Kali/Ubuntu/Mint via
#                                       `dpkg -i /deb-cache/*.deb`)
#   - :arch-linux-surface-<version>  — upstream Arch .pkg.tar.zst pass-through
#                                       (Arch/Manjaro/EndeavourOS via
#                                       `pacman -U /arch-cache/*.pkg.tar.zst`)
#   - :fedora-linux-surface-<version> — upstream Fedora RPM pass-through
#                                       (Fedora/RHEL/Rocky/Alma via
#                                       `rpm -i /fedora-cache/*.rpm`)
#
# Disk note: linux-surface kernel build takes ~30-45 min on ubuntu-latest
# (4 vCPU / 16 GB). cache.nixos.org has no prebuilt binary for this exact
# derivation. We free disk first to avoid ENOSPC.

on:
  workflow_dispatch:
    inputs:
      make_public:
        description: "Set GHCR package visibility to public"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "aa_desk-usr_x86_surface-linux_nixos/src/flake.nix"
      - "aa_desk-usr_x86_surface-linux_nixos/src/flake.lock"
      - "aa_desk-usr_x86_surface-linux_nixos/src/modules/hardware_surface.nix"
      - "aa_desk-usr_x86_surface-linux_nixos/src/modules/hardware_bootloader_boot.nix"
      - "aa_desk-usr_x86_surface-linux_nixos/src/modules/boot.json"
      - "aa_bootloader/src/boot.json"
      - "1_workflows/src/cicd/ship-boot-cache.yml"

permissions:
  contents: read
  packages: write

jobs:
  ship-nix-cache:
    name: "Build + push Nix-format kernel closure"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk (~30 GB on runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://linux-surface.cachix.org https://nixos-surface.cachix.org
            extra-trusted-public-keys = linux-surface.cachix.org-1:f+M1d2Zq+TfvrcL3vrAJL3Pc4U5GbU+s5SCV5fAR4ow=

      - name: Resolve kernel version + hash
        id: meta
        working-directory: aa_desk-usr_x86_surface-linux_nixos/src
        run: |
          set -euo pipefail
          KVER=$(nix eval --raw .#nixosConfigurations.surface.config.boot.kernelPackages.kernel.version)
          KOUT=$(nix eval --raw .#nixosConfigurations.surface.config.boot.kernelPackages.kernel.outPath)
          KHASH=$(echo "$KOUT" | sed 's|/nix/store/||' | cut -d- -f1)
          IMAGE=ghcr.io/${{ github.repository_owner }}/unix-boot-cache
          echo "kver=${KVER}"        >> "$GITHUB_OUTPUT"
          echo "khash=${KHASH}"      >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"      >> "$GITHUB_OUTPUT"
          echo "tag_nix=nix-linux-${KVER}"        >> "$GITHUB_OUTPUT"
          echo "tag_latest=latest"                >> "$GITHUB_OUTPUT"

      - name: Build kernel + initrd derivations
        working-directory: aa_desk-usr_x86_surface-linux_nixos/src
        run: |
          set -euo pipefail
          nix build --print-out-paths --no-link \
            .#nixosConfigurations.surface.config.boot.kernelPackages.kernel
          nix build --print-out-paths --no-link \
            .#nixosConfigurations.surface.config.system.build.initialRamdisk

      - name: Stage Nix binary cache (kernel + initrd closures, zstd)
        id: stage_nix
        working-directory: aa_desk-usr_x86_surface-linux_nixos/src
        run: |
          set -euo pipefail
          STAGE=${{ runner.temp }}/boot-cache
          mkdir -p "$STAGE"
          nix copy --no-check-sigs --to "file://$STAGE?compression=zstd" \
            .#nixosConfigurations.surface.config.boot.kernelPackages.kernel
          nix copy --no-check-sigs --to "file://$STAGE?compression=zstd" \
            .#nixosConfigurations.surface.config.system.build.initialRamdisk
          du -sh "$STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Build + push OCI image (Nix-format)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG_NIX: ${{ steps.meta.outputs.tag_nix }}
          TAG_LATEST: ${{ steps.meta.outputs.tag_latest }}
          STAGE: ${{ steps.stage_nix.outputs.stage }}
          KHASH: ${{ steps.meta.outputs.khash }}
          KVER: ${{ steps.meta.outputs.kver }}
        run: |
          set -euo pipefail
          ctr=$(buildah from scratch)
          buildah copy "$ctr" "$STAGE" "/boot-cache"
          buildah config \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=NixOS-format binary cache: linux-surface ${KVER} kernel+initrd closure. Recover via: nix copy --no-check-sigs --from file://.../boot-cache --to local?root=/mnt/nixos&store=/nix/store --all" \
            --label "kernel.version=${KVER}" \
            --label "kernel.hash=${KHASH}" \
            "$ctr"
          buildah commit --rm "$ctr" "${IMAGE}:${TAG_NIX}"
          buildah tag "${IMAGE}:${TAG_NIX}" "${IMAGE}:${TAG_LATEST}"
          buildah login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          for t in "${TAG_NIX}" "${TAG_LATEST}"; do
            buildah push --format=oci "${IMAGE}:${t}" "docker://${IMAGE}:${t}"
          done

  ship-deb-passthrough:
    name: "Pass-through upstream linux-surface .deb"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest linux-surface .deb from upstream
        id: deb
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://raw.githubusercontent.com/linux-surface/linux-surface/master/pkg/keys/surface.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/surface.gpg
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/surface.gpg] https://pkg.surfacelinux.com/debian release main' \
            | sudo tee /etc/apt/sources.list.d/linux-surface.list
          sudo apt-get update -qq
          KVER=$(apt-cache madison linux-image-surface | head -1 | awk '{print $3}')
          mkdir -p ${{ runner.temp }}/debs
          cd ${{ runner.temp }}/debs
          # apt-get download fetches just the .deb without installing.
          sudo apt-get download linux-image-surface linux-headers-surface iptsd libwacom-surface 2>&1 || true
          ls -la
          IMAGE=ghcr.io/${{ github.repository_owner }}/unix-boot-cache
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_deb=deb-linux-surface-${KVER}" >> "$GITHUB_OUTPUT"
          echo "tag_deb_latest=deb-latest" >> "$GITHUB_OUTPUT"
          echo "stage=${{ runner.temp }}/debs" >> "$GITHUB_OUTPUT"

      - name: Build + push OCI image (Debian .deb pass-through)
        env:
          IMAGE: ${{ steps.deb.outputs.image }}
          TAG_DEB: ${{ steps.deb.outputs.tag_deb }}
          TAG_DEB_LATEST: ${{ steps.deb.outputs.tag_deb_latest }}
          STAGE: ${{ steps.deb.outputs.stage }}
          KVER: ${{ steps.deb.outputs.kver }}
        run: |
          set -euo pipefail
          ctr=$(buildah from scratch)
          buildah copy "$ctr" "$STAGE" "/deb-cache"
          buildah config \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Upstream linux-surface ${KVER} Debian packages passed through verbatim. Install via: dpkg -i /deb-cache/*.deb (on Debian/Kali). For NixOS use the :nix-linux-* tag instead." \
            --label "kernel.version=${KVER}" \
            "$ctr"
          buildah commit --rm "$ctr" "${IMAGE}:${TAG_DEB}"
          buildah tag "${IMAGE}:${TAG_DEB}" "${IMAGE}:${TAG_DEB_LATEST}"
          buildah login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          for t in "${TAG_DEB}" "${TAG_DEB_LATEST}"; do
            buildah push --format=oci "${IMAGE}:${t}" "docker://${IMAGE}:${t}"
          done

  ship-arch-passthrough:
    name: "Pass-through upstream linux-surface Arch package"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest linux-surface .pkg.tar.zst + .sig from upstream
        id: arch
        run: |
          set -euo pipefail
          BASE=https://pkg.surfacelinux.com/arch
          STAGE=${{ runner.temp }}/arch
          mkdir -p "$STAGE"
          # LISTING-DRIVEN (2026-07-02 fix): download exactly the hrefs upstream
          # advertises — never construct filenames. The old code appended ".sig"
          # to the ".blob" name, but upstream serves sigs WITHOUT the .blob
          # suffix (…pkg.tar.zst.sig), so every run 404'd for 3 weeks. Only a
          # missing KERNEL package is fatal; any other absent file is skipped.
          LISTING=$(curl -fsSL "$BASE/" | grep -oE 'href="[^"?/][^"]*"' | sed -E 's/^href="(.*)"$/\1/')
          KPKG=$(echo "$LISTING" | grep -E '^linux-surface-[0-9].*-x86_64\.pkg\.tar\.zst(\.blob)?$' | sort -V | tail -1)
          [ -n "$KPKG" ] || { echo "::error::no linux-surface kernel package in upstream listing"; exit 1; }
          KVER=$(echo "$KPKG" | sed -E 's/^linux-surface-([0-9][^-]*-[0-9]+)-.*/\1/')
          WANT=$(echo "$LISTING" | grep -E '^(linux-surface(-headers|-secureboot-mok)?-[0-9].*\.pkg\.tar\.zst(\.blob)?(\.sig)?|linux-surface\.db(\.sig)?)$')
          echo "$WANT" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            curl -fsSL "$BASE/$f" -o "$STAGE/$f" \
              || echo "::warning::skipping absent upstream file: $f"
          done
          # Strip the .blob serving suffix (pacman expects bare .pkg.tar.zst).
          for f in "$STAGE"/*.blob; do
            [ -e "$f" ] && mv "$f" "${f%.blob}" || true
          done
          for f in "$STAGE"/*.blob.sig; do
            [ -e "$f" ] && mv "$f" "${f%.blob.sig}.sig" || true
          done
          ls -la "$STAGE"
          IMAGE=ghcr.io/${{ github.repository_owner }}/unix-boot-cache
          echo "kver=${KVER}"      >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"    >> "$GITHUB_OUTPUT"
          echo "tag_arch=arch-linux-surface-${KVER}" >> "$GITHUB_OUTPUT"
          echo "tag_arch_latest=arch-latest"          >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}"    >> "$GITHUB_OUTPUT"

      - name: Build + push OCI image (Arch .pkg.tar.zst pass-through)
        env:
          IMAGE: ${{ steps.arch.outputs.image }}
          TAG_ARCH: ${{ steps.arch.outputs.tag_arch }}
          TAG_ARCH_LATEST: ${{ steps.arch.outputs.tag_arch_latest }}
          STAGE: ${{ steps.arch.outputs.stage }}
          KVER: ${{ steps.arch.outputs.kver }}
        run: |
          set -euo pipefail
          ctr=$(buildah from scratch)
          buildah copy "$ctr" "$STAGE" "/arch-cache"
          buildah config \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Upstream linux-surface ${KVER} Arch packages (kernel + headers + secureboot-mok + repo db) passed through verbatim from pkg.surfacelinux.com/arch/. Install via: pacman -U /arch-cache/*.pkg.tar.zst (on Arch/Manjaro/EndeavourOS)." \
            --label "kernel.version=${KVER}" \
            "$ctr"
          buildah commit --rm "$ctr" "${IMAGE}:${TAG_ARCH}"
          buildah tag "${IMAGE}:${TAG_ARCH}" "${IMAGE}:${TAG_ARCH_LATEST}"
          buildah login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          for t in "${TAG_ARCH}" "${TAG_ARCH_LATEST}"; do
            buildah push --format=oci "${IMAGE}:${t}" "docker://${IMAGE}:${t}"
          done

  ship-fedora-passthrough:
    name: "Pass-through upstream linux-surface Fedora RPM"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest linux-surface RPMs from upstream Fedora repo
        id: fedora
        run: |
          set -euo pipefail
          BASE=https://pkg.surfacelinux.com/fedora
          STAGE=${{ runner.temp }}/fedora
          mkdir -p "$STAGE"
          # Pick the highest-numbered Fedora release directory available.
          ROOT_LISTING=$(curl -fsSL "$BASE/")
          FREL=$(echo "$ROOT_LISTING" | grep -oE 'href="f[0-9]+/"' | grep -oE 'f[0-9]+' | sort -V | tail -1)
          echo "Using Fedora release dir: $FREL"
          # LISTING-DRIVEN (2026-07-02 fix): RPMs live directly under $FREL/
          # (the old x86_64/ subdir 404s) and are served with a .rpm.blob
          # suffix. Download only the LATEST kernel version's files, strip
          # the .blob suffix locally.
          REL_LISTING=$(curl -fsSL "$BASE/$FREL/" | grep -oE 'href="[^"?/][^"]*"' | sed -E 's/^href="(.*)"$/\1/')
          KVER=$(echo "$REL_LISTING" | grep -E '^kernel-surface-[0-9]' | sed -E 's/^kernel-surface-([0-9][^-]*-[0-9]+)\..*/\1/' | sort -V | tail -1)
          [ -n "$KVER" ] || { echo "::error::no kernel-surface RPM in $BASE/$FREL/ listing"; exit 1; }
          echo "$REL_LISTING" | grep -E "^kernel-surface[a-z-]*-${KVER}\..*\.rpm(\.blob)?$" | while IFS= read -r rpm; do
            curl -fsSL "$BASE/$FREL/$rpm" -o "$STAGE/$rpm" \
              || echo "::warning::skipping absent upstream file: $rpm"
          done
          for f in "$STAGE"/*.blob; do
            [ -e "$f" ] && mv "$f" "${f%.blob}" || true
          done
          ls -la "$STAGE"
          IMAGE=ghcr.io/${{ github.repository_owner }}/unix-boot-cache
          echo "kver=${KVER}"      >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"    >> "$GITHUB_OUTPUT"
          echo "tag_fed=fedora-linux-surface-${KVER}"   >> "$GITHUB_OUTPUT"
          echo "tag_fed_latest=fedora-latest"            >> "$GITHUB_OUTPUT"
          echo "stage=${STAGE}"    >> "$GITHUB_OUTPUT"

      - name: Build + push OCI image (Fedora RPM pass-through)
        env:
          IMAGE: ${{ steps.fedora.outputs.image }}
          TAG_FED: ${{ steps.fedora.outputs.tag_fed }}
          TAG_FED_LATEST: ${{ steps.fedora.outputs.tag_fed_latest }}
          STAGE: ${{ steps.fedora.outputs.stage }}
          KVER: ${{ steps.fedora.outputs.kver }}
        run: |
          set -euo pipefail
          ctr=$(buildah from scratch)
          buildah copy "$ctr" "$STAGE" "/fedora-cache"
          buildah config \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Upstream linux-surface ${KVER} Fedora RPMs passed through verbatim from pkg.surfacelinux.com/fedora/. Install via: rpm -i /fedora-cache/*.rpm (on Fedora/RHEL/Rocky/Alma)." \
            --label "kernel.version=${KVER}" \
            "$ctr"
          buildah commit --rm "$ctr" "${IMAGE}:${TAG_FED}"
          buildah tag "${IMAGE}:${TAG_FED}" "${IMAGE}:${TAG_FED_LATEST}"
          buildah login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          for t in "${TAG_FED}" "${TAG_FED_LATEST}"; do
            buildah push --format=oci "${IMAGE}:${t}" "docker://${IMAGE}:${t}"
          done

  make-public:
    name: "Set GHCR package visibility to public"
    needs: [ship-nix-cache, ship-deb-passthrough, ship-arch-passthrough, ship-fedora-passthrough]
    runs-on: ubuntu-latest
    if: ${{ inputs.make_public != false }}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="unix-boot-cache"
          OWNER="${{ github.repository_owner }}"
          for endpoint in \
              "/user/packages/container/${PKG}/visibility" \
              "/orgs/${OWNER}/packages/container/${PKG}/visibility"; do
            echo "→ trying ${endpoint}"
            if gh api -X PATCH "${endpoint}" -f visibility=public 2>/tmp/err; then
              echo "::notice::Package ${PKG} is now public via ${endpoint}"
              exit 0
            else
              cat /tmp/err
            fi
          done
          echo "::warning::Could not set visibility via GITHUB_TOKEN — set manually"
