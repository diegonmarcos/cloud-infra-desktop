name: "Ship → Builder images (amd64 on GHA — arm64 stays on laptop until self-hosted oci-apps runner exists)"

# Multi-arch build pipeline for cloud-builder-x-* images.
#
# Architecture mandate (NO QEMU, EVER):
#   - amd64 → GHA ubuntu-latest (native) OR oci-analytics (native)
#   - arm64 → oci-apps (native via SSH from cloud-data-runners.json)
#
# This workflow handles ONLY the amd64 leg, on a GHA ubuntu-latest runner
# (native x86_64, no emulation). The arm64 leg is intentionally out of
# scope here — it requires either:
#   a) Composite actions for fetch-vault + WG-up + SSH-to-oci-apps in the
#      unix repo (mirror of cloud/.github/actions/fetch-vault/), then a
#      `_build_push_arch` invocation. Future work.
#   b) Registering oci-apps as a self-hosted GHA runner labeled `arm64`,
#      then runs-on: [self-hosted, arm64]. Future work.
# Until then, arm64 rebuild stays on the developer laptop via
# `cb_containers-builders/build.sh ship cloud-builder-x-deb-nixhm`
# (which uses cloud-data-runners.json to SSH to oci-apps natively).
#
# The amd64 image alone is enough to unblock GHA-driven consumer
# workflows (cloud:Ship → terraform / gen-configs / home-manager all run
# on ubuntu-latest = amd64). arm64 consumers (Ship → oci-apps shipping
# c3-infra-api etc.) currently use the previous `latest` digest until a
# fresh arm64 leg lands.
#
# Tags pushed:
#   ghcr.io/diegonmarcos/<variant>:latest        — amd64 only for now
#   ghcr.io/diegonmarcos/<variant>:<short-sha>   — amd64 only for now
# When the arm64 leg lands, both tags become multi-arch manifest lists.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant"
        required: false
        type: choice
        default: "cloud-builder-x-deb-nixhm"
        options:
          - cloud-builder-x-deb-nixhm
          - cloud-builder-x-deb-apt
          - all
  push:
    branches: [main]
    paths:
      - "cb_containers-builders/build.json"
      - "cb_containers-builders/src/**"
      - "cb_containers-builders/dist/docker-deps.sh"
      - "cb_containers-builders/dist/Dockerfile.*"
      - "1_workflows/src/cicd/ship-builders.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ship-builders-${{ github.event.inputs.variant || 'auto' }}
  cancel-in-progress: false

jobs:
  matrix:
    name: "Resolve variants"
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.resolve.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve variant list from build.json
        id: resolve
        run: |
          BJ="cb_containers-builders/build.json"
          [ -f "$BJ" ] || { echo "::error::$BJ not found"; exit 1; }
          INPUT='${{ github.event.inputs.variant }}'
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            VARIANTS=$(jq -c '[.images | keys[]]' "$BJ")
          else
            jq -e --arg v "$INPUT" '.images[$v]' "$BJ" >/dev/null \
              || { echo "::error::Variant '$INPUT' not in $BJ"; exit 1; }
            VARIANTS=$(jq -c -n --arg v "$INPUT" '[$v]')
          fi
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"
          echo "Resolved variants: $VARIANTS"

  build-amd64:
    name: "Build amd64 ${{ matrix.variant }}"
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image metadata from build.json
        id: meta
        run: |
          BJ="cb_containers-builders/build.json"
          VARIANT='${{ matrix.variant }}'
          IMAGE=$(jq -r --arg v "$VARIANT" '.images[$v].ghcr' "$BJ")
          DOCKERFILE_REL=$(jq -r --arg v "$VARIANT" '.images[$v].dockerfile' "$BJ")
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "image=$IMAGE"
            echo "dockerfile=cb_containers-builders/$DOCKERFILE_REL"
            echo "context=cb_containers-builders/dist"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Image:      $IMAGE"
          echo "Dockerfile: cb_containers-builders/$DOCKERFILE_REL"
          echo "Context:    cb_containers-builders/dist"
          echo "Short SHA:  $SHORT_SHA"

      - name: Sanity-check dist/ present
        run: |
          REQ="cb_containers-builders/dist"
          [ -d "$REQ" ] || { echo "::error::$REQ missing — run cb_containers-builders/build.sh build + commit dist/"; exit 1; }
          for f in docker-deps.sh Dockerfile.apt Dockerfile.x-deb-nixhm docker/entrypoint.sh; do
            [ -f "$REQ/$f" ] || { echo "::error::$REQ/$f missing — run build.sh build + commit dist/"; exit 1; }
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 natively + push
        # No buildx, no QEMU. Plain native docker build on the amd64 GHA
        # runner. Tags both :latest and :<short-sha>. When the arm64 leg
        # eventually lands (via SSH to oci-apps), both tags become manifest
        # lists; for now they reference the amd64 manifest directly.
        run: |
          IMAGE='${{ steps.meta.outputs.image }}'
          SHA='${{ steps.meta.outputs.short_sha }}'
          DOCKERFILE='${{ steps.meta.outputs.dockerfile }}'
          CONTEXT='${{ steps.meta.outputs.context }}'
          DOCKER_BUILDKIT=1 docker build \
            --network=host \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHA" \
            -f "$DOCKERFILE" \
            "$CONTEXT"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"

      - name: Smoke-test image — verify baked binaries on PATH
        run: |
          IMAGE='${{ steps.meta.outputs.image }}:latest'
          MISSING=""
          for bin in wrangler terraform jq sops age npm node curl; do
            docker run --rm --entrypoint sh "$IMAGE" -c "command -v $bin >/dev/null 2>&1" \
              || MISSING="$MISSING $bin"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Required binaries missing from $IMAGE:$MISSING"
            echo "::error::Check cb_containers-builders/dist/docker-deps.sh and src/Dockerfile.*"
            exit 1
          fi
          # Verify node major version satisfies docker_npm engine constraints.
          NODE_MAJOR=$(docker run --rm --entrypoint sh "$IMAGE" -c "node -e 'console.log(process.versions.node.split(\".\")[0])'")
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "::error::node major=$NODE_MAJOR in $IMAGE; wrangler@4.x requires >=22"
            exit 1
          fi
          # Wrangler-specific runtime check (b0b897e regression: installed but unrunnable).
          docker run --rm --entrypoint sh "$IMAGE" -c "wrangler --version >/dev/null 2>&1" \
            || { echo "::error::wrangler refuses to run in $IMAGE — likely node version mismatch"; exit 1; }
          echo "Smoke-test OK: amd64, node $NODE_MAJOR, all required binaries."
