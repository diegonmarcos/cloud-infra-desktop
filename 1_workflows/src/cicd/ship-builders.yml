name: "Ship → Builder images (TWO NATIVE RUNNERS: amd64 on GHA, arm64 on oci-apps self-hosted → multi-arch :latest)"

# Multi-arch build pipeline for cloud-builder-x-* images.
#
# Architecture mandate (NO QEMU, EVER — and NEVER a single-arch :latest):
#   - amd64 → GHA ubuntu-latest (native)            → pushes :amd64 + :<sha>-amd64
#   - arm64 → oci-apps self-hosted runner (native)  → pushes :arm64 + :<sha>-arm64
#   - manifest job merges both → :latest + :<sha> multi-arch manifest lists
#
# The arm64 runner is `oci-apps-arm64-unix` (infra-bld_gha-runner service in
# the cloud repo — registrations[] in its build.json, one per repo since
# personal accounts have no org-level runners).
#
# INCIDENT 2026-07-02: a previous version pushed an amd64-only :latest,
# overwriting the multi-arch manifest — every arm64 consumer (the oci-apps
# builder container, all arm service builds) hit `exec format error` and
# the fleet's arm builds died. :latest is now written ONLY by the manifest
# job, from both arch tags, and verified to contain both platforms.
#
# Tags pushed:
#   ghcr.io/diegonmarcos/<variant>:amd64 / :arm64      — per-arch legs
#   ghcr.io/diegonmarcos/<variant>:<short-sha>-<arch>  — pinned per-arch
#   ghcr.io/diegonmarcos/<variant>:latest / :<sha>     — multi-arch manifests

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant"
        required: false
        type: choice
        default: "cloud-builder-x-deb-nixhm"
        options:
          - cloud-builder-x-deb-nixhm
          - cloud-builder-x-deb-apt
          - all
  push:
    branches: [main]
    paths:
      - "cb_containers-builders/build.json"
      - "cb_containers-builders/src/**"
      - "cb_containers-builders/dist/docker-deps.sh"
      - "cb_containers-builders/dist/Dockerfile.*"
      - "1_workflows/src/cicd/ship-builders.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ship-builders-${{ github.event.inputs.variant || 'auto' }}
  cancel-in-progress: false

jobs:
  matrix:
    name: "Resolve variants"
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.resolve.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve variant list from build.json
        id: resolve
        run: |
          BJ="cb_containers-builders/build.json"
          [ -f "$BJ" ] || { echo "::error::$BJ not found"; exit 1; }
          INPUT='${{ github.event.inputs.variant }}'
          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            VARIANTS=$(jq -c '[.images | keys[]]' "$BJ")
          else
            jq -e --arg v "$INPUT" '.images[$v]' "$BJ" >/dev/null \
              || { echo "::error::Variant '$INPUT' not in $BJ"; exit 1; }
            VARIANTS=$(jq -c -n --arg v "$INPUT" '[$v]')
          fi
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"
          echo "Resolved variants: $VARIANTS"

  build-amd64:
    name: "Build amd64 ${{ matrix.variant }}"
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image metadata from build.json
        id: meta
        run: |
          BJ="cb_containers-builders/build.json"
          VARIANT='${{ matrix.variant }}'
          IMAGE=$(jq -r --arg v "$VARIANT" '.images[$v].ghcr' "$BJ")
          DOCKERFILE_REL=$(jq -r --arg v "$VARIANT" '.images[$v].dockerfile' "$BJ")
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "image=$IMAGE"
            echo "dockerfile=cb_containers-builders/$DOCKERFILE_REL"
            echo "context=cb_containers-builders/dist"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Image:      $IMAGE"
          echo "Dockerfile: cb_containers-builders/$DOCKERFILE_REL"
          echo "Context:    cb_containers-builders/dist"
          echo "Short SHA:  $SHORT_SHA"

      - name: Sanity-check dist/ present
        run: |
          REQ="cb_containers-builders/dist"
          [ -d "$REQ" ] || { echo "::error::$REQ missing — run cb_containers-builders/build.sh build + commit dist/"; exit 1; }
          for f in docker-deps.sh Dockerfile.apt Dockerfile.x-deb-nixhm docker/entrypoint.sh; do
            [ -f "$REQ/$f" ] || { echo "::error::$REQ/$f missing — run build.sh build + commit dist/"; exit 1; }
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 natively + push
        # No buildx, no QEMU. Plain native docker build on the amd64 GHA
        # runner. Pushes :amd64 and :<short-sha> ONLY.
        # INCIDENT 2026-07-02: this step used to also push :latest — an
        # amd64-only manifest overwriting the multi-arch list — so every
        # arm64 consumer (oci-apps builder, arm service builds) got
        # `exec format error` on next pull and the fleet's arm builds died.
        # :latest is owned EXCLUSIVELY by the laptop's multi-arch ship
        # (cb_containers-builders/build.sh ship — buildx amd64+arm64).
        run: |
          IMAGE='${{ steps.meta.outputs.image }}'
          SHA='${{ steps.meta.outputs.short_sha }}'
          DOCKERFILE='${{ steps.meta.outputs.dockerfile }}'
          CONTEXT='${{ steps.meta.outputs.context }}'
          DOCKER_BUILDKIT=1 docker build \
            --network=host \
            -t "$IMAGE:amd64" \
            -t "$IMAGE:$SHA-amd64" \
            -f "$DOCKERFILE" \
            "$CONTEXT"
          docker push "$IMAGE:amd64"
          docker push "$IMAGE:$SHA-amd64"

      - name: Smoke-test image — verify baked binaries on PATH
        run: |
          IMAGE='${{ steps.meta.outputs.image }}:amd64'
          MISSING=""
          for bin in wrangler terraform jq sops age npm node curl; do
            docker run --rm --entrypoint sh "$IMAGE" -c "command -v $bin >/dev/null 2>&1" \
              || MISSING="$MISSING $bin"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Required binaries missing from $IMAGE:$MISSING"
            echo "::error::Check cb_containers-builders/dist/docker-deps.sh and src/Dockerfile.*"
            exit 1
          fi
          # Verify node major version satisfies docker_npm engine constraints.
          NODE_MAJOR=$(docker run --rm --entrypoint sh "$IMAGE" -c "node -e 'console.log(process.versions.node.split(\".\")[0])'")
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "::error::node major=$NODE_MAJOR in $IMAGE; wrangler@4.x requires >=22"
            exit 1
          fi
          # Wrangler-specific runtime check (b0b897e regression: installed but unrunnable).
          docker run --rm --entrypoint sh "$IMAGE" -c "wrangler --version >/dev/null 2>&1" \
            || { echo "::error::wrangler refuses to run in $IMAGE — likely node version mismatch"; exit 1; }
          echo "Smoke-test OK: amd64, node $NODE_MAJOR, all required binaries."

  build-arm64:
    name: "Build arm64 ${{ matrix.variant }} (self-hosted oci-apps)"
    needs: matrix
    runs-on: [self-hosted, arm64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image metadata from build.json
        id: meta
        run: |
          BJ="cb_containers-builders/build.json"
          VARIANT='${{ matrix.variant }}'
          IMAGE=$(jq -r --arg v "$VARIANT" '.images[$v].ghcr' "$BJ")
          DOCKERFILE_REL=$(jq -r --arg v "$VARIANT" '.images[$v].dockerfile' "$BJ")
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "image=$IMAGE"
            echo "dockerfile=cb_containers-builders/$DOCKERFILE_REL"
            echo "context=cb_containers-builders/dist"
            echo "short_sha=$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 natively + push
        # Native docker build on the oci-apps A1 (aarch64) runner — the
        # runner container mounts /var/run/docker.sock, so builds land on
        # the host daemon. NO QEMU. Pushes :arm64 and :<sha>-arm64 only;
        # :latest is written exclusively by the manifest job below.
        run: |
          IMAGE='${{ steps.meta.outputs.image }}'
          SHA='${{ steps.meta.outputs.short_sha }}'
          DOCKERFILE='${{ steps.meta.outputs.dockerfile }}'
          CONTEXT='${{ steps.meta.outputs.context }}'
          DOCKER_BUILDKIT=1 docker build \
            --network=host \
            -t "$IMAGE:arm64" \
            -t "$IMAGE:$SHA-arm64" \
            -f "$DOCKERFILE" \
            "$CONTEXT"
          docker push "$IMAGE:arm64"
          docker push "$IMAGE:$SHA-arm64"

      - name: Smoke-test image — verify baked binaries on PATH
        run: |
          IMAGE='${{ steps.meta.outputs.image }}:arm64'
          MISSING=""
          for bin in wrangler terraform jq sops age npm node curl; do
            docker run --rm --entrypoint sh "$IMAGE" -c "command -v $bin >/dev/null 2>&1" \
              || MISSING="$MISSING $bin"
          done
          [ -z "$MISSING" ] || { echo "::error::Required binaries missing from $IMAGE:$MISSING"; exit 1; }
          echo "Smoke-test OK: arm64, all required binaries."

  manifest:
    name: "Publish multi-arch :latest ${{ matrix.variant }}"
    needs: [matrix, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image metadata
        id: meta
        run: |
          BJ="cb_containers-builders/build.json"
          IMAGE=$(jq -r --arg v '${{ matrix.variant }}' '.images[$v].ghcr' "$BJ")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + verify multi-arch manifests
        # TESTER built in: after creating :latest, inspect it and FAIL unless
        # BOTH linux/amd64 and linux/arm64 are present — a single-arch
        # :latest can never be published again.
        run: |
          IMAGE='${{ steps.meta.outputs.image }}'
          SHA='${{ steps.meta.outputs.short_sha }}'
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA" \
            "$IMAGE:amd64" "$IMAGE:arm64"
          PLATFORMS=$(docker buildx imagetools inspect "$IMAGE:latest" --raw \
            | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
          echo "platforms in :latest → $PLATFORMS"
          case "$PLATFORMS" in
            *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) echo "multi-arch OK" ;;
            *) echo "::error::$IMAGE:latest is not multi-arch ($PLATFORMS)"; exit 1 ;;
          esac
