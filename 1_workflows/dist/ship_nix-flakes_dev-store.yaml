name: "Ship → Dev-store closure (build remotely, never freeze the laptop)"

# WHY: bc_flakes_dev-store realises devProfile — the heavy dev toolchain
# (~25G closure) — into the p5 CHROOT store. Building it locally means a big
# nix eval + realise on the 8GB Surface = the same freeze axis as the NixOS /
# home-manager builds. Build it on a GHA x86 runner; the laptop only IMPORTS
# the prebuilt closure into the p5 chroot store (no eval) via `build.sh pull`.
#
# ALL logic in bc_flakes_dev-store/build.sh (verb: ci-build). Thin YAML.
# devProfile is an attr of the DESKTOP flake, so source there triggers too.
# x86_64 toolchain -> native x86 runner (no QEMU). No secrets needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bc_flakes_dev-store/**"
      - "ba_flakes_desktop/src/**"
      - "1_workflows/src/cicd/ship_nix-flakes_dev-store.yaml"

permissions:
  contents: read
  packages: write        # push the incremental layered dev-store cache image to GHCR

concurrency:
  group: ship-dev-store
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build + export dev-store closure
        env:
          GHCR_PUSH: "1"                       # build.sh also builds+pushes the layered cache image
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./bc_flakes_dev-store/build.sh ci-build

      - uses: actions/upload-artifact@v4
        with:
          name: nixos-dev-store-closure
          path: bc_flakes_dev-store/dist-ci/
          retention-days: 7
          compression-level: 0
