name: ship-my-ai-app
# Build the my-ai Rust workspace, matrixed per-arch. my-ai (CLI) + my-ai-dash
# (ratatui TTY) are pure Rust → built for x86_64 AND aarch64. my-ai-gui (Tauri v2
# systray/webview) needs webkit → x86_64 only (build.gui_arches). Toolchain comes
# from da_my-ai/flake.nix; CI just needs nix. Publishes arch-suffixed binaries
# (+ x86 .deb) to a rolling GitHub Release (my-ai-latest): desktop (x86_64) pulls
# the trio, termux (aarch64) pulls cli+dash — via da_my-ai/build.sh install.
on:
  push:
    branches: [main]
    paths:
      - 'da_my-ai/**'
      - '1_workflows/src/cicd/ship-my-ai-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: da_my-ai
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compile-verify (build.sh check)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh check

      - name: Build release binaries (build.sh build)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh build

      - name: Stage arch-suffixed assets (build.sh stage)
        run: ./build.sh stage

      - uses: actions/upload-artifact@v4
        with:
          name: my-ai-${{ matrix.arch }}
          path: da_my-ai/dist-assets/**
          if-no-files-found: warn

      - name: Publish to rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create my-ai-latest \
            --title "my-ai (rolling)" \
            --notes "Latest multi-arch build — main@${GITHUB_SHA:0:8}. Fetch via da_my-ai/build.sh install." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload my-ai-latest dist-assets/* --clobber
