name: "Ship → Container images"

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Update submodules
        run: git submodule update --remote

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve builder image from cb_containers-builders/build.json
        id: img
        run: |
          set -euo pipefail
          master="cb_containers-builders/build.json"
          if [ ! -f "$master" ]; then
            echo "::error::$master not found — unix repo layout changed"
            exit 1
          fi
          ghcr=$(jq -r '.images["cloud-builder-x-deb-nixhm"].ghcr // empty' "$master")
          if [ -z "$ghcr" ] || [ "$ghcr" = "null" ]; then
            echo "::error::cb_containers-builders/build.json missing .images['cloud-builder-x-deb-nixhm'].ghcr"
            exit 1
          fi
          image="${ghcr}:latest"
          echo "Resolved BUILDER_IMAGE=$image"
          echo "BUILDER_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Ship via builder container
        run: |
          docker pull "$BUILDER_IMAGE"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTOR="${{ github.actor }}" \
            "$BUILDER_IMAGE" \
            bash -c "cd /workspace && sh ca_containers_user/build.sh ship"
