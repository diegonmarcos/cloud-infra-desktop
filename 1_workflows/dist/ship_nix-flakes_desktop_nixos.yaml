name: "Ship → Desktop NixOS closure (build remotely, never freeze the laptop)"

# WHY: the Surface (8 GB) cannot run `nixos-rebuild` locally — the eval+build
# over-commits RAM and thrashes into a freeze (14 incidents, 2026-06-27). This
# builds the system closure on a GHA runner instead and ships it as an artifact;
# the laptop only IMPORTS + activates it (Phase 2, no eval) via `build.sh pull`.
#
# ALL logic lives in aa_desk-usr_x86_surface-linux_nixos/build.sh (verb: ci-build).
# This YAML only: free disk → install nix → call build.sh → upload the tarball.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aa_desk-usr_x86_surface-linux_nixos/src/**"
      - "aa_desk-usr_x86_surface-linux_nixos/build.sh"
      - "1_workflows/src/cicd/ship_nix-flakes_desktop_nixos.yaml"

permissions:
  contents: read
  packages: write   # pull ghcr.io/<owner>/unix-boot-cache (kernel) + push the incremental layered system cache image

# cancel-in-progress:false (2026-07-02): with :true, every push (incl.
# auto-sync) cancelled the in-flight closure build — 6+ runs died tonight,
# one at 2h13m, and NO closure ever landed. Long builds must complete;
# a newer push simply queues (GitHub keeps only the newest pending run).
concurrency:
  group: ship-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 210   # linux-surface kernel compiles from source on a 2-core runner (~140m); boot-cache hit will later cut this — see ship-boot-cache attr-match follow-up
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build + export system closure (+ push incremental GHCR cache)
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PUSH: "1"                       # build.sh also builds+pushes the layered cache image
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYSTEM_CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/unix-system-cache
        run: ./aa_desk-usr_x86_surface-linux_nixos/build.sh ci-build

      - uses: actions/upload-artifact@v4
        with:
          name: nixos-surface-closure
          path: aa_desk-usr_x86_surface-linux_nixos/dist-ci/
          retention-days: 7
          compression-level: 0

      # closure DIFF vs the laptop's committed have-paths — small download,
      # never the 7GB GHCR mono-layer (2026-07-22)
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-surface-closure-diff
          path: aa_desk-usr_x86_surface-linux_nixos/dist-ci-diff/
          retention-days: 7
          compression-level: 0

      # auto-switch trigger: laptop's nixos-switch-autotrigger service
      # subscribes to this ntfy topic and runs build.sh switch on receipt
      - name: Notify laptop — closure ready
        if: success()
        run: curl -s -d "closure-ready ${{ github.sha }}" https://ntfy.sh/diegonmarcos-nixos-switch-x7k2
