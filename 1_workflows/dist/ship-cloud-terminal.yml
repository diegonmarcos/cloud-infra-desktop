name: ship-cloud-terminal
# Compile-verify + build the Tauri (Rust) cloud-terminal. Toolchain comes from
# the project flake (rust + cargo-tauri + webkitgtk); CI just needs nix. The
# GitHub runner has the RAM the local Surface Pro's watchdog denies, so this is
# where the Rust actually gets compiled. Uploads the binary + deb/appimage
# bundles as artifacts.
# TODO(release): oras-push / gh-release once build.sh grows the Tauri release
# pipeline (artifact model differs from the old electron tar.zst payload).
on:
  push:
    branches: [main]
    paths:
      - 'da_cloud-terminal/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_cloud-terminal
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Compile-verify first (fast-fail on type errors), then the full release
      # build (binary + deb/appimage). Runner has ~16 GB, so let cargo use all
      # cores instead of the low-RAM default.
      - name: Compile-verify (build.sh check)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh check

      - name: Build release bundle (build.sh build)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-terminal-bundle
          path: |
            da_cloud-terminal/src-tauri/target/release/cloud-terminal
            da_cloud-terminal/src-tauri/target/release/bundle/**
          if-no-files-found: warn

      # Publish the binary + .deb to a rolling GitHub Release so it's installable
      # off the release page (not just workflow artifacts). Overwrites each push.
      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create cloud-terminal-latest \
            --title "Cloud Terminal (rolling)" \
            --notes "Latest Tauri build — main@${GITHUB_SHA:0:8}. Install the .deb, or fetch via da_cloud-terminal/build.sh fetch/run." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload cloud-terminal-latest \
            src-tauri/target/release/cloud-terminal \
            src-tauri/target/release/bundle/deb/*.deb \
            --clobber
