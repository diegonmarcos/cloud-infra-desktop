name: "Ship → Superapp APK (build + push to GHCR via ORAS + attach to GH Release)"

# Builds the diego superapp APK from ea_superapp/ and publishes via two
# channels — both data-driven by ea_superapp/build.json::release:
#
#   1. ORAS push as OCI artifact      → ghcr.io/<ns>/<image>:<tags>
#      Always runs on main pushes (release.ghcr.tags expanded from build.json).
#      ORAS lets us publish the raw APK as an OCI blob (not a container image)
#      so any OCI-aware tooling can pull it: oras pull, crane export, podman
#      image pull --tls-verify, etc.
#
#   2. GH Release attachment           → APK on a tagged release
#      Only fires on tag push matching release.gh_release.tag_pattern
#      (default: ea_superapp-v*). Lets phone-side install pick up "latest
#      version" via the gh-release JSON API or a fixed deep link.
#
# All registry, tag, asset-name strings live in ea_superapp/build.json —
# this workflow never hardcodes any of that. The only "knob" here is which
# build.sh subcommand to invoke; engine reads build.json for the rest.
#
# Triggers:
#   - push to main on paths under ea_superapp/  → build + oras push :latest + :sha
#   - push tag `ea_superapp-v*`                  → build + oras push :latest + :sha + :version + gh release
#   - workflow_dispatch                          → manual, same as main push

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release (needs tag context)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ea_superapp-v*"
    paths:
      - "ea_superapp/**"
      - "1_workflows/src/cicd/ship-superapp.yml"
      - ".github/workflows/ship-superapp.yml"

permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

env:
  WORK_DIR: ea_superapp

jobs:
  build_and_publish:
    name: "Build APK + Push (ubuntu-latest, native amd64)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 platforms;android-26 build-tools;34.0.0 platform-tools"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v3

      - name: Install ORAS + gh CLI + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # gh CLI is preinstalled on ubuntu-latest; verify.
          command -v gh
          # ORAS install (single binary).
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version

      - name: Determine variant
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      # BYPASS_NIX=1 because GHA already provides JDK + SDK + Gradle —
      # devShell would just re-download them. The engine still reads
      # build.json + build.gradle for everything else (toolchain pins,
      # module graph, registry config, tags).
      - name: Build APK (engine)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: superapp-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh oras-push

      # ── GH Release on tag push (engine reads build.json::release.gh_release) ──
      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/ea_superapp-v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./build.sh gh-release
