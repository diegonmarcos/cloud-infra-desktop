name: "Ship → Builder images (manual, local)"

# The CI build pipeline for cloud-builder-x-deb-nixhm lives in the cloud repo
# at .github/workflows/ship-ci-image.yml — it has the SSH/WG secrets needed
# to delegate arm64 builds to oci-apps (no QEMU).
#
# This workflow is kept only for ad-hoc manual runs from the unix repo. It
# will fail the arm64 step without WG/OCI secrets, which is intentional —
# the declarative path is the cloud repo workflow.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant (cloud-builder-x-deb-nixhm, cloud-builder-x-deb-apt, all)"
        required: false
        default: "cloud-builder-x-deb-nixhm"

permissions:
  contents: read
  packages: write

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect to cloud workflow
        run: |
          echo "::warning::This workflow is a stub. The canonical build pipeline"
          echo "::warning::lives in diegonmarcos/cloud at .github/workflows/ship-ci-image.yml"
          echo "::warning::Trigger it with: gh workflow run ship-ci-image.yml --repo diegonmarcos/cloud"
          exit 1
