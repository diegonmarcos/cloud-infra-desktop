name: "Ship → Builder images"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant (cloud-builder-x-deb-nixhm, cloud-builder-x-deb-apt, all)"
        required: false
        default: "cloud-builder-x-deb-nixhm"

permissions:
  contents: read
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout cloud (sibling, for config.json)
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/cloud
          path: cloud-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Ship via runner (jq + docker buildx native)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          cd cb_containers-builders
          sh build.sh ship ${{ github.event.inputs.variant }}
