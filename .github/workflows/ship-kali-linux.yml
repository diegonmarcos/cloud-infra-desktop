name: "Ship → Kali fallback (GHCR public)"

# Builds ab_fallback_os/ab_kali_security/container/ via its build.sh,
# pushes to ghcr.io/<owner>/kali-linux:{latest,full}, then flips
# the package to PUBLIC visibility.
#
# Note on disk: kali-linux-everything image is ~34 GB. Standard ubuntu-latest
# runners ship with ~14 GB free, so the first step nukes pre-installed cruft
# to recover ~30 GB before the build starts.

on:
  workflow_dispatch:
    inputs:
      make_public:
        description: "Set GHCR package visibility to public"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "ab_fallback_os/ab_kali_security/container/**"
      - "1_workflows/src/cicd/ship-kali-linux.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space (~30 GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push via build.sh ship
        working-directory: ab_fallback_os/ab_kali_security/container
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh ship

      - name: Make GHCR package public
        if: ${{ inputs.make_public != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="kali-linux"
          OWNER="${{ github.repository_owner }}"

          # Try user-owned first, then org-owned. PATCH is idempotent.
          for endpoint in \
              "/user/packages/container/${PKG}/visibility" \
              "/orgs/${OWNER}/packages/container/${PKG}/visibility"; do
              echo "→ trying ${endpoint}"
              if gh api -X PATCH "${endpoint}" -f visibility=public 2>/tmp/err; then
                  echo "::notice::Package ${PKG} is now public via ${endpoint}"
                  exit 0
              else
                  cat /tmp/err
              fi
          done
          echo "::warning::Could not set visibility via GITHUB_TOKEN — set manually:"
          echo "::warning::  gh api -X PATCH /user/packages/container/${PKG}/visibility -f visibility=public"

      - name: Verify public pull works
        if: ${{ success() }}
        run: |
          docker logout ghcr.io || true
          docker pull "ghcr.io/${{ github.repository_owner }}/kali-linux:latest" \
            && echo "::notice::Anonymous pull succeeded — image is public"
