name: "Ship → Cloud SuperApp APK (build + push to GHCR via ORAS + attach to GH Release)"

# Builds the Cloud SuperApp APK from ea_cloud-superapp/ and publishes via two
# channels — both data-driven by ea_cloud-superapp/build.json::release:
#
#   1. ORAS push as OCI artifact      → ghcr.io/<ns>/<image>:<tags>
#      Always runs on main pushes (release.ghcr.tags expanded from build.json).
#      ORAS lets us publish the raw APK as an OCI blob (not a container image)
#      so any OCI-aware tooling can pull it: oras pull, crane export, podman
#      image pull --tls-verify, etc.
#
#   2. GH Release attachment           → APK on a tagged release
#      Only fires on tag push matching release.gh_release.tag_pattern
#      (default: ea_cloud-superapp-v*). Lets phone-side install pick up
#      "latest version" via the gh-release JSON API or a fixed deep link.
#
# All registry, tag, asset-name strings live in ea_cloud-superapp/build.json —
# this workflow never hardcodes any of that. The only "knob" here is which
# build.sh subcommand to invoke; engine reads build.json for the rest.
#
# Triggers:
#   - push main on paths under ea_cloud-superapp/  → build + oras push :latest + :sha
#   - push tag `ea_cloud-superapp-v*`              → build + oras push :latest + :sha + :version + gh release
#   - workflow_dispatch                            → manual, same as main push

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        type: choice
        default: "debug"
        options:
          - debug
          - release
      push_oras:
        description: "Push APK to GHCR via ORAS"
        required: false
        type: boolean
        default: true
      create_release:
        description: "Create GitHub Release (needs tag context)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags:
      - "ea_cloud-superapp-v*"
    paths:
      - "ea_cloud-superapp/**"
      - "1_workflows/src/cicd/ship-cloud-superapp.yml"
      # Generated .github/workflows/*.yml intentionally NOT watched (regenerated
      # by 1_workflows/build.sh → would self-trigger rebuilds on unrelated commits).

permissions:
  contents: write   # for gh release create + tag push reads
  packages: write   # for ghcr push (oras)

env:
  WORK_DIR: ea_cloud-superapp

jobs:
  build_and_publish:
    name: "Build APK + Push (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One job per ABI variant (build.json::release.variants[].id). arm64 is
      # the canonical phone build; x86_64 is for Waydroid / desktop emulators.
      # fail-fast: false so an x86_64 hiccup never blocks the arm64 release.
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so build.sh can `git rev-parse`

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pre-install the two native toolchains the build needs, so AGP
          # never races to install them lazily during parallel per-ABI native
          # tasks (corrupt-zip flake). Versions MUST match each module's
          # build.gradle + ea_cloud-superapp/{build.json::toolchain,flake.nix}:
          #   • cmake;3.22.1 + ndk;26.1.10909125 — libs:net (libwg-go.so).
          #   • ndk;28.0.13004108              — libs:keyboard (HeliBoard
          #     libjni_latinime.so, ndk-build).
          # platforms;android-36 + build-tools;36.0.0 added for the HeliBoard
          # bump (AGP 8.13.2 / Kotlin 2.3.20 / compileSdk 36). 35/34/26 kept for
          # the rest of the modules + NDK-side builds that still target them.
          packages: "platforms;android-36 platforms;android-35 platforms;android-34 platforms;android-26 build-tools;36.0.0 build-tools;35.0.0 build-tools;34.0.0 platform-tools cmake;3.22.1 ndk;28.0.13004108 ndk;26.1.10909125"

      - name: Set up Gradle 8.14 (cached)
        uses: gradle/actions/setup-gradle@v3
        with:
          # Pin to build.json::toolchain.gradle. Bumped 8.10.2 -> 8.14 for the
          # HeliBoard toolchain (AGP 8.13.2 needs Gradle 8.13+; Kotlin 2.3.20
          # Compose-compiler plugin). Mirrors HeliBoard main's wrapper.
          gradle-version: "8.14"

      # ── Stable debug keystore (cached forever) ──────────────────────
      # Android refuses to install an APK as an update of a previously-
      # installed APK signed by a different key. Each fresh GHA runner
      # auto-generates ~/.android/debug.keystore with a fresh RSA key →
      # every CI build had a different signature → in-app updater would
      # download the new APK but PackageInstaller would silently reject
      # the install. Cache the keystore so it survives across runs.
      # Cache key is fixed → first run generates, all subsequent runs
      # restore from cache → consistent signature → updates work.
      # ── Shared constellation signing key (vault) ────────────────────
      # With BOTH VAULT_TOKEN + SOPS_AGE_KEY repo secrets set, fetch the SHARED
      # key from the private vault repo so this APK signs with the SAME key as
      # every constellation app (cross-app in-app updater never hits a signature
      # mismatch). Without the secrets every step no-ops → cached legacy keystore.
      - name: Detect vault signing availability
        id: vaultsign
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -n "$VAULT_TOKEN" ] && [ -n "$SOPS_AGE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout vault (shared signing key)
        if: steps.vaultsign.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: diegonmarcos/vault
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault-repo
          persist-credentials: false
      - name: Install sops + import age key
        if: steps.vaultsign.outputs.enabled == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /tmp/sops
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          printf '%s\n' "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Restore signing keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/app/keystores/debug.keystore
          # Bumped to v2 with a proper Spanish dname so the installer dialog
          # shows "Diego Marcos / Cloud SuperApp / diegonmarcos.com" instead
          # of "Desconocido". Cache-key bump forces a fresh keystore gen on
          # this run; future runs reuse it. One-time uninstall+reinstall
          # required on-device because the signing key changes.
          key: cloud-superapp-keystore-v2
      - name: Generate debug keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          mkdir -p app/keystores
          keytool -genkeypair -keystore app/keystores/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Diego Marcos, OU=Cloud SuperApp, O=diegonmarcos.com, L=Madrid, ST=Madrid, C=ES" \
            -keyalg RSA -keysize 2048 -validity 10950
          echo "Generated new keystore — cached as cloud-superapp-keystore-v2"

      - name: Install ORAS + gh CLI + jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          # gh CLI is preinstalled on ubuntu-latest; verify.
          command -v gh
          # ORAS install (single binary).
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version

      - name: Determine variant
        id: variant
        run: |
          if   [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "variant=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # ── Build via build.sh (engine) ─────────────────────────────────
      # BYPASS_NIX=1 because GHA already provides JDK + SDK + Gradle —
      # devShell would just re-download them. The engine still reads
      # build.json + build.gradle for everything else (toolchain pins,
      # module graph, registry config, tags).
      - name: Build APK (engine)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          # Points build.sh::_resolve_signing at the checked-out vault (shared
          # key). Harmless when disabled (dir absent → legacy keystore).
          VAULT_DIR: ${{ github.workspace }}/vault-repo
          # SUPERAPP_VARIANT selects the ABI variant (build.json::release
          # .variants[].id) → engine overrides ABI filter + artifact name.
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          # app/build.gradle shells out to `gh run list` at gradle config
          # phase to bake recent CI run durations into BuildConfig
          # (Configs → About → Stack: "Build avg time" + "Build last").
          # Without this token gh runs unauthenticated → returns empty,
          # the fields fall back to -1, the UI shows "—".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh build
          fi
          ls -la dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-SuperApp-${{ matrix.abi }}-${{ steps.variant.outputs.variant }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── ORAS push to GHCR (engine reads build.json::release.ghcr) ──
      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push APK to GHCR via ORAS
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_oras }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh oras-push

      # ── GitHub Release (engine reads build.json::release.gh_release) ──
      # Always runs — the engine publishes a rolling release tagged
      # `latest` (so /releases/latest/download/Cloud-SuperApp.apk is a
      # stable URL the linktree footer points at). The engine ALSO
      # creates the immutable per-tag release when it detects a tag
      # push (GITHUB_REF starts with refs/tags/). Don't try to clear
      # GITHUB_REF_NAME with an empty string here — GitHub Actions
      # re-injects the runner's default for that variable even when a
      # step's env: block sets it to '', which would falsely trigger
      # the per-tag branch on every main push and create a stray
      # "main"-tagged release.
      - name: Publish to GitHub Releases
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.create_release }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          SUPERAPP_VARIANT: ${{ matrix.abi }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: ./build.sh gh-release
