name: ship-cloud-terminal
# Build da_cloud-terminal and publish the runnable payload to the rolling GH
# Release `latest` (+ GHCR via ORAS). The desktop home-manager flake pulls the
# release asset and emits launchers locally. Payload only — no launchers/electron
# in CI (electron resolves on the device). See da_cloud-terminal/build.json .release.
on:
  push:
    branches: [main]
    paths:
      - 'da_cloud-terminal/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_cloud-terminal
    steps:
      - uses: actions/checkout@v4

      # tools repo provides registry.json → the Tools profile is generated from it.
      - uses: actions/checkout@v4
        with:
          repository: diegonmarcos/tools
          path: _tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build deps (imagemagick, zstd, jq, oras)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick zstd jq
          ORAS_VERSION=1.2.0
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      - name: Package payload (build.sh package)
        env:
          CT_TOOLS_DIR: ${{ github.workspace }}/_tools
        run: ./build.sh package

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push payload to GHCR (ORAS)
        run: ./build.sh oras-push

      - name: Publish to GitHub Release (rolling latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh gh-release
