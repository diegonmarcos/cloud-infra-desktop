name: "Ship → Cloud-Comms fork APKs (materialize + build + publish to GHCR)"

# Builds a Cloud-Comms FORK (upstream clone @ pinned tag + committed patch
# series) and publishes its APK to GHCR as cloud-comms-<key>:latest — the image
# the hub's bundle-forks embeds and the in-app FleetUpdater pulls. Everything
# routes through ea_cloud-comms/build.sh (materialize-fork / build-fork /
# publish-fork); this workflow only sequences engine commands.
#
# The fork builds with its OWN gradle wrapper (FairEmail pins Gradle 9.4.1 /
# AGP 9.2.1 / compileSdk 37) and signs with the SAME cached constellation
# keystore the hub uses — signature-IPC + the updater install chain require one
# key across all five APKs.
#
# On success, the fork APK lands on GHCR only. The hub is NOT re-bundled
# automatically — that was the original design, but it caused sha(bundle)==
# sha(GHCR) so the in-app fleet updater never detected fork updates for
# existing installs. Now fork CI → GHCR only; existing hubs detect the sha
# mismatch and pull the update directly from GHCR. Hub re-bundle is manual
# (workflow_dispatch on ship-cloud-comms.yml).
#
# Today only `mail` builds on push (chat awaits the push-notification decision;
# matrix is blocked on the Matrix stack ship). workflow_dispatch can request
# any fork key.

on:
  workflow_dispatch:
    inputs:
      fork:
        description: "Fork to build"
        required: false
        type: choice
        default: "mail"
        options:
          - mail
          - chat
          - matrix
  push:
    branches: [main]
    paths:
      - "ea_cloud-comms/forks/**"
      - "ea_cloud-comms/build.json"
      - "ea_cloud-comms/build.sh"   # the engine IS the fork pipeline
      - "1_workflows/src/cicd/ship-cloud-comms-forks.yml"
      # Generated .github/workflows/*.yml intentionally NOT watched (regenerated
      # by 1_workflows/build.sh → would self-trigger rebuilds on unrelated commits).

permissions:
  contents: read
  packages: write   # ghcr push (oras)

env:
  WORK_DIR: ea_cloud-comms
  FORK: ${{ inputs.fork || 'mail' }}

jobs:
  build_and_publish_fork:
    name: "Materialize + build + publish fork"
    runs-on: ubuntu-latest
    timeout-minutes: 60   # FairEmail is a ~3500-file build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-android / no sdkmanager: platforms;android-37 is not resolvable
      # via sdkmanager on the runner (runs 27413583240 + 27418273251), and
      # FairEmail's OWN CI (.github/workflows/android.yml in the upstream clone)
      # provisions NOTHING — just JDK 17 + ./gradlew. AGP 9 auto-installs the
      # compile platform from the runner's preinstalled, license-accepted SDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # exactly what upstream FairEmail CI uses
          cache: gradle

      # Same cached constellation keystore as ship-cloud-comms.yml — one key
      # across hub + forks + SuperApp (signature IPC + updater chain).
      - name: Restore constellation keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/hub/keystores/comms.keystore
          key: cloud-comms-keystore-v1
      - name: Generate keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          mkdir -p hub/keystores
          keytool -genkeypair -keystore hub/keystores/comms.keystore \
            -storepass android -keypass android -alias commskey \
            -dname "CN=Diego Marcos, OU=Cloud-Comms, O=diegonmarcos.com, L=Madrid, ST=Madrid, C=ES" \
            -keyalg RSA -keysize 2048 -validity 10950

      - name: Install ORAS + jq
        run: |
          sudo apt-get update -y && sudo apt-get install -y jq
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xzf - oras
          oras version

      - name: Materialize fork (clone @ pin + patch series)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          chmod +x build.sh
          ./build.sh materialize-fork "$FORK"

      - name: Build fork APK (fork's own gradle wrapper + constellation signing)
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
        run: |
          ./build.sh build-fork "$FORK"
          ls -la dist/

      - name: Upload fork APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-comms-${{ env.FORK }}-${{ github.sha }}
          path: ${{ env.WORK_DIR }}/dist/cloud-comms-${{ env.FORK }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish fork APK to GHCR
        working-directory: ${{ env.WORK_DIR }}
        env:
          BYPASS_NIX: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: ./build.sh publish-fork "$FORK"

      # Hub re-bundle deliberately NOT dispatched here. See top-of-file comment.
