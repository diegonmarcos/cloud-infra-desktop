name: ship-my-ai-app
# Compile + build the my-ai Rust workspace (CLI `my-ai` + TTY dashboard `my-ai-dash`;
# Tauri GUI `my-ai-gui` added in Phase 4). Toolchain comes from da_my-ai/flake.nix;
# CI just needs nix. The GitHub runner has the RAM the Surface Pro's freeze-guard
# denies, so this is where the Rust actually compiles. Publishes the binaries to a
# rolling GitHub Release (my-ai-latest) for `build.sh fetch` / `build.sh install`.
on:
  push:
    branches: [main]
    paths:
      - 'da_my-ai/**'
      - '1_workflows/src/cicd/ship-my-ai-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_my-ai
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compile-verify (build.sh check)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh check

      - name: Build release binaries + run tests (build.sh build)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: my-ai-bundle
          path: |
            da_my-ai/target/release/my-ai
            da_my-ai/target/release/my-ai-dash
          if-no-files-found: warn

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create my-ai-latest \
            --title "my-ai (rolling)" \
            --notes "Latest Rust build — main@${GITHUB_SHA:0:8}. Fetch via da_my-ai/build.sh install." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload my-ai-latest \
            target/release/my-ai \
            target/release/my-ai-dash \
            --clobber
