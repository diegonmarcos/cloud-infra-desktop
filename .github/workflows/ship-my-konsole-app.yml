name: ship-my-konsole-app
# Compile-verify + build the Tauri (Rust) my-konsole terminal app. Toolchain
# comes from the project flake (rust + cargo-tauri + webkitgtk); CI just needs
# nix. The GitHub runner has the RAM the Surface Pro's freeze-guard denies, so
# this is where the Rust actually compiles. Publishes the binary + .deb to a
# rolling GitHub Release (my-konsole-latest) for `build.sh run` / KDE install.
on:
  push:
    branches: [main]
    paths:
      - 'da_my-konsole/**'
      - '1_workflows/src/cicd/ship-my-konsole-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_my-konsole
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compile-verify (build.sh check)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh check

      - name: Build release bundle (build.sh build)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: my-konsole-bundle
          path: |
            da_my-konsole/src-tauri/target/release/my-konsole
            da_my-konsole/dash/target/release/my-konsole-dash
            da_my-konsole/src-tauri/target/release/bundle/**
          if-no-files-found: warn

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create my-konsole-latest \
            --title "my-konsole (rolling)" \
            --notes "Latest Tauri build — main@${GITHUB_SHA:0:8}. Install the .deb, or fetch via da_my-konsole/build.sh run." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload my-konsole-latest \
            src-tauri/target/release/my-konsole \
            dash/target/release/my-konsole-dash \
            src-tauri/target/release/bundle/deb/*.deb \
            --clobber
