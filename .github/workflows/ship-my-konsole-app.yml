name: ship-my-konsole-app
# Compile-verify + build the Tauri (Rust) my-konsole terminal app. Toolchain
# comes from the project flake (rust + cargo-tauri + webkitgtk); CI just needs
# nix. The GitHub runner has the RAM the Surface Pro's freeze-guard denies, so
# this is where the Rust actually compiles. Publishes the binary + .deb to a
# rolling GitHub Release (my-konsole-latest) for `build.sh run` / KDE install.
#
# build-engine (2nd job): cross-builds the standalone my-konsole-engine crate
# (no tauri/webkit deps) to a STATIC aarch64-unknown-linux-musl binary — a
# static-musl bin runs unmodified on Termux (Android) since it makes raw
# syscalls instead of linking Termux's own libc. Uses rustup+a prebuilt musl
# cross toolchain (not nix — the pkgsCross musl toolchain isn't cached on
# Hydra and rebuilds gcc from source). Published alongside the Tauri assets.
on:
  push:
    branches: [main]
    paths:
      - 'da_my-konsole/**'
      - '1_workflows/src/cicd/ship-my-konsole-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_my-konsole
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compile-verify (build.sh check)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh check

      - name: Build release bundle (build.sh build)
        env:
          CARGO_BUILD_JOBS: "4"
        run: ./build.sh build

      - uses: actions/upload-artifact@v4
        with:
          name: my-konsole-bundle
          path: |
            da_my-konsole/src-tauri/target/release/my-konsole
            da_my-konsole/dash/target/release/my-konsole-dash
            da_my-konsole/src-tauri/target/release/bundle/**
          if-no-files-found: warn

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create my-konsole-latest \
            --title "my-konsole (rolling)" \
            --notes "Latest Tauri build — main@${GITHUB_SHA:0:8}. Install the .deb, or fetch via da_my-konsole/build.sh run." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload my-konsole-latest \
            src-tauri/target/release/my-konsole \
            dash/target/release/my-konsole-dash \
            src-tauri/target/release/bundle/deb/*.deb \
            --clobber

  build-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: da_my-konsole
    steps:
      - uses: actions/checkout@v4

      - name: Add aarch64-unknown-linux-musl target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Install aarch64-linux-musl cross toolchain
        run: |
          curl -fL https://musl.cc/aarch64-linux-musl-cross.tgz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Build my-konsole-engine (static, aarch64-unknown-linux-musl)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --manifest-path engine/Cargo.toml --target aarch64-unknown-linux-musl

      - name: Stage + verify static binary
        run: |
          mkdir -p engine-dist
          cp engine/target/aarch64-unknown-linux-musl/release/my-konsole-engine engine-dist/my-konsole-engine-aarch64
          file engine-dist/my-konsole-engine-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: my-konsole-engine-aarch64
          path: da_my-konsole/engine-dist/my-konsole-engine-aarch64
          if-no-files-found: warn

      - name: Publish rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create my-konsole-latest \
            --title "my-konsole (rolling)" \
            --notes "Latest Tauri build — main@${GITHUB_SHA:0:8}. Install the .deb, or fetch via da_my-konsole/build.sh run." \
            --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload my-konsole-latest \
            engine-dist/my-konsole-engine-aarch64 \
            --clobber
