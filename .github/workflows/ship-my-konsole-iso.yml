name: "Ship → my-konsole rescue ISO (stock kernel, cache boot closure to GHCR)"

# Builds the my-konsole rescue ISO on a GHA runner so the laptop never has to
# build it locally (its freeze-guard/oomd kills heavy builds by design). Two
# deliverables per run, mirroring ship-boot-cache:
#
#   1. ghcr.io/<owner>/unix-my-konsole-boot-cache:{nix-linux-<kver>,latest}
#      — Nix-format closure of the my-konsole ISO's kernel + initrd (nixpkgs 25.05).
#        Distinct image from unix-boot-cache (that one is the host's 24.11
#        kernel; this is the slim flake's 25.05 derivation — different hash).
#        Lets the laptop `nix copy --from` the kernel instead of rebuilding.
#
#   2. Workflow artifact `my-konsole-iso` — the built .iso, downloaded
#      on the laptop via `gh run download` to populate the my-konsole rescue
#      partition (nvme0n1p8, label mykonsole-resc).
#
# The flake now uses the STOCK nixpkgs kernel (no nixos-hardware /
# linux-surface module). The Surface Type Cover keyboard still works via
# mainline Surface Aggregator (SAM) modules (surface_aggregator*, surface_hid*;
# see configuration.nix). Touchscreen/pen (iptsd/IPTS) is disabled — not
# available on the stock kernel and not needed for a rescue console.
#
# The kernel is a CACHE HIT, not a from-source compile: the stock nixpkgs
# 25.05 kernel derivation substitutes from cache.nixos.org, so the
# linux-surface/nixos-surface cachix substituters are no longer needed. This
# job still realizes + pushes the kernel+initrd closure to GHCR (deliverable
# #1 above) so the laptop can `nix copy --from` it. Free disk first to avoid
# ENOSPC.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ca_ventoy_fallback_usb/my-konsole/flake.nix"
      - "ca_ventoy_fallback_usb/my-konsole/flake.lock"
      - "ca_ventoy_fallback_usb/my-konsole/configuration.nix"
      - "ca_ventoy_fallback_usb/my-konsole/iso.nix"
      - "1_workflows/src/cicd/ship-my-konsole-iso.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-slim-iso:
    name: "Build my-konsole ISO + cache 25.05 kernel closure"
    runs-on: ubuntu-latest
    # Stock kernel is a cache-hit download, not a compile — ISO assembly +
    # closure copy/push to GHCR fits easily inside 60.
    timeout-minutes: 60
    steps:
      - name: Free disk (~30 GB on runner)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Resolve kernel version + image meta
        id: meta
        working-directory: ca_ventoy_fallback_usb/my-konsole
        run: |
          set -euo pipefail
          KVER=$(nix eval --raw .#nixosConfigurations.my-konsole.config.boot.kernelPackages.kernel.version)
          IMAGE=ghcr.io/${{ github.repository_owner }}/unix-my-konsole-boot-cache
          echo "kver=${KVER}"                    >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"                  >> "$GITHUB_OUTPUT"
          echo "tag_nix=nix-linux-${KVER}"       >> "$GITHUB_OUTPUT"

      - name: Build my-konsole ISO (stock kernel, cache hit) + realize boot closure
        id: iso
        working-directory: ca_ventoy_fallback_usb/my-konsole
        run: |
          set -euo pipefail
          nix build .#iso --no-link --print-out-paths | tee /tmp/iso-out
          ISO_DIR=$(cat /tmp/iso-out)
          ISO=$(ls "$ISO_DIR"/iso/*.iso | head -1)
          echo "iso=${ISO}" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Stage Nix binary cache (kernel + initrd closures, zstd)
        id: stage
        working-directory: ca_ventoy_fallback_usb/my-konsole
        run: |
          set -euo pipefail
          STAGE=${{ runner.temp }}/my-konsole-boot-cache
          mkdir -p "$STAGE"
          nix copy --no-check-sigs --to "file://$STAGE?compression=zstd" \
            .#nixosConfigurations.my-konsole.config.boot.kernelPackages.kernel
          nix copy --no-check-sigs --to "file://$STAGE?compression=zstd" \
            .#nixosConfigurations.my-konsole.config.system.build.initialRamdisk
          du -sh "$STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Build + push OCI image (25.05 kernel closure)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG_NIX: ${{ steps.meta.outputs.tag_nix }}
          STAGE: ${{ steps.stage.outputs.stage }}
          KVER: ${{ steps.meta.outputs.kver }}
        run: |
          set -euo pipefail
          ctr=$(buildah from scratch)
          buildah copy "$ctr" "$STAGE" "/boot-cache"
          buildah config \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=NixOS-format binary cache: my-konsole stock ${KVER} kernel+initrd closure (nixpkgs 25.05). Recover via: nix copy --no-check-sigs --from file://.../boot-cache --to 'local?store=/nix/store' --all" \
            --label "kernel.version=${KVER}" \
            "$ctr"
          buildah commit --rm "$ctr" "${IMAGE}:${TAG_NIX}"
          buildah tag "${IMAGE}:${TAG_NIX}" "${IMAGE}:latest"
          buildah login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" ghcr.io
          for t in "${TAG_NIX}" latest; do
            buildah push --format=oci "${IMAGE}:${t}" "docker://${IMAGE}:${t}"
          done

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-konsole-iso
          path: ${{ steps.iso.outputs.iso }}
          retention-days: 14
          compression-level: 0
