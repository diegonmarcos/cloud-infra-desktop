[package]
name = "fido2-vault-broker"
version = "0.1.0"
edition = "2021"
description = "Linux daemon mirroring a Bitwarden-API vault into a TPM2-sealed local cache, exposing passkeys via /dev/uhid as a virtual FIDO2/CTAP2 USB device."
license = "MIT"

[[bin]]
name = "fido2-vault-broker"
path = "src/main.rs"

[lib]
name = "fido2_vault_broker"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tss-esapi = { version = "7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
directories = "5"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"
clap = { version = "4", features = ["derive"] }
# Mock-fallback crypto (used when the `tpm` feature is OFF). PoC-only.
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
# CTAP2 / uhid stubs — TODO: pick crate when implementing CTAP2 phase B.3+
# ctap-types = "0.3"
# ctaphid = "0.3"
# uhid-virt = "0.0.7"

[features]
# Default = mock seal (works on any machine, derives key from /etc/machine-id).
# Flip on `tpm` for the real tss-esapi-backed seal — requires libtss2 system libs.
default = []
tpm = ["dep:tss-esapi"]
fido2 = []   # turn on when implementing CTAP2 phase

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
