<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloud Terminal</title>
<!-- xterm shipped as static vendor assets (no bundler, no node require).
     build.sh copies these from node_modules into frontend/vendor/. -->
<link rel="stylesheet" href="vendor/xterm.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<style>
  :root {
    --accent:  #7b7fff;
    --accent2: #a78bfa;
    --bg:      #0e0f1a;
    --fg:      #e2e8f0;
    --sidebar: #13141f;
    --item-bg: #1a1b2e;
    --sep:     #2a2b3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px; background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #tabbar {
    display: flex; align-items: center; gap: 4px; padding: 6px 10px 0;
    background: var(--sidebar); border-bottom: 1px solid var(--sep);
    flex-shrink: 0; overflow-x: auto;
  }
  #tabbar .profile-pill {
    padding: 5px 14px; border-radius: 6px 6px 0 0; cursor: pointer;
    font-size: 12px; color: #888; background: transparent; border: none;
    white-space: nowrap; transition: color .15s, background .15s;
  }
  #tabbar .profile-pill:hover  { color: var(--fg); background: var(--item-bg); }
  #tabbar .profile-pill.active { color: var(--accent); background: var(--bg); border-bottom: 2px solid var(--accent); }
  #header {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: var(--bg); border-bottom: 1px solid var(--sep); flex-shrink: 0;
  }
  #header .logo  { font-size: 18px; }
  #header .name  { font-weight: 600; color: var(--accent); }
  #header .host  { color: #6b7280; font-size: 11px; }
  #header .spacer { flex: 1; }
  #header button {
    padding: 4px 10px; background: var(--item-bg); color: var(--fg);
    border: 1px solid var(--sep); border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 11px;
  }
  #header button:hover     { border-color: var(--accent); color: var(--accent); }
  #header #kill-btn:hover  { border-color: #f87171; color: #f87171; }
  #body { display: flex; flex: 1; overflow: hidden; }
  #sidebar {
    width: 230px; background: var(--sidebar); border-right: 1px solid var(--sep);
    flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-search {
    margin: 8px; padding: 6px 9px; flex-shrink: 0; background: var(--item-bg);
    color: var(--fg); border: 1px solid var(--sep); border-radius: 5px;
    font-family: inherit; font-size: 12px; outline: none;
  }
  #sidebar-search:focus { border-color: var(--accent); }
  #sidebar-list { flex: 1; overflow-y: auto; }
  #sidebar-list::-webkit-scrollbar { width: 4px; }
  #sidebar-list::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 2px; }
  .section-title {
    padding: 10px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent2); opacity: .85;
  }
  .cmd-item {
    display: block; text-align: left; padding: 7px 14px; background: none;
    border: none; color: var(--fg); cursor: pointer; font-family: inherit;
    font-size: 12px; border-radius: 4px; margin: 1px 4px;
    width: calc(100% - 8px); transition: background .1s, color .1s;
  }
  .cmd-item:hover  { background: var(--item-bg); color: var(--accent); }
  .cmd-item:active { background: var(--sep); }
  .sep-line { height: 1px; background: var(--sep); margin: 4px 10px; }
  #terminal-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #termtabs {
    display: flex; align-items: center; gap: 2px; padding: 4px 6px 0;
    background: var(--sidebar); border-bottom: 1px solid var(--sep);
    flex-shrink: 0; overflow-x: auto;
  }
  .term-tab {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 5px 5px 0 0; cursor: pointer; font-size: 11px; color: #888;
    background: transparent; border: none; white-space: nowrap;
  }
  .term-tab:hover  { background: var(--item-bg); color: var(--fg); }
  .term-tab.active { background: var(--bg); color: var(--accent); border-bottom: 2px solid var(--accent); }
  .term-tab .close { opacity: .5; font-size: 12px; }
  .term-tab .close:hover { opacity: 1; color: #f87171; }
  #newtab {
    padding: 4px 10px; border: none; background: transparent; color: var(--accent2);
    font-size: 15px; cursor: pointer; border-radius: 5px;
  }
  #newtab:hover { background: var(--item-bg); }

  /* ── Split panes (KDE-style) ─────────────────────────────────────── */
  #terms { position: relative; flex: 1; overflow: hidden; }
  .tab-root { position: absolute; inset: 0; display: none; }
  .tab-root.active { display: flex; }
  .split { display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
  .split.row { flex-direction: row; }
  .split.col { flex-direction: column; }
  .leaf {
    flex: 1 1 0; min-width: 48px; min-height: 40px; position: relative;
    padding: 4px 6px; overflow: hidden; border: 1px solid transparent;
  }
  .leaf.focused { border-color: var(--accent); }
  .leaf > .xterm { width: 100%; height: 100%; }
  .divider { flex: 0 0 6px; background: var(--sep); }
  .split.row > .divider { cursor: col-resize; }
  .split.col > .divider { cursor: row-resize; }
  .divider:hover { background: var(--accent); }

  /* ── System monitor dashboard (btop graphs + glances layout) ─────── */
  .leaf.monitor { padding: 0; overflow: auto; }
  .mon { padding: 8px; height: 100%; }
  .mon-grid {
    display: grid; gap: 8px; height: 100%;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1.3fr 1fr auto;
    grid-template-areas: "cpu mem" "net disk" "proc proc";
  }
  .panel {
    background: var(--sidebar); border: 1px solid var(--sep); border-radius: 6px;
    padding: 6px 8px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  }
  .panel.cpu { grid-area: cpu; } .panel.mem { grid-area: mem; }
  .panel.net { grid-area: net; } .panel.disk { grid-area: disk; } .panel.proc { grid-area: proc; }
  .panel .ph {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent2); margin-bottom: 4px; flex-shrink: 0; display: flex; justify-content: space-between;
  }
  .panel .ph .sub { color: #6b7280; text-transform: none; letter-spacing: 0; }
  .panel canvas.g { width: 100%; flex: 1 1 0; min-height: 30px; }
  .cores { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 3px; margin-top: 4px; flex-shrink: 0; }
  .core { height: 12px; background: var(--item-bg); border-radius: 2px; position: relative; overflow: hidden; font-size: 8px; }
  .core > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .8; }
  .core > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--fg); }
  .bars { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; flex-shrink: 0; }
  .bar { font-size: 10px; }
  .bar .lbl { display: flex; justify-content: space-between; color: #9aa4b2; }
  .bar .track { height: 8px; background: var(--item-bg); border-radius: 3px; overflow: hidden; margin-top: 1px; }
  .bar .track > i { display: block; height: 100%; background: var(--accent); }
  .bar.warn .track > i { background: #f0b400; } .bar.crit .track > i { background: #f87171; }
  .ptbl { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptbl th { text-align: left; color: #6b7280; font-weight: 500; padding: 2px 6px; position: sticky; top: 0; background: var(--sidebar); }
  .ptbl td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptbl td.n { color: var(--fg); max-width: 340px; }
  .ptbl td.num { color: var(--accent2); font-variant-numeric: tabular-nums; }
  .panel.proc { overflow: auto; }

  #ctxmenu {
    position: fixed; z-index: 1000; display: none; min-width: 170px; padding: 4px;
    background: var(--sidebar); border: 1px solid var(--sep); border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #ctxmenu .ctx-item {
    display: flex; justify-content: space-between; gap: 18px; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--fg); white-space: nowrap;
  }
  #ctxmenu .ctx-item:hover { background: var(--item-bg); color: var(--accent); }
  #ctxmenu .ctx-item .key  { color: #6b7280; font-size: 11px; }
  #ctxmenu .ctx-sep { height: 1px; background: var(--sep); margin: 4px 6px; }
</style>
</head>
<body>

<div id="tabbar"></div>
<div id="header">
  <span class="logo"  id="hdr-logo"></span>
  <span class="name"  id="hdr-name"></span>
  <span class="host"  id="hdr-host"></span>
  <span class="spacer"></span>
  <button id="split-h" title="Split left/right (Ctrl+Shift+E)">Split ↔</button>
  <button id="split-v" title="Split top/bottom (Ctrl+Shift+D)">Split ↕</button>
  <button id="closepane-btn" title="Close pane (Ctrl+Shift+W)">✕ Pane</button>
  <button id="kill-btn"  title="Send Ctrl-C">■ Kill</button>
  <button id="clear-btn" title="Clear terminal">Clear</button>
</div>
<div id="body">
  <div id="sidebar">
    <input id="sidebar-search" type="text" placeholder="🔍  search commands…" autocomplete="off" spellcheck="false">
    <div id="sidebar-list"></div>
  </div>
  <div id="terminal-area">
    <div id="termtabs"><button id="newmon" title="System Monitor">📊</button><button id="newtab" title="New terminal tab">+</button></div>
    <div id="terms"></div>
  </div>
</div>
<div id="ctxmenu">
  <div class="ctx-item" data-act="copy">Copy         <span class="key">Ctrl+Shift+C</span></div>
  <div class="ctx-item" data-act="paste">Paste       <span class="key">Ctrl+Shift+V</span></div>
  <div class="ctx-item" data-act="selall">Select All</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-act="split-h">Split Left/Right <span class="key">Ctrl+Shift+E</span></div>
  <div class="ctx-item" data-act="split-v">Split Top/Bottom <span class="key">Ctrl+Shift+D</span></div>
  <div class="ctx-item" data-act="closepane">Close Pane   <span class="key">Ctrl+Shift+W</span></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-act="clear">Clear</div>
  <div class="ctx-item" data-act="newtab">New Tab      <span class="key">+</span></div>
</div>

<script>
// ── Tauri IPC ──
const invoke = window.__TAURI__.core.invoke
const listen = window.__TAURI__.event.listen
const Terminal = window.Terminal
const FitAddon = window.FitAddon.FitAddon
const clip = {
  write: (t) => { try { navigator.clipboard.writeText(t) } catch (_) {} },
  read:  ()  => navigator.clipboard.readText().catch(() => ''),
}

let allProfiles = []
let active = null
let curTheme = {}

// ── Model ──
// panes: ptyId → { term, fit, leaf(DOM), tabId }.  Each leaf is one PTY.
// tabs:  tabId → { root(DOM), btn, title }.  A tab holds a binary split tree
//        of .leaf / .split.row / .split.col nodes (KDE-style splits).
const panes = new Map()
const tabs  = new Map()
let paneSeq = 0
let tabSeq  = 0
let activeTab = null
let activePane = null

function termTheme(theme) {
  return { background: theme.bg || '#0e0f1a', foreground: '#e2e8f0', cursor: theme.accent || '#7b7fff' }
}

// ── Pane (leaf = one terminal + PTY) ──
function makePane(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf'
  leaf.dataset.pane = String(id)

  const term = new Terminal({
    fontFamily: "'JetBrains Mono','Fira Code',monospace",
    fontSize: 13, cursorBlink: true, scrollback: 10000, theme: termTheme(curTheme),
  })
  const fit = new FitAddon()
  term.loadAddon(fit)
  term.open(leaf)

  term.attachCustomKeyEventHandler(e => {
    if (e.type !== 'keydown') return true
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyC') { const s = term.getSelection(); if (s) clip.write(s); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyV') { clip.read().then(t => { if (t) invoke('pty_input', { id, d: t }) }); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyE') { splitActive('row'); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') { splitActive('col'); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyW') { closePane(activePane); return false }
    // Font zoom for THIS pane: Ctrl+= / Ctrl++ in, Ctrl+- out, Ctrl+0 reset.
    if (e.ctrlKey && !e.shiftKey && (e.code === 'Equal' || e.code === 'NumpadAdd'))      { setFont(id, +1); return false }
    if (e.ctrlKey &&  e.shiftKey &&  e.code === 'Equal')                                 { setFont(id, +1); return false }
    if (e.ctrlKey && (e.code === 'Minus' || e.code === 'NumpadSubtract'))                { setFont(id, -1); return false }
    if (e.ctrlKey && (e.code === 'Digit0' || e.code === 'Numpad0'))                      { setFont(id,  0); return false }
    return true
  })
  term.onData(d => invoke('pty_input', { id, d }))
  // focus-follows-click; capture so it fires before xterm handles it
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  leaf.addEventListener('contextmenu', e => { e.preventDefault(); focusPane(id); showCtxMenu(e.clientX, e.clientY) })

  panes.set(id, { term, fit, leaf, tabId, kind: 'term' })
  invoke('pty_start', { id, cols: term.cols || 80, rows: term.rows || 24 })
  return { id, leaf }
}

// ── System-monitor pane (dashboard, no PTY): btop graphs + glances panels ──
const MON_HIST = 120
function fmtBytes(n) {
  if (n < 1024) return n + ' B'
  const u = ['K', 'M', 'G', 'T']; let i = -1
  do { n /= 1024; i++ } while (n >= 1024 && i < u.length - 1)
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i] + 'B'
}
function drawGraph(cv, data, color, maxHint) {
  const dpr = window.devicePixelRatio || 1
  const w = cv.clientWidth, h = cv.clientHeight
  if (w < 2 || h < 2) return
  cv.width = w * dpr; cv.height = h * dpr
  const g = cv.getContext('2d'); g.scale(dpr, dpr)
  g.clearRect(0, 0, w, h)
  const max = Math.max(maxHint || 1, ...data, 1e-6)
  const n = data.length; if (n < 2) return
  const dx = w / (MON_HIST - 1)
  const y = v => h - (v / max) * h
  const x0 = w - (n - 1) * dx
  g.beginPath(); g.moveTo(x0, h)
  for (let i = 0; i < n; i++) g.lineTo(x0 + i * dx, y(data[i]))
  g.lineTo(x0 + (n - 1) * dx, h); g.closePath()
  const grad = g.createLinearGradient(0, 0, 0, h)
  grad.addColorStop(0, color + '99'); grad.addColorStop(1, color + '11')
  g.fillStyle = grad; g.fill()
  g.beginPath()
  for (let i = 0; i < n; i++) { const px = x0 + i * dx, py = y(data[i]); i ? g.lineTo(px, py) : g.moveTo(px, py) }
  g.strokeStyle = color; g.lineWidth = 1.5; g.stroke()
}
function bar(lbl, val, max, right) {
  const pct = max > 0 ? Math.min(100, (val / max) * 100) : 0
  const cls = pct > 90 ? 'crit' : pct > 70 ? 'warn' : ''
  return `<div class="bar ${cls}"><div class="lbl"><span>${lbl}</span><span>${right}</span></div><div class="track"><i style="width:${pct}%"></i></div></div>`
}
function accentColor() { return (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#7b7fff').trim() }

function makeMonitor(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf monitor'; leaf.dataset.pane = String(id)
  leaf.innerHTML = `
    <div class="mon"><div class="mon-grid">
      <div class="panel cpu"><div class="ph"><span>CPU</span><span class="sub" id="m-load-${id}"></span></div>
        <canvas class="g" id="m-cpu-${id}"></canvas><div class="cores" id="m-cores-${id}"></div></div>
      <div class="panel mem"><div class="ph"><span>MEMORY</span><span class="sub" id="m-memt-${id}"></span></div>
        <canvas class="g" id="m-mem-${id}"></canvas><div class="bars" id="m-membars-${id}"></div></div>
      <div class="panel net"><div class="ph"><span>NETWORK ▼▲</span><span class="sub" id="m-nett-${id}"></span></div>
        <canvas class="g" id="m-net-${id}"></canvas></div>
      <div class="panel disk"><div class="ph"><span>DISKS</span></div><div class="bars" id="m-disk-${id}"></div></div>
      <div class="panel proc"><div class="ph"><span>PROCESSES · top CPU</span></div>
        <table class="ptbl"><thead><tr><th>CPU%</th><th>MEM</th><th>PID</th><th>NAME</th></tr></thead>
        <tbody id="m-proc-${id}"></tbody></table></div>
    </div></div>`
  const hist = { cpu: [], mem: [], net: [] }
  const $ = s => leaf.querySelector(s)
  const push = (a, v) => { a.push(v); if (a.length > MON_HIST) a.shift() }

  const poll = async () => {
    let s; try { s = await invoke('sys_stats') } catch (_) { return }
    if (!leaf.isConnected) return
    const col = accentColor()
    // CPU
    push(hist.cpu, s.cpu)
    drawGraph($('#m-cpu-' + id), hist.cpu, col, 100)
    $('#m-load-' + id).textContent = 'load ' + (s.load || []).map(x => x.toFixed(2)).join(' ') + '  ·  ' + s.cpu.toFixed(0) + '%'
    $('#m-cores-' + id).innerHTML = (s.cores || []).map((c, i) =>
      `<div class="core"><i style="width:${Math.min(100, c)}%"></i><span>${i}:${c.toFixed(0)}</span></div>`).join('')
    // MEM
    const m = s.mem, mp = m.total ? (m.used / m.total) * 100 : 0
    push(hist.mem, mp)
    drawGraph($('#m-mem-' + id), hist.mem, col, 100)
    $('#m-memt-' + id).textContent = fmtBytes(m.used) + ' / ' + fmtBytes(m.total)
    let mb = bar('RAM', m.used, m.total, mp.toFixed(0) + '%')
    if (m.swap_total) mb += bar('Swap', m.swap_used, m.swap_total, fmtBytes(m.swap_used))
    $('#m-membars-' + id).innerHTML = mb
    // NET (sum ifaces; bytes since last ~1s poll = bytes/s)
    let rx = 0, tx = 0; for (const nf of (s.net || [])) { rx += nf.rx; tx += nf.tx }
    push(hist.net, rx + tx)
    drawGraph($('#m-net-' + id), hist.net, col, 1)
    $('#m-nett-' + id).textContent = '▼ ' + fmtBytes(rx) + '/s  ▲ ' + fmtBytes(tx) + '/s'
    // DISKS
    $('#m-disk-' + id).innerHTML = (s.disks || []).map(d => {
      const used = d.total - d.avail
      return bar(d.mount, used, d.total, fmtBytes(used) + '/' + fmtBytes(d.total))
    }).join('')
    // PROCS
    $('#m-proc-' + id).innerHTML = (s.procs || []).map(p =>
      `<tr><td class="num">${p.cpu.toFixed(1)}</td><td class="num">${fmtBytes(p.mem)}</td><td class="num">${p.pid}</td><td class="n">${p.name}</td></tr>`).join('')
  }
  const timer = setInterval(poll, 1000)
  poll()
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'monitor', stop: () => clearInterval(timer) })
  return { id, leaf }
}

function newMonitorTab() {
  const tabId = ++tabSeq
  const root = document.createElement('div')
  root.className = 'tab-root'; root.dataset.tab = String(tabId)
  document.getElementById('terms').appendChild(root)
  const btn = document.createElement('button')
  btn.className = 'term-tab'
  const label = document.createElement('span'); label.textContent = '📊 monitor'
  const close = document.createElement('span'); close.className = 'close'; close.textContent = '×'
  close.onclick = ev => { ev.stopPropagation(); closeTab(tabId) }
  btn.append(label, close); btn.onclick = () => activateTab(tabId)
  document.getElementById('termtabs').insertBefore(btn, document.getElementById('newmon'))
  tabs.set(tabId, { root, btn, title: label })
  const made = makeMonitor(tabId)
  root.appendChild(made.leaf)
  activateTab(tabId); focusPane(made.id)
  return tabId
}

function paneIdOf(leaf) { return parseInt(leaf.dataset.pane, 10) }

function focusPane(id) {
  const p = panes.get(id)
  if (!p) return
  activePane = id
  for (const q of panes.values()) q.leaf.classList.toggle('focused', q === p)
  if (p.kind === 'term') p.term.focus()
}

// ── Split the ACTIVE pane: dir 'row' = left/right, 'col' = top/bottom ──
function splitActive(dir) {
  const p = panes.get(activePane)
  if (!p) return
  const leaf = p.leaf
  const parent = leaf.parentElement
  const split = document.createElement('div')
  split.className = 'split ' + dir
  const div = document.createElement('div')
  div.className = 'divider'
  parent.replaceChild(split, leaf)          // put the split where the leaf was
  const made = makePane(p.tabId)
  split.append(leaf, div, made.leaf)         // [old, divider, new]
  attachDivider(div, dir)
  fitTab(p.tabId)
  focusPane(made.id)
}

// ── Close a pane; collapse its parent split; close tab if it was the last ──
function closePane(id) {
  const p = panes.get(id)
  if (!p) return
  if (p.kind === 'monitor') { try { p.stop() } catch (_) {} }
  else { invoke('pty_kill', { id }); try { p.term.dispose() } catch (_) {} }
  const leaf = p.leaf, parent = leaf.parentElement
  panes.delete(id)
  if (parent && parent.classList.contains('split')) {
    // sibling (the other non-divider child) takes the split's place
    const sib = [...parent.children].find(c => c !== leaf && !c.classList.contains('divider'))
    parent.parentElement.replaceChild(sib, parent)
    fitTab(p.tabId)
    // focus any surviving pane in this tab
    for (const [qid, q] of panes) if (q.tabId === p.tabId) { focusPane(qid); break }
  } else {
    closeTab(p.tabId)                          // leaf was the tab's whole content
  }
}

// ── Divider drag → resize the two adjacent nodes ──
function attachDivider(div, dir) {
  div.addEventListener('mousedown', e => {
    e.preventDefault()
    const prev = div.previousElementSibling, next = div.nextElementSibling
    const horiz = dir === 'row'
    const start = horiz ? e.clientX : e.clientY
    const ps = horiz ? prev.offsetWidth : prev.offsetHeight
    const ns = horiz ? next.offsetWidth : next.offsetHeight
    const move = ev => {
      const delta = (horiz ? ev.clientX : ev.clientY) - start
      const np = Math.max(48, ps + delta), nn = Math.max(48, ns - delta)
      prev.style.flex = '0 0 ' + np + 'px'
      next.style.flex = '0 0 ' + nn + 'px'
    }
    const up = () => {
      document.removeEventListener('mousemove', move)
      document.removeEventListener('mouseup', up)
      if (activeTab != null) fitTab(activeTab)
    }
    document.addEventListener('mousemove', move)
    document.addEventListener('mouseup', up)
  })
}

// ── Tabs ──
function newTab() {
  const tabId = ++tabSeq
  const root = document.createElement('div')
  root.className = 'tab-root'
  root.dataset.tab = String(tabId)
  document.getElementById('terms').appendChild(root)

  const btn = document.createElement('button')
  btn.className = 'term-tab'
  const label = document.createElement('span'); label.textContent = 'shell ' + tabId
  const close = document.createElement('span'); close.className = 'close'; close.textContent = '×'
  close.onclick = ev => { ev.stopPropagation(); closeTab(tabId) }
  btn.append(label, close)
  btn.onclick = () => activateTab(tabId)
  document.getElementById('termtabs').insertBefore(btn, document.getElementById('newtab'))

  tabs.set(tabId, { root, btn, title: label })
  const made = makePane(tabId)
  root.appendChild(made.leaf)
  activateTab(tabId)
  focusPane(made.id)
  return tabId
}

function activateTab(id) {
  activeTab = id
  for (const [tid, t] of tabs) {
    const on = tid === id
    t.root.classList.toggle('active', on)
    t.btn.classList.toggle('active', on)
  }
  fitTab(id)
  // focus a pane belonging to this tab
  for (const [pid, p] of panes) if (p.tabId === id) { focusPane(pid); break }
}

function closeTab(id) {
  const t = tabs.get(id)
  if (!t) return
  for (const [pid, p] of [...panes]) if (p.tabId === id) { invoke('pty_kill', { id: pid }); try { p.term.dispose() } catch (_) {} panes.delete(pid) }
  t.root.remove(); t.btn.remove()
  tabs.delete(id)
  if (activeTab === id) {
    const next = tabs.keys().next().value
    if (next != null) activateTab(next); else newTab()
  }
}

// ── Fit ── (only the visible/active tab has non-zero sized leaves)
function fitPane(id) {
  const p = panes.get(id); if (!p || p.kind !== 'term') return
  try { p.fit.fit() } catch (_) {}
  invoke('pty_resize', { id, cols: p.term.cols, rows: p.term.rows })
}
function fitTab(tabId) { for (const [id, p] of panes) if (p.tabId === tabId) fitPane(id) }
function doFit() { if (activeTab != null) fitTab(activeTab) }

// Per-pane font zoom. delta +1/-1 steps; 0 resets to the default 13. Re-fit so
// cols/rows (and the PTY size) track the new glyph size.
function setFont(id, delta) {
  const p = panes.get(id); if (!p) return
  const cur = p.term.options.fontSize || 13
  const next = delta === 0 ? 13 : Math.max(6, Math.min(40, cur + delta))
  p.term.options.fontSize = next
  fitPane(id)
}
window.addEventListener('resize', doFit)

function applyTheme(theme) {
  curTheme = theme || {}
  const r = document.documentElement.style
  if (theme.accent)  r.setProperty('--accent',  theme.accent)
  if (theme.accent2) r.setProperty('--accent2', theme.accent2)
  if (theme.bg)      r.setProperty('--bg',      theme.bg)
  for (const p of panes.values()) if (p.kind === 'term') p.term.options.theme = termTheme(theme)
}

function runItem(item) { invoke('run_item', { item }) }
function focusActivePaneTerm() { const p = panes.get(activePane); if (p && p.kind === 'term') p.term.focus() }

function buildSidebar(profile) {
  const sb = document.getElementById('sidebar-list')
  sb.innerHTML = ''
  for (const section of (profile.sections || [])) {
    const grp = document.createElement('div'); grp.className = 'cmd-group'
    const t = document.createElement('div'); t.className = 'section-title'; t.textContent = section.title
    grp.appendChild(t)
    for (const item of (section.items || [])) {
      const btn = document.createElement('button')
      btn.className = 'cmd-item'; btn.textContent = item.label
      btn.dataset.search = ((item.label || '') + ' ' + (item.arg || '')).toLowerCase()
      btn.onclick = () => { runItem({ ...item, profile: profile.name, ptyId: activePane }); focusActivePaneTerm() }
      grp.appendChild(btn)
    }
    const sep = document.createElement('div'); sep.className = 'sep-line'; grp.appendChild(sep)
    sb.appendChild(grp)
  }
  filterSidebar(document.getElementById('sidebar-search').value)
}

function filterSidebar(q) {
  q = (q || '').trim().toLowerCase()
  for (const grp of document.querySelectorAll('#sidebar-list .cmd-group')) {
    let shown = 0
    for (const btn of grp.querySelectorAll('.cmd-item')) {
      const hit = !q || btn.dataset.search.indexOf(q) !== -1
      btn.style.display = hit ? '' : 'none'
      if (hit) shown++
    }
    grp.style.display = shown ? '' : 'none'
  }
}

function buildProfileTabs() {
  const bar = document.getElementById('tabbar'); bar.innerHTML = ''
  for (const p of allProfiles) {
    const btn = document.createElement('button')
    btn.className = 'profile-pill' + (p.name === active.name ? ' active' : '')
    btn.textContent = (p.logo ? p.logo + ' ' : '') + p.display_name
    btn.onclick = () => { if (p.name !== active.name) showProfile(p) }
    bar.appendChild(btn)
  }
}

function showProfile(p) {
  active = p
  applyTheme(p.theme || {})
  buildProfileTabs(); buildSidebar(p)
  document.getElementById('hdr-logo').textContent = p.logo || ''
  document.getElementById('hdr-name').textContent = p.display_name || ''
  document.title = 'Cloud Terminal — ' + (p.display_name || '')
}

// ── boot ──
async function init() {
  const data = await invoke('get_init')
  allProfiles = data.profiles || [data]
  const label = data.name
  document.getElementById('hdr-host').textContent = '@ ' + (data.host || '')
  showProfile(allProfiles.find(p => p.name === data.name) || data)
  try {
    await Promise.all([
      listen('pty-data:' + label, e => { const [id, d] = e.payload; const p = panes.get(id); if (p) p.term.write(d) }),
      listen('pty-exit:' + label, e => { const id = e.payload; const p = panes.get(id); if (p) p.term.write('\r\n\x1b[33m[shell exited]\x1b[0m\r\n') }),
      listen('tray-run:' + label, e => runItem({ ...e.payload, ptyId: activePane })),
    ])
  } catch (err) { console.error('event listen failed:', err) }
  // DTK profile opens the System Monitor as its default tab (+ a shell tab).
  if (label === 'tools') { const mt = newMonitorTab(); newTab(); activateTab(mt) }
  else newTab()
  setTimeout(doFit, 60)
}

// ── context menu ──
const ctx = document.getElementById('ctxmenu')
function showCtxMenu(x, y) {
  ctx.style.display = 'block'
  const w = ctx.offsetWidth, h = ctx.offsetHeight
  ctx.style.left = Math.min(x, window.innerWidth  - w - 4) + 'px'
  ctx.style.top  = Math.min(y, window.innerHeight - h - 4) + 'px'
}
function hideCtxMenu() { ctx.style.display = 'none' }
window.addEventListener('click', hideCtxMenu)
window.addEventListener('blur', hideCtxMenu)
ctx.addEventListener('click', e => {
  const it = e.target.closest('.ctx-item'); if (!it) return
  const p = panes.get(activePane)
  const isTerm = p && p.kind === 'term'
  switch (it.dataset.act) {
    case 'copy':      { if (isTerm) { const s = p.term.getSelection(); if (s) clip.write(s) } break }
    case 'paste':     if (isTerm) clip.read().then(x => { if (x) invoke('pty_input', { id: activePane, d: x }) }); break
    case 'selall':    if (isTerm) p.term.selectAll(); break
    case 'split-h':   splitActive('row'); break
    case 'split-v':   splitActive('col'); break
    case 'closepane': closePane(activePane); break
    case 'clear':     if (isTerm) p.term.clear(); break
    case 'newtab':    newTab(); break
  }
  hideCtxMenu(); focusActivePaneTerm()
})

document.getElementById('newtab').onclick        = () => newTab()
document.getElementById('newmon').onclick        = () => newMonitorTab()
document.getElementById('split-h').onclick      = () => splitActive('row')
document.getElementById('split-v').onclick      = () => splitActive('col')
document.getElementById('closepane-btn').onclick = () => closePane(activePane)
document.getElementById('clear-btn').onclick    = () => { const p = panes.get(activePane); if (p && p.kind === 'term') { p.term.clear(); p.term.focus() } }
document.getElementById('kill-btn').onclick     = () => { if (activePane != null) invoke('pty_input', { id: activePane, d: '\x03' }) }

const _search = document.getElementById('sidebar-search')
_search.addEventListener('input', () => filterSidebar(_search.value))
_search.addEventListener('keydown', e => { if (e.key === 'Escape') { _search.value = ''; filterSidebar('') } })

window.addEventListener('DOMContentLoaded', init)
</script>
</body>
