        const sel = t.alias === selVm ? ' sel-vm' : ''
        const status = v ? (v.reachable ? fmtNum(v.n_running) + '/' + fmtNum(v.n_containers) + ' running' : (v.error || 'unreachable')) : 'not probed'
        rows.sort((a, b) => (a.Names || '').localeCompare(b.Names || ''))
        html += `<tr class="catrow${sel}" data-vmhdr="${esc(t.alias)}"><td colspan="7">${esc(t.alias)} · ${esc(status)}</td></tr>` +
          (rows.length ? rows.map(c => rowHtml(c, t.alias)).join('')
            : `<tr><td colspan="7" style="color:#6b7280;padding-left:14px">no containers</td></tr>`)
      }
      $('#c-conthdr-' + id).textContent = 'CONTAINERS · by VM · ' + total
      tb.innerHTML = html || '<tr><td colspan="7" style="color:#6b7280">no VMs configured</td></tr>'
    }
  }
  function renderLogs() {
    const lines = logRaw.split('\n')
    const f = logq ? lines.filter(l => l.toLowerCase().indexOf(logq) !== -1) : lines
    $('#c-logfeed-' + id).innerHTML = esc(f.join('\n')) || '(no output)'
  }
  // Container picker for the SYSTEM/CONTAINER log-source filter — repopulated
  // whenever the selected VM's container list changes (probe/select).
  function populateLogContainerPicker() {
    const sel = $('#c-logcont-' + id); if (!sel) return
    const list = ((vms[selVm] || {}).containers || []).map(c => c.Names).filter(Boolean)
    const cur = sel.value
    sel.innerHTML = '<option value="">— pick container —</option>' + list.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
    if (list.includes(cur)) sel.value = cur
    else if (list.includes(selCont)) sel.value = selCont
  }
  async function loadLogs() {
    if (!selVm) return
    // logSrc drives WHAT we fetch: 'system' → VM journal (container=null);
    // 'container' → the picked container's docker logs.
    const container = logSrc === 'container' ? (selCont || null) : null
    $('#c-loghdr-' + id).textContent = 'LOG CENTER · ' + selVm + (container ? ' · ' + container : ' · system journal')
    if (logSrc === 'container' && !container) {
      $('#c-logfeed-' + id).textContent = 'pick a container above, or click one in the CONTAINERS table…'
      return
    }
    $('#c-logfeed-' + id).textContent = 'loading…'
    try { logRaw = await invoke('cloud_logs', { alias: selVm, container, tail }) }
    catch (e) { logRaw = 'error: ' + e }
    if (!leaf.isConnected) return
    renderLogs()
    $('#c-logfeed-' + id).scrollTop = $('#c-logfeed-' + id).scrollHeight
  }
  function selectVm(alias) { selVm = alias; selCont = null; renderVms(); renderConts(); populateLogContainerPicker(); loadLogs() }
  async function probe() {
    await Promise.all(targets.map(async t => {
      const [v, ping, stats] = await Promise.all([
        invoke('cloud_vm', { alias: t.alias }).catch(e => ({ alias: t.alias, reachable: false, error: String(e) })),
        t.pub ? invoke('cloud_ping', { url: t.pub }).catch(() => null) : Promise.resolve(null),
        invoke('cloud_stats', { alias: t.alias }).catch(() => null),   // docker stats over the SSH mux
      ])
      v.ping = ping
      v.stats = {}; for (const s of ((stats && stats.stats) || [])) v.stats[s.Name] = s
      vms[t.alias] = v
      // BOTH view modes now show every VM's containers (grouped), so refresh
      // regardless of which one is active.
      if (leaf.isConnected) { renderVms(); renderConts(); if (t.alias === selVm) populateLogContainerPicker() }
    }))
    if (!leaf.isConnected) return
    if (!selVm) { const first = targets.find(t => (vms[t.alias] || {}).reachable) || targets[0]; if (first) selectVm(first.alias) }
    else { renderConts(); populateLogContainerPicker() }
  }
  async function init() {
    // Only the local static topology (cloud_targets — no network) loads on
    // open. The SSH/docker probe() is heavy, network-dependent work and
    // must NEVER run just because this tab was opened — only on explicit
    // refresh click or when the auto-toggle is on. Was calling probe()
    // here unconditionally, which froze the tab open on a slow/unreachable
    // VM; fixed to render the (unprobed) VM list instantly instead.
    const data = await cachedInvoke('cloud_targets').catch(() => null)
    targets = (data && data.vms) || []
    catMap = (data && data.service_categories) || []
    if (!leaf.isConnected) return
    renderVms()
  }

  const syncLogSrcButtons = () => { for (const x of $('#c-logsrc-' + id).children) x.classList.toggle('on', x.dataset.v === logSrc) }
  $('#c-vms-' + id).addEventListener('click', e => { const c = e.target.closest('.vmcard'); if (c) selectVm(c.dataset.vm) })
  $('#c-cont-' + id).addEventListener('click', e => {
    const hdr = e.target.closest('tr[data-vmhdr]')
    if (hdr) { selVm = hdr.dataset.vmhdr; selCont = null; logSrc = 'system'; syncLogSrcButtons(); renderConts(); populateLogContainerPicker(); loadLogs(); return }
    const r = e.target.closest('tr[data-cont]'); if (!r) return
    selCont = r.dataset.cont || null; if (r.dataset.vm) selVm = r.dataset.vm   // service view: follow the row's VM
    logSrc = 'container'; syncLogSrcButtons(); populateLogContainerPicker()
    renderConts(); loadLogs()
  })
  $('#c-view-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    viewMode = b.dataset.v; for (const x of $('#c-view-' + id).children) x.classList.toggle('on', x === b); renderConts()
  })
  $('#c-logsrc-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    logSrc = b.dataset.v; syncLogSrcButtons()
    if (logSrc === 'container') populateLogContainerPicker()
    loadLogs()
  })
  $('#c-logcont-' + id).addEventListener('change', e => { selCont = e.target.value || null; loadLogs() })
  $('#c-logref-' + id).addEventListener('click', loadLogs)
  $('#c-logq-' + id).addEventListener('input', e => { logq = e.target.value.trim().toLowerCase(); renderLogs() })
  $('#c-tail-' + id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tail = +b.dataset.v; for (const x of $('#c-tail-' + id).children) x.classList.toggle('on', x === b); loadLogs() })
  $('#c-logcopy-' + id).addEventListener('click', () => { clip.write(logRaw); const b = $('#c-logcopy-' + id), t = b.textContent; b.textContent = '✓'; setTimeout(() => b.textContent = t, 1200) })

  init()   // cheap local topology only — always runs; probe() (network) never does
  return { probe }
  },
  async refresh(api) { await api.probe() },
})

// ══ Data Sync Center (no PTY) — data topology, sync, peers, stats ════
function makeDataSync(tabId) { return buildFrame('datasync', tabId) }
registerFrame({
  type: 'datasync',
  title: '🔄 data-sync',
  refreshMs: 10000,
  autoFirstOpen: true,   // matches prior behavior — load() always ran on open
  make(el, ctx) {
  const { id } = ctx
  const P = (t, hdr, body) => `<div class="panel ${t}"><div class="ph"><span>${hdr}</span></div>${body}</div>`
  el.innerHTML = `
      <div class="jrn-stats" id="d-stats-${id}"></div>
      <div class="ds-grid">
        ${P('', 'LOCAL · MOUNTS', '<div class="seg" id="d-mseg-' + id + '"></div><div class="seg-legend" id="d-mleg-' + id + '"></div><div class="bars" id="d-mounts-' + id + '"></div>')}
        ${P('', 'DOCKER VOLUMES', '<div class="ds-list" id="d-vols-' + id + '"></div>')}
        ${P('', 'GIT REPOS', '<div class="ds-list" id="d-git-' + id + '"></div>')}
        ${P('', 'RCLONE · CLOUD REMOTES', '<div class="ds-list" id="d-remotes-' + id + '"></div>')}
        ${P('', 'S3 · ORACLE OBJECT STORAGE', '<div class="ds-list" id="d-s3-' + id + '"></div>')}
        ${P('', 'GHCR · CONTAINER IMAGES', '<div class="ds-list" id="d-ghcr-' + id + '"></div>')}
        ${P('', 'RELEASES', '<div class="ds-list" id="d-rel-' + id + '"></div>')}
        ${P('', 'SYNC PEERS', '<div class="ds-list" id="d-peers-' + id + '"></div>')}
        ${P('', 'FUSE · USB', '<div class="ds-list" id="d-fuseusb-' + id + '"></div>')}
        ${P('', 'SYNC RULES · RCLONE', '<div class="ds-list" id="d-rules-' + id + '"></div>')}
      </div>`
  const $ = s => el.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const empty = m => `<div class="ds-empty">${m}</div>`
  const kv = (k, v, t) => `<div class="ds-kv"><span class="k">${esc(k)}${t ? ' <span class="t">' + esc(t) + '</span>' : ''}</span><span class="v">${esc(v)}</span></div>`

  function renderLocal(d) {
    // stat tiles
    let tUsed = 0, tSize = 0
    for (const m of (d.mounts || [])) { tUsed += +m.used || 0; tSize += +m.size || 0 }
    const dirtyRepos = (d.repos || []).filter(r => r.dirty > 0).length
    $('#d-stats-' + id).innerHTML = [
      ['disk used', fmtBytes(tUsed), ''], ['disk total', fmtBytes(tSize), ''],
      ['mounts', (d.mounts || []).length, ''], ['volumes', (d.volumes || []).length, ''],
      ['git dirty', dirtyRepos + '/' + (d.repos || []).length, dirtyRepos ? 'warn' : ''],
      ['remotes', (d.remotes || []).length, ''], ['peers', (d.peers || []).length, 'info'],
    ].map(([l, n, c]) => `<div class="jstat ${c}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('')
    // stacked color segment bar — used space per filesystem (like the MEM box)
    const mts = d.mounts || []
    const dpal = ['hsl(0,72%,56%)', 'hsl(190,72%,55%)', 'hsl(45,80%,55%)', 'hsl(280,60%,62%)', 'hsl(150,52%,50%)', 'hsl(20,82%,56%)', 'hsl(320,60%,60%)']
    const dTotUsed = mts.reduce((a, m) => a + (+m.used || 0), 0) || 1
    $('#d-mseg-' + id).innerHTML = mts.map((m, i) => `<span style="width:${(+m.used / dTotUsed * 100).toFixed(2)}%;background:${dpal[i % dpal.length]}" title="${esc(m.target)} ${fmtBytes(+m.used || 0)}"></span>`).join('')
    $('#d-mleg-' + id).innerHTML = mts.map((m, i) => `<span><i style="background:${dpal[i % dpal.length]}"></i>${esc(m.target)} ${fmtBytes(+m.used || 0)}</span>`).join('')
    // per-mount gradient bars (real per-device usage after dedupe)
    $('#d-mounts-' + id).innerHTML = mts.map(m => {
      const pct = parseFloat(String(m.usep)) || (m.size ? (+m.used / +m.size * 100) : 0)
      return bar(m.target + '  ' + m.fstype, pct, fmtBytes(+m.used || 0) + ' / ' + fmtBytes(+m.size || 0) + '  ' + pct.toFixed(0) + '%')
    }).join('') || empty('no mounts')
    // volumes
    $('#d-vols-' + id).innerHTML = (d.volumes || []).map(v => kv(v.Name || v.name || '?', v.Driver || v.driver || '', (v.Scope || ''))).join('') || empty('no docker volumes')
    // git
    $('#d-git-' + id).innerHTML = (d.repos || []).map(r => {
      const b = []
      if (r.dirty) b.push(`<span class="ds-badge dirty">±${r.dirty}</span>`); else b.push(`<span class="ds-badge clean">clean</span>`)
      if (r.ahead) b.push(`<span class="ds-badge ahead">↑${r.ahead}</span>`)
      if (r.behind) b.push(`<span class="ds-badge behind">↓${r.behind}</span>`)
      return `<div class="ds-repo"><span class="rn">${esc(r.name)}</span><span class="rl" title="${esc(r.last)}">${esc(r.branch)} · ${esc(r.last)}</span><span class="rb">${b.join('')}</span></div>`
    }).join('') || empty('no repos')
    // rclone remotes + S3 split
    const s3t = d.s3_types || ['s3', 'oracleobjectstorage']
    $('#d-remotes-' + id).innerHTML = (d.remotes || []).map(r => kv(r.name, '', r.type)).join('') || empty('no rclone remotes')
    const s3 = (d.remotes || []).filter(r => s3t.indexOf(r.type) !== -1)
    $('#d-s3-' + id).innerHTML = s3.map(r => kv(r.name, '', r.type)).join('') || empty('no S3 / OCI object storage remote configured')
    // fuse + usb
    const fu = (d.fuse || []).map(f => kv(f.target, f.fstype, 'fuse')).join('') +
      (d.usb || []).map(u => kv((u.name || '') + (u.label ? ' · ' + u.label : ''), fmtBytes(+u.size || 0), 'usb ' + (u.mountpoint || 'unmounted'))).join('')
    $('#d-fuseusb-' + id).innerHTML = fu || empty('no fuse / usb')
    // rules
    $('#d-rules-' + id).innerHTML = (d.rclone_rules || []).map(r => kv(r.name, r.src || '', r.note || '')).join('') || empty('no sync rules configured')
    // peers (reachability filled async)
    peers = d.peers || []
    $('#d-peers-' + id).innerHTML = peers.map((p, i) =>
      `<div class="ds-peer" id="d-peer-${id}-${i}"><span class="dot" style="color:#6b7280;background:#6b7280"></span><span class="ph">${esc(p.name)}</span><span class="pk">${esc(p.kind)}</span><span class="pi">…</span></div>`).join('') || empty('no peers')
  }
  let peers = []
  async function probePeers() {
    await Promise.all(peers.map(async (p, i) => {
      const r = await invoke('peer_ping', { host: p.host || p.name, local: p.kind === 'local' }).catch(() => ({ up: false, info: 'error' }))
      const el = $('#d-peer-' + id + '-' + i); if (!el) return
      const col = r.up ? '#4ade80' : '#f87171'
      el.querySelector('.dot').style.color = el.querySelector('.dot').style.background = col
      el.querySelector('.pi').textContent = r.info || (r.up ? 'up' : 'down')
    }))
  }
  async function loadGh() {
    $('#d-ghcr-' + id).innerHTML = empty('loading…'); $('#d-rel-' + id).innerHTML = empty('loading…')
    const g = await invoke('data_gh').catch(() => null)
    if (!el.isConnected || !g) { $('#d-ghcr-' + id).innerHTML = empty('unavailable'); $('#d-rel-' + id).innerHTML = empty('unavailable'); return }
    $('#d-ghcr-' + id).innerHTML = (g.ghcr || []).map(p => kv(p.name, 'v×' + (p.versions || 0), p.visibility)).join('') || empty('no GHCR packages (needs read:packages)')
    $('#d-rel-' + id).innerHTML = (g.releases || []).map(rr =>
      (rr.releases || []).slice(0, 2).map(rel => kv((rr.repo || '').split('/').pop() + ' ' + (rel.tagName || ''), rel.isLatest ? 'latest' : '', '')).join('')).join('') || empty('no releases')
  }
  async function load() {
    const d = await cachedInvoke('data_sync').catch(() => null)
    if (!el.isConnected) return
    if (d) { renderLocal(d); probePeers() }
    await loadGh()
  }

  const cached = cachePeek('data_sync')
  if (cached) renderLocal(cached)   // instant paint — probePeers()/GHCR still wait for a real refresh
  return { load }
  },
  async refresh(api) { await api.load() },
})

// ══ DEV CONTROL (no PTY) — invoke() instrumentation, live ═══════════
// Answers "what's actually trashing the UX": every invoke() call app-wide
// (SSH probes, docker stats, journal reads, process scans) is timed by the
// wrapper near the top of this file and pushed into devctlLog. This tab
// aggregates by command (count/total/avg/max — sorted by TOTAL time, the
// real culprit ranking) or shows the raw recent-call feed, live via
// devctlListeners rather than polling.
// DevControl is a special frame: it never calls invoke() itself — it reads
// the devctlLog ring buffer directly and live-pushes on every OTHER
// dashboard's invoke() call (via devctlListeners), rather than polling on
// a timer. refresh() still exists (re-render on manual click / the
// manager's own auto-timer as a fallback), but the live push is what makes
// it feel instant; ctx.isAuto()/isActiveTab() (see frame.js) gate that
// push the same way the timer gates itself.
function makeDevControl(tabId) { return buildFrame('devctl', tabId) }
registerFrame({
  type: 'devctl',
  title: '🛠 devctl',
  refreshMs: 5000,        // fallback tick only — the live push is the real driver
  autoFirstOpen: true,    // pure local re-render, no cost to show current state on open
  make(el, ctx) {
  const { id, isAuto, isActiveTab } = ctx
  el.innerHTML = `
      <div class="panel">
        <div class="ph"><span id="dc-hdr-${id}">DEV CONTROL · invoke() instrumentation</span>
          <span class="proc-tools">
            <span class="ptbl-tabs" id="dc-view-${id}"><button data-v="agg" class="on">BY COMMAND</button><button data-v="recent">RECENT</button></span>
            <button class="cpbtn" id="dc-clear-${id}" title="Clear the recorded log">🗑 clear</button>
          </span>
        </div>
        <div class="ptbl-wrap"><table class="ptbl">
          <thead id="dc-head-${id}"></thead>
          <tbody id="dc-body-${id}"></tbody>
        </table></div>
      </div>`
  const $ = s => el.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const fmtMs = ms => ms >= 1000 ? (ms / 1000).toFixed(2) + 's' : ms.toFixed(0) + 'ms'
  const agoStr = at => { const s = Math.max(0, Math.round((Date.now() - at) / 1000)); return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago' }
  let view = 'agg'

  function renderAgg() {
    $('#dc-head-' + id).innerHTML = '<tr><th>COMMAND</th><th class="num">CALLS</th><th class="num">TOTAL</th>' +
      '<th class="num">AVG</th><th class="num">MAX</th><th class="num">ERRORS</th><th class="num">LAST</th></tr>'
    const agg = new Map()
    for (const e of devctlLog) {
      const a = agg.get(e.cmd) || { cmd: e.cmd, calls: 0, total: 0, max: 0, errs: 0, last: 0 }
      a.calls++; a.total += e.ms; a.max = Math.max(a.max, e.ms); if (!e.ok) a.errs++; a.last = Math.max(a.last, e.at)
      agg.set(e.cmd, a)
    }
    const rows = [...agg.values()].sort((a, b) => b.total - a.total)
    $('#dc-body-' + id).innerHTML = rows.map(a => {
      const avg = a.total / a.calls, cc = avg > 800 ? 'hot' : avg > 200 ? 'warm' : ''
      return `<tr><td class="n">${esc(a.cmd)}</td><td class="num">${a.calls}</td>` +
        `<td class="num ${cc}">${fmtMs(a.total)}</td><td class="num ${cc}">${fmtMs(avg)}</td>` +
        `<td class="num">${fmtMs(a.max)}</td><td class="num ${a.errs ? 'hot' : ''}">${a.errs || '·'}</td>` +
        `<td class="num st">${agoStr(a.last)}</td></tr>`
    }).join('') || `<tr><td colspan="7" style="color:#6b7280">no invoke() calls recorded yet</td></tr>`
  }
  function renderRecent() {
    $('#dc-head-' + id).innerHTML = '<tr><th class="num">WHEN</th><th>COMMAND</th><th>ARGS</th><th class="num">MS</th><th>OK</th></tr>'
    const rows = devctlLog.slice().reverse().slice(0, 200)
    $('#dc-body-' + id).innerHTML = rows.map(e => {
      const cc = e.ms > 800 ? 'hot' : e.ms > 200 ? 'warm' : ''
      const args = e.args ? esc(JSON.stringify(e.args)).slice(0, 60) : '·'
      return `<tr><td class="num st">${agoStr(e.at)}</td><td class="n">${esc(e.cmd)}</td>` +
        `<td class="hier">${args}</td><td class="num ${cc}">${fmtMs(e.ms)}</td>` +
        `<td class="${e.ok ? '' : 'hot'}">${e.ok ? '✓' : '✗ ' + esc(e.err || '')}</td></tr>`
    }).join('') || `<tr><td colspan="5" style="color:#6b7280">no invoke() calls recorded yet</td></tr>`
  }
  function render() { view === 'agg' ? renderAgg() : renderRecent() }
  // Off by default — even though this is just a DOM re-render (no network
  // cost), the same convention applies everywhere: no dashboard updates
  // itself just from being open, and auto only ticks while visible.
  const onNewEntry = () => { if (isAuto() && isActiveTab() && el.isConnected) render() }
  devctlListeners.add(onNewEntry)

  $('#dc-view-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    for (const x of $('#dc-view-' + id).children) x.classList.remove('on')
    b.classList.add('on'); view = b.dataset.v; render()
  })
  $('#dc-clear-' + id).addEventListener('click', () => { devctlLog.length = 0; render() })

  return { render, cleanup: () => devctlListeners.delete(onNewEntry) }
  },
  refresh(api) { api.render() },
  destroy(api) { api.cleanup() },
})

// ══ AGI dashboard (no PTY) — Claude Code usage analytics ═════════════
function makeAGI(tabId) { return buildFrame('agi', tabId) }
registerFrame({
  type: 'agi',
  title: '🤖 agi',
  refreshMs: 4000,
  autoFirstOpen: true,   // matches prior behavior — load()+pollLive() always ran on open
  make(el, ctx) {
  const { id, leaf } = ctx
  el.innerHTML = `
      <div class="agi-cur" id="a-cur-${id}"></div>
      <div class="jrn-stats" id="a-stats-${id}"></div>
      <div class="agi-grid">
        <div class="panel agi-panel-wide"><div class="ph"><span>5-HOUR CYCLES</span><span class="sub">tokens · ~16 days</span></div>
          <div class="agi-g-wrap"><canvas id="a-g5h-${id}"></canvas><div class="agi-g-axis" id="a-ax5h-${id}"></div></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>DAY BY DAY</span><span class="sub">cost + tokens · 30 days</span></div>
          <div class="agi-dual">
            <div class="agi-g-row"><span class="lbl">$</span><div class="yaxis" id="a-gday-costy-${id}"></div><canvas id="a-gday-cost-${id}"></canvas></div>
            <div class="agi-g-row"><span class="lbl">TOK</span><div class="yaxis" id="a-gday-toky-${id}"></div><canvas id="a-gday-tok-${id}"></canvas></div>
          </div>
          <div class="agi-g-axis" id="a-axday-${id}"></div></div>
        <div class="panel"><div class="ph"><span>BY MODEL</span></div><div id="a-models-${id}" style="flex:1 1 0;min-height:0;overflow-y:auto"></div></div>
        <div class="panel"><div class="ph"><span>ESTIMATES</span></div><div class="kv" id="a-est-${id}"></div></div>
      </div>
      <div class="panel" style="flex:1 1 0;min-height:200px;"><div class="ph"><span>SESSIONS</span><span class="sub" id="a-sesssub-${id}"></span></div>
        <div class="ptbl-wrap"><table class="agi-tbl">
          <thead><tr><th>SESSION</th><th>PROJECT</th><th>MODEL</th><th>STARTED</th><th>LAST ACTIVE</th>
            <th class="num">DUR</th><th class="num">IN</th><th class="num">OUT</th><th class="num">CACHE</th><th class="num">$</th></tr></thead>
          <tbody id="a-sess-${id}"></tbody></table></div></div>`
  const $ = s => el.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const modelColor = m => { let h = 0; for (const c of m) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h},65%,60%)` }
  const usd = n => '$' + (n || 0).toFixed(2)
  // Every number shown here MUST carry a decimal or thousands separator — never
  // a bare unformatted integer. Tokens scale 1000-based (decimal), matching the
  // statusline's own fmt_tok(), NOT fmtBytes' 1024-based byte scaling.
  const fmtTok = n => {
    n = n || 0
    if (n < 1000) return n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })
    const u = ['K', 'M', 'B', 'T']; let i = -1
    do { n /= 1000; i++ } while (n >= 1000 && i < u.length - 1)
    return n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + u[i]
  }
  const fmtNum = n => (n || 0).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })

  function render(d) {
    if (!d) { $('#a-note-' + id).textContent = 'unavailable'; return }
    $('#a-note-' + id).textContent = (d.file_count || 0) + ' session files scanned'

    // ── stat tiles ──
    const t = d.total
    $('#a-stats-' + id).innerHTML = [
      ['total cost', usd(t.cost), ''], ['messages', fmtNum(t.messages), ''],
      ['input tok', fmtTok(t.input), ''], ['output tok', fmtTok(t.output), ''],
      ['cache read', fmtTok(t.cache_read), 'info'], ['cache write', fmtTok(t.cache_write), 'warn'],
    ].map(([l, n, cls]) => `<div class="jstat ${cls}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('')

    // ── 5h cycles graph (tokens) + day-by-day graph (cost) ──
    const h5 = d.by_5h || []
    drawGraph($('#a-g5h-' + id), h5.map(b => b.usage.input + b.usage.output + b.usage.cache_read + b.usage.cache_write), null, 265)
    $('#a-ax5h-' + id).innerHTML = h5.length ? `<span>${esc(h5[0].start)}</span><span>${esc(h5[h5.length - 1].start)}</span>` : ''
    // DAY BY DAY: cost + token-volume, each its own graph with a real numeric
    // Y-axis (max at top, 0 at bottom) — not just an unlabeled sparkline.
    const dd = d.by_day || []
    const costSeries = dd.map(x => x.usage.cost)
    const tokSeries = dd.map(x => x.usage.input + x.usage.output + x.usage.cache_read + x.usage.cache_write)
    const maxCost = Math.max(1e-6, ...costSeries, 0)
    const maxTok = Math.max(1, ...tokSeries, 0)
    drawGraph($('#a-gday-cost-' + id), costSeries, maxCost, 45)
    drawGraph($('#a-gday-tok-' + id), tokSeries, maxTok, 265)
    $('#a-gday-costy-' + id).innerHTML = `<span>${usd(maxCost)}</span><span>$0.00</span>`
    $('#a-gday-toky-' + id).innerHTML = `<span>${fmtTok(maxTok)}</span><span>0.0</span>`
    $('#a-axday-' + id).innerHTML = dd.length ? `<span>${esc(dd[0].date)}</span><span>${esc(dd[dd.length - 1].date)}</span>` : ''

    // ── by model ──
    const models = (d.by_model || []).slice().sort((a, b) => b.usage.cost - a.usage.cost)
    const maxModelCost = Math.max(1e-6, ...models.map(m => m.usage.cost))
    $('#a-models-' + id).innerHTML = models.map(m => {
      const col = modelColor(m.model), pct = m.usage.cost / maxModelCost * 100
      return `<div class="agi-model-row"><span class="mn">${esc(m.model)}</span>` +
        `<span class="track"><i style="width:${pct.toFixed(1)}%;background:${col};color:${col}"></i></span>` +
        `<span class="cost">${usd(m.usage.cost)}</span></div>`
    }).join('') || '<span class="ds-empty">no data</span>'

    // ── estimates: daily/weekly average, projected monthly, per-5h average ──
    const kv = (k, v) => `<span class="k">${k}</span><span class="v">${v}</span>`
    const daysCovered = Math.max(1, dd.length)
    const avgDay = t.cost / daysCovered
    const recent7 = dd.slice(-7).reduce((a, x) => a + x.usage.cost, 0) / Math.max(1, Math.min(7, dd.length))
    const avg5h = h5.length ? h5.reduce((a, x) => a + x.usage.cost, 0) / h5.length : 0
    $('#a-est-' + id).innerHTML =
      kv('avg $/day (all-time)', usd(avgDay)) + kv('avg $/day (last 7d)', usd(recent7)) +
      kv('avg $/5h cycle', usd(avg5h)) + kv('projected $/30d', usd(recent7 * 30)) +
      kv('cache read (all-time)', fmtTok(t.cache_read)) +
      kv('sessions tracked', fmtNum((d.sessions || []).length))

    // ── sessions table — FULL history, every session ever recorded ──
    const sess = d.sessions || []
    $('#a-sesssub-' + id).textContent = fmtNum(sess.length) + ' total (full history)'
    $('#a-sess-' + id).innerHTML = sess.map(s => {
      const u = s.usage
      return `<tr><td>${esc((s.id || '').slice(0, 8))}</td><td class="proj">${esc(s.project)}</td><td class="model">${esc(s.model)}</td>` +
        `<td>${esc(s.started)}</td><td>${esc(s.last_active)}</td><td class="num">${fmtNum(s.duration_min)}m</td>` +
        `<td class="num">${fmtTok(u.input)}</td><td class="num">${fmtTok(u.output)}</td>` +
        `<td class="num">${fmtTok(u.cache_read + u.cache_write)}</td><td class="num cost">${usd(u.cost)}</td></tr>`
    }).join('') || '<tr><td colspan="10" style="color:#6b7280">no sessions found</td></tr>'
  }
  async function load() {
    const d = await cachedInvoke('agi_usage').catch(() => null)
    if (leaf.isConnected) render(d)
  }

  // ── LIVE current-session monitor — cheap (one file, not the full 200+
  // history scan), polled every few seconds so this banner tracks the
  // session actively running RIGHT NOW without re-scanning everything.
  const secsAgo = s => s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : Math.floor(s / 3600) + 'h ago'
  async function pollLive() {
    const c = await invoke('agi_live').catch(() => null)
    if (!leaf.isConnected) return
    if (c) {
      const u = c.usage
      const fresh = (c.seconds_since_last || 0) < 30
      // Full breakdown, not just input+output — on a heavy-caching session
      // cache_read/cache_write dwarf input+output (often by 10,000x), so
      // dropping them made the live banner look nearly empty even during
      // an actively churning session.
      const total = u.input + u.output + u.cache_read + u.cache_write
      $('#a-cur-' + id).innerHTML =
        `<span class="agi-live-dot${fresh ? ' on' : ''}"></span>` +
        `<span><b>${esc(c.project)}</b></span><span><span class="k">model</span> <span class="v">${esc(c.model)}</span></span>` +
        `<span><span class="k">session</span> <span class="v">${esc((c.id || '').slice(0, 8))}</span></span>` +
        `<span><span class="k">started</span> <span class="v">${esc(c.started)}</span></span>` +
        `<span><span class="k">duration</span> <span class="v">${fmtNum(c.duration_min)}m</span></span>` +
        `<span><span class="k">last msg</span> <span class="v">${secsAgo(c.seconds_since_last || 0)}</span></span>` +
        `<span><span class="k">in/out</span> <span class="v">${fmtTok(u.input)} / ${fmtTok(u.output)}</span></span>` +
        `<span><span class="k">cache r/w</span> <span class="v">${fmtTok(u.cache_read)} / ${fmtTok(u.cache_write)}</span></span>` +
        `<span><span class="k">total tok</span> <span class="v">${fmtTok(total)}</span></span>` +
        `<span><span class="k">cost</span> <span class="v" style="color:#fbbf24">${usd(u.cost)}</span></span>`
    } else { $('#a-cur-' + id).innerHTML = '<span style="color:#6b7280">no active session detected</span>' }
  }

  const cached = cachePeek('agi_usage')
  if (cached) render(cached)   // instant paint — the live banner still waits for a real refresh
  return { load, pollLive }
  },
  async refresh(api) { await api.load(); await api.pollLive() },
})
</script>
<script src="js/boot.js"></script>
</body>
</html>
