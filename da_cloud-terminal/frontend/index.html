            <div class="agi-g-row"><span class="lbl">TOK</span><div class="yaxis" id="a-gday-toky-${id}"></div><canvas id="a-gday-tok-${id}"></canvas></div>
          </div>
          <div class="agi-g-axis" id="a-axday-${id}"></div></div>
        <div class="panel"><div class="ph"><span>BY MODEL</span></div><div id="a-models-${id}" style="flex:1 1 0;min-height:0;overflow-y:auto"></div></div>
        <div class="panel"><div class="ph"><span>ESTIMATES</span></div><div class="kv" id="a-est-${id}"></div></div>
      </div>
      <div class="panel" style="flex:1 1 0;min-height:200px;"><div class="ph"><span>SESSIONS</span><span class="sub" id="a-sesssub-${id}"></span></div>
        <div class="ptbl-wrap"><table class="agi-tbl">
          <thead><tr><th>SESSION</th><th>PROJECT</th><th>MODEL</th><th>STARTED</th><th>LAST ACTIVE</th>
            <th class="num">DUR</th><th class="num">IN</th><th class="num">OUT</th><th class="num">CACHE</th><th class="num">$</th></tr></thead>
          <tbody id="a-sess-${id}"></tbody></table></div></div>
    </div>`
  const $ = s => leaf.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const modelColor = m => { let h = 0; for (const c of m) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h},65%,60%)` }
  const usd = n => '$' + (n || 0).toFixed(2)
  // Every number shown here MUST carry a decimal or thousands separator — never
  // a bare unformatted integer. Tokens scale 1000-based (decimal), matching the
  // statusline's own fmt_tok(), NOT fmtBytes' 1024-based byte scaling.
  const fmtTok = n => {
    n = n || 0
    if (n < 1000) return n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })
    const u = ['K', 'M', 'B', 'T']; let i = -1
    do { n /= 1000; i++ } while (n >= 1000 && i < u.length - 1)
    return n.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + u[i]
  }
  const fmtNum = n => (n || 0).toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 })

  async function load() {
    $('#a-refresh-' + id).textContent = '… scanning'
    const d = await invoke('agi_usage').catch(() => null)
    if (!leaf.isConnected) return
    $('#a-refresh-' + id).textContent = '↻ refresh'
    if (!d) { $('#a-note-' + id).textContent = 'unavailable'; return }
    $('#a-note-' + id).textContent = (d.file_count || 0) + ' session files scanned'

    // ── stat tiles ──
    const t = d.total
    $('#a-stats-' + id).innerHTML = [
      ['total cost', usd(t.cost), ''], ['messages', fmtNum(t.messages), ''],
      ['input tok', fmtTok(t.input), ''], ['output tok', fmtTok(t.output), ''],
      ['cache read', fmtTok(t.cache_read), 'info'], ['cache write', fmtTok(t.cache_write), 'warn'],
    ].map(([l, n, cls]) => `<div class="jstat ${cls}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('')

    // ── 5h cycles graph (tokens) + day-by-day graph (cost) ──
    const h5 = d.by_5h || []
    drawGraph($('#a-g5h-' + id), h5.map(b => b.usage.input + b.usage.output + b.usage.cache_read + b.usage.cache_write), null, 265)
    $('#a-ax5h-' + id).innerHTML = h5.length ? `<span>${esc(h5[0].start)}</span><span>${esc(h5[h5.length - 1].start)}</span>` : ''
    // DAY BY DAY: cost + token-volume, each its own graph with a real numeric
    // Y-axis (max at top, 0 at bottom) — not just an unlabeled sparkline.
    const dd = d.by_day || []
    const costSeries = dd.map(x => x.usage.cost)
    const tokSeries = dd.map(x => x.usage.input + x.usage.output + x.usage.cache_read + x.usage.cache_write)
    const maxCost = Math.max(1e-6, ...costSeries, 0)
    const maxTok = Math.max(1, ...tokSeries, 0)
    drawGraph($('#a-gday-cost-' + id), costSeries, maxCost, 45)
    drawGraph($('#a-gday-tok-' + id), tokSeries, maxTok, 265)
    $('#a-gday-costy-' + id).innerHTML = `<span>${usd(maxCost)}</span><span>$0.00</span>`
    $('#a-gday-toky-' + id).innerHTML = `<span>${fmtTok(maxTok)}</span><span>0.0</span>`
    $('#a-axday-' + id).innerHTML = dd.length ? `<span>${esc(dd[0].date)}</span><span>${esc(dd[dd.length - 1].date)}</span>` : ''

    // ── by model ──
    const models = (d.by_model || []).slice().sort((a, b) => b.usage.cost - a.usage.cost)
    const maxModelCost = Math.max(1e-6, ...models.map(m => m.usage.cost))
    $('#a-models-' + id).innerHTML = models.map(m => {
      const col = modelColor(m.model), pct = m.usage.cost / maxModelCost * 100
      return `<div class="agi-model-row"><span class="mn">${esc(m.model)}</span>` +
        `<span class="track"><i style="width:${pct.toFixed(1)}%;background:${col};color:${col}"></i></span>` +
        `<span class="cost">${usd(m.usage.cost)}</span></div>`
    }).join('') || '<span class="ds-empty">no data</span>'

    // ── estimates: daily/weekly average, projected monthly, per-5h average ──
    const kv = (k, v) => `<span class="k">${k}</span><span class="v">${v}</span>`
    const daysCovered = Math.max(1, dd.length)
    const avgDay = t.cost / daysCovered
    const recent7 = dd.slice(-7).reduce((a, x) => a + x.usage.cost, 0) / Math.max(1, Math.min(7, dd.length))
    const avg5h = h5.length ? h5.reduce((a, x) => a + x.usage.cost, 0) / h5.length : 0
    $('#a-est-' + id).innerHTML =
      kv('avg $/day (all-time)', usd(avgDay)) + kv('avg $/day (last 7d)', usd(recent7)) +
      kv('avg $/5h cycle', usd(avg5h)) + kv('projected $/30d', usd(recent7 * 30)) +
      kv('cache read (all-time)', fmtTok(t.cache_read)) +
      kv('sessions tracked', fmtNum((d.sessions || []).length))

    // ── sessions table — FULL history, every session ever recorded ──
    const sess = d.sessions || []
    $('#a-sesssub-' + id).textContent = fmtNum(sess.length) + ' total (full history)'
    $('#a-sess-' + id).innerHTML = sess.map(s => {
      const u = s.usage
      return `<tr><td>${esc((s.id || '').slice(0, 8))}</td><td class="proj">${esc(s.project)}</td><td class="model">${esc(s.model)}</td>` +
        `<td>${esc(s.started)}</td><td>${esc(s.last_active)}</td><td class="num">${fmtNum(s.duration_min)}m</td>` +
        `<td class="num">${fmtTok(u.input)}</td><td class="num">${fmtTok(u.output)}</td>` +
        `<td class="num">${fmtTok(u.cache_read + u.cache_write)}</td><td class="num cost">${usd(u.cost)}</td></tr>`
    }).join('') || '<tr><td colspan="10" style="color:#6b7280">no sessions found</td></tr>'
  }

  // ── LIVE current-session monitor — cheap (one file, not the full 200+
  // history scan), polled every few seconds so this banner tracks the
  // session actively running RIGHT NOW without re-scanning everything.
  const secsAgo = s => s < 60 ? s + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : Math.floor(s / 3600) + 'h ago'
  async function pollLive() {
    const c = await invoke('agi_live').catch(() => null)
    if (!leaf.isConnected) return
    if (c) {
      const u = c.usage
      const fresh = (c.seconds_since_last || 0) < 30
      $('#a-cur-' + id).innerHTML =
        `<span class="agi-live-dot${fresh ? ' on' : ''}"></span>` +
        `<span><b>${esc(c.project)}</b></span><span><span class="k">model</span> <span class="v">${esc(c.model)}</span></span>` +
        `<span><span class="k">session</span> <span class="v">${esc((c.id || '').slice(0, 8))}</span></span>` +
        `<span><span class="k">started</span> <span class="v">${esc(c.started)}</span></span>` +
        `<span><span class="k">duration</span> <span class="v">${fmtNum(c.duration_min)}m</span></span>` +
        `<span><span class="k">last msg</span> <span class="v">${secsAgo(c.seconds_since_last || 0)}</span></span>` +
        `<span><span class="k">tokens</span> <span class="v">${fmtTok(u.input + u.output)}</span></span>` +
        `<span><span class="k">cost</span> <span class="v" style="color:#fbbf24">${usd(u.cost)}</span></span>`
    } else { $('#a-cur-' + id).innerHTML = '<span style="color:#6b7280">no active session detected</span>' }
  }

  $('#a-refresh-' + id).addEventListener('click', load)
  load()
  pollLive()
  const liveTimer = setInterval(pollLive, 4000)
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'agi', stop: () => clearInterval(liveTimer) })
  return { id, leaf }
}

// Generic special-pane tab (no PTY): monitor / journal / cloud dashboards.
function newSpecialTab(makeFn, labelText, type, profile, activate) {
  if (activate == null) activate = true
  profile = profile || active.name
  const tabId = ++tabSeq
  const root = document.createElement('div')
  root.className = 'tab-root'; root.dataset.tab = String(tabId)
  document.getElementById('terms').appendChild(root)
  const btn = document.createElement('button')
  btn.className = 'term-tab'
  const label = document.createElement('span'); label.textContent = labelText
  const close = document.createElement('span'); close.className = 'close'; close.textContent = '×'
  close.onclick = ev => { ev.stopPropagation(); closeTab(tabId) }
  btn.append(label, close); btn.onclick = () => activateTab(tabId)
  document.getElementById('termtabs').insertBefore(btn, document.getElementById('newmon'))
  // LAZY: register the tab (cheap — a button + empty root) but do NOT call
  // makeFn yet. Each special tab's make* spawns an SSH-mux probe, a journal
  // read, or a docker query the instant it's built — building all of a
  // profile's default tabs up front serialized that network work for panes
  // the user hadn't even looked at yet. ensureTabBuilt() calls makeFn on
  // first activation instead, so only the tab actually shown pays that cost.
  // activate=false lets a bulk restore (restoreOrDefaultTabs) register all
  // of a profile's tabs as buttons without building/activating each one in
  // turn — only the profile's actual starting tab gets built.
  tabs.set(tabId, { root, btn, title: label, profile, type, cmd: '', makeFn, built: false })
  if (activate) activateTab(tabId)
  saveSession()
  return tabId
}

// Realize a special tab's pane on first activation (see newSpecialTab). A
// no-op for already-built tabs and for plain shell tabs (built eagerly since
// spawning a local pty is cheap, unlike SSH/journal/docker probes).
function ensureTabBuilt(id) {
  const t = tabs.get(id)
  if (!t || t.built || !t.makeFn) return
  t.built = true
  const made = t.makeFn(id)
  t.root.appendChild(made.leaf)
  focusPane(made.id)
}
function newMonitorTab(profile, activate) { return newSpecialTab(makeMonitor, '📊 monitor', 'monitor', profile, activate) }
function newJournalTab(profile, activate) { return newSpecialTab(makeJournal, '📜 journal', 'journal', profile, activate) }
function newCloudTab(profile, activate) { return newSpecialTab(makeCloud, '☁ cloud', 'cloud', profile, activate) }
function newDataSyncTab(profile, activate) { return newSpecialTab(makeDataSync, '🔄 data-sync', 'datasync', profile, activate) }
function newAGITab(profile, activate) { return newSpecialTab(makeAGI, '🤖 agi', 'agi', profile, activate) }
function newDevControlTab(profile, activate) { return newSpecialTab(makeDevControl, '🛠 devctl', 'devctl', profile, activate) }

function paneIdOf(leaf) { return parseInt(leaf.dataset.pane, 10) }

function focusPane(id) {
  const p = panes.get(id)
  if (!p) return
  activePane = id
  for (const q of panes.values()) q.leaf.classList.toggle('focused', q === p)
  if (p.kind === 'term') p.term.focus()
}

// ── Split the ACTIVE pane: dir 'row' = left/right, 'col' = top/bottom ──
function splitActive(dir) {
  const p = panes.get(activePane)
  if (!p) return
  const leaf = p.leaf
  const parent = leaf.parentElement
  const split = document.createElement('div')
  split.className = 'split ' + dir
  const div = document.createElement('div')
  div.className = 'divider'
  parent.replaceChild(split, leaf)          // put the split where the leaf was
  const made = makePane(p.tabId)
  split.append(leaf, div, made.leaf)         // [old, divider, new]
  attachDivider(div, dir)
  fitTab(p.tabId)
  focusPane(made.id)
}

// ── Close a pane; collapse its parent split; close tab if it was the last ──
function closePane(id) {
  const p = panes.get(id)
  if (!p) return
  if (p.stop) { try { p.stop() } catch (_) {} }   // special pane (monitor/journal): clear its timer
  else { invoke('pty_kill', { id }); try { p.term.dispose() } catch (_) {} }
  const leaf = p.leaf, parent = leaf.parentElement
  panes.delete(id)
  if (parent && parent.classList.contains('split')) {
    // sibling (the other non-divider child) takes the split's place
    const sib = [...parent.children].find(c => c !== leaf && !c.classList.contains('divider'))
    parent.parentElement.replaceChild(sib, parent)
    fitTab(p.tabId)
    // focus any surviving pane in this tab
    for (const [qid, q] of panes) if (q.tabId === p.tabId) { focusPane(qid); break }
  } else {
    closeTab(p.tabId)                          // leaf was the tab's whole content
  }
}

// ── Divider drag → resize the two adjacent nodes ──
function attachDivider(div, dir) {
  div.addEventListener('mousedown', e => {
    e.preventDefault()
    const prev = div.previousElementSibling, next = div.nextElementSibling
    const horiz = dir === 'row'
    const start = horiz ? e.clientX : e.clientY
    const ps = horiz ? prev.offsetWidth : prev.offsetHeight
    const ns = horiz ? next.offsetWidth : next.offsetHeight
    const move = ev => {
      const delta = (horiz ? ev.clientX : ev.clientY) - start
      const np = Math.max(48, ps + delta), nn = Math.max(48, ns - delta)
      prev.style.flex = '0 0 ' + np + 'px'
      next.style.flex = '0 0 ' + nn + 'px'
    }
    const up = () => {
      document.removeEventListener('mousemove', move)
      document.removeEventListener('mouseup', up)
      if (activeTab != null) fitTab(activeTab)
    }
    document.addEventListener('mousemove', move)
    document.addEventListener('mouseup', up)
  })
}

// ── Tabs ──
function setTabTitle(tabId, title) {
  const t = tabs.get(tabId); if (!t) return
  title = String(title).trim(); if (!title) return
  t.title.textContent = title.length > 22 ? title.slice(0, 21) + '…' : title
}
function newTab(profile, titleOverride) {
  profile = profile || active.name
  const tabId = ++tabSeq
  const root = document.createElement('div')
  root.className = 'tab-root'
  root.dataset.tab = String(tabId)
  document.getElementById('terms').appendChild(root)

  const btn = document.createElement('button')
  btn.className = 'term-tab'
  const label = document.createElement('span'); label.textContent = titleOverride || ('shell ' + tabId)
  const close = document.createElement('span'); close.className = 'close'; close.textContent = '×'
  close.onclick = ev => { ev.stopPropagation(); closeTab(tabId) }
  btn.append(label, close)
  btn.onclick = () => activateTab(tabId)
  document.getElementById('termtabs').insertBefore(btn, document.getElementById('newtab'))

  tabs.set(tabId, { root, btn, title: label, profile, type: 'shell', cmd: '' })
  const made = makePane(tabId)
  root.appendChild(made.leaf)
  activateTab(tabId)
  focusPane(made.id)
  saveSession()
  return tabId
}

// Show only the tabs belonging to `id`'s profile; skip cross-profile ones.
function activateTab(id) {
  const t = tabs.get(id); if (!t) return
  ensureTabBuilt(id)
  activeTab = id
  profileActiveTab[t.profile] = id
  for (const [tid, tt] of tabs) {
    const on = tid === id
    tt.root.classList.toggle('active', on)
    tt.btn.classList.toggle('active', on)
  }
  fitTab(id)
  for (const [pid, p] of panes) if (p.tabId === id) { focusPane(pid); break }
  saveSession()
}

function closeTab(id) {
  const t = tabs.get(id)
  if (!t) return
  const profile = t.profile
  for (const [pid, p] of [...panes]) if (p.tabId === id) { if (p.stop) { try { p.stop() } catch (_) {} } else { invoke('pty_kill', { id: pid }); try { p.term.dispose() } catch (_) {} } panes.delete(pid) }
  t.root.remove(); t.btn.remove()
  tabs.delete(id)
  if (activeTab === id) {
    // fall back to another tab OF THE SAME PROFILE — never borrow a tab from
    // a different profile pill.
    const next = [...tabs.entries()].find(([, tt]) => tt.profile === profile)
    if (next) activateTab(next[0]); else newTab(profile)
  }
  saveSession()
}

// ── Per-profile tab visibility (all pills share this window's DOM) ───────
// Hide every tab button/root not belonging to `name`; show the rest. Lazily
// builds that profile's tabs (from the saved session, else its data-driven
// default_tabs) the first time its pill is visited.
function switchProfileTabs(name) {
  for (const [, t] of tabs) {
    const on = t.profile === name
    t.btn.style.display = on ? '' : 'none'   // .tab-root's own .active class (CSS) hides the pane
    if (!on) t.root.classList.remove('active')
  }
  if (!initializedProfiles.has(name)) {
    initializedProfiles.add(name)
    restoreOrDefaultTabs(name)
    return
  }
  const want = profileActiveTab[name]
  const mine = [...tabs.entries()].filter(([, t]) => t.profile === name)
  if (want != null && tabs.has(want)) activateTab(want)
  else if (mine.length) activateTab(mine[0][0])
  else restoreOrDefaultTabs(name)   // profile had all its tabs closed — reseed defaults
  setTimeout(doFit, 30)
}

// Build a profile's tab set from the saved session if present, else its
// profile.default_tabs (same shapes init() already understood).
function restoreOrDefaultTabs(name) {
  const prof = allProfiles.find(p => p.name === name)
  const saved = sessionData[name]
  const spec = (saved && Array.isArray(saved.tabs) && saved.tabs.length) ? saved.tabs
    : (Array.isArray(prof && prof.default_tabs) ? prof.default_tabs : [{ type: 'shell', title: 'shell' }])
  let firstTab = null, wantActive = null
  const activeIdx = saved && typeof saved.active === 'number' ? saved.active : null
  spec.forEach((t, i) => {
    let tid
    if (t.type === 'monitor') tid = newMonitorTab(name, false)
    else if (t.type === 'journal') tid = newJournalTab(name, false)
    else if (t.type === 'cloud') tid = newCloudTab(name, false)
    else if (t.type === 'datasync') tid = newDataSyncTab(name, false)
    else if (t.type === 'agi') tid = newAGITab(name, false)
    else { tid = newTab(name, t.title); if (t.cmd) autoRun(t.cmd) }
    if (t.cmd) { const tt = tabs.get(tid); if (tt) tt.cmd = t.cmd }
    if (firstTab == null) firstTab = tid
    if (t.active || i === activeIdx) wantActive = tid
  })
  activateTab(wantActive != null ? wantActive : firstTab)
}

// ── Session persistence (~/.cloud-terminal/session.json) ─────────────────
// Debounced: any tab open/close/switch schedules a save ~500ms later so a
// burst of activity (opening several default tabs) writes once, not per-tab.
function saveSession() {
  if (!sessionReady) return
  clearTimeout(saveTimer)
  saveTimer = setTimeout(() => {
    const out = {}
    for (const p of allProfiles) {
      const mine = [...tabs.entries()].filter(([, t]) => t.profile === p.name)
      if (!mine.length) continue
      const activeIdx = mine.findIndex(([tid]) => tid === profileActiveTab[p.name])
      out[p.name] = {
        active: activeIdx >= 0 ? activeIdx : 0,
        tabs: mine.map(([, t]) => ({ type: t.type, title: t.title.textContent, cmd: t.cmd || '' })),
      }
    }
    invoke('session_save', { data: out }).catch(() => {})
  }, 500)
}

// ── Fit ── (only the visible/active tab has non-zero sized leaves)
function fitPane(id) {
  const p = panes.get(id); if (!p || p.kind !== 'term') return
  try { p.fit.fit() } catch (_) {}
  invoke('pty_resize', { id, cols: p.term.cols, rows: p.term.rows })
}
function fitTab(tabId) { for (const [id, p] of panes) if (p.tabId === tabId) fitPane(id) }
function doFit() { if (activeTab != null) fitTab(activeTab) }

// Per-pane font zoom. delta +1/-1 steps; 0 resets to the default 13. Re-fit so
// cols/rows (and the PTY size) track the new glyph size.
function setFont(id, delta) {
  const p = panes.get(id); if (!p) return
  const cur = p.term.options.fontSize || 13
  const next = delta === 0 ? 13 : Math.max(6, Math.min(40, cur + delta))
  p.term.options.fontSize = next
  fitPane(id)
}
window.addEventListener('resize', doFit)

function applyTheme(theme) {
  curTheme = theme || {}
  const r = document.documentElement.style
  if (theme.accent)  r.setProperty('--accent',  theme.accent)
  if (theme.accent2) r.setProperty('--accent2', theme.accent2)
  if (theme.bg)      r.setProperty('--bg',      theme.bg)
  for (const p of panes.values()) if (p.kind === 'term') p.term.options.theme = termTheme(theme)
}

function runItem(item) { invoke('run_item', { item }) }
function focusActivePaneTerm() { const p = panes.get(activePane); if (p && p.kind === 'term') p.term.focus() }

// ── command history (Last 5 / Most Used) — persisted in localStorage ──
function historyLoad() { try { return JSON.parse(localStorage.getItem('ct-history') || '[]') } catch (_) { return [] } }
function historySave(h) { try { localStorage.setItem('ct-history', JSON.stringify(h.slice(0, 200))) } catch (_) {} }
function recordHistory(item) {
  if (!item || !item.label) return
  const h = historyLoad(), e = h.find(x => x.key === item.label), now = Date.now()
  if (e) { e.count++; e.last = now } else h.push({ key: item.label, label: item.label, type: item.type, arg: item.arg || '', cmd: item.cmd || '', count: 1, last: now })
  historySave(h)
}
function historyItems(kind) {
  const h = historyLoad()
  return (kind === 'most' ? h.slice().sort((a, b) => b.count - a.count) : h.slice().sort((a, b) => b.last - a.last)).slice(0, 5)
}
// dispatch a sidebar/history item (dashboards open a pane; others run a command)
function openItem(item, profileName) {
  recordHistory(item)
  const dash = { monitor: newMonitorTab, journal: newJournalTab, cloud: newCloudTab, datasync: newDataSyncTab, agi: newAGITab }[item.type]
  if (dash) { dash() } else { runItem({ ...item, profile: profileName, ptyId: activePane }); focusActivePaneTerm() }
  if ((active.sections || []).some(s => s.dynamic)) buildSidebar(active)   // refresh Last/Most
}

function buildSidebar(profile) {
  const sb = document.getElementById('sidebar-list')
  sb.innerHTML = ''
  for (const section of (profile.sections || [])) {
    const grp = document.createElement('div'); grp.className = 'cmd-group'
    const t = document.createElement('div'); t.className = 'section-title'; t.textContent = section.title
    grp.appendChild(t)
    const items = section.dynamic ? historyItems(section.dynamic) : (section.items || [])
    if (section.dynamic && !items.length) {
      const e = document.createElement('div'); e.className = 'cmd-item'; e.style.color = '#4b5563'; e.style.cursor = 'default'
      e.textContent = '— none yet —'; grp.appendChild(e)
    }
    for (const item of items) {
      const btn = document.createElement('button')
      btn.className = 'cmd-item'; btn.textContent = item.label
      btn.dataset.search = ((item.label || '') + ' ' + (item.arg || '')).toLowerCase()
      btn.onclick = () => openItem(item, profile.name)
      grp.appendChild(btn)
    }
    const sep = document.createElement('div'); sep.className = 'sep-line'; grp.appendChild(sep)
    sb.appendChild(grp)
  }
  filterSidebar(document.getElementById('sidebar-search').value)
}

function filterSidebar(q) {
  q = (q || '').trim().toLowerCase()
  for (const grp of document.querySelectorAll('#sidebar-list .cmd-group')) {
    let shown = 0
    for (const btn of grp.querySelectorAll('.cmd-item')) {
      const hit = !q || btn.dataset.search.indexOf(q) !== -1
      btn.style.display = hit ? '' : 'none'
      if (hit) shown++
    }
    grp.style.display = shown ? '' : 'none'
  }
}

function buildProfileTabs() {
  const bar = document.getElementById('tabbar'); bar.innerHTML = ''
  for (const p of allProfiles) {
    const btn = document.createElement('button')
    btn.className = 'profile-pill' + (p.name === active.name ? ' active' : '')
    btn.textContent = (p.logo ? p.logo + ' ' : '') + p.display_name
    btn.onclick = () => { if (p.name !== active.name) showProfile(p) }
    bar.appendChild(btn)
  }
}

// Switching a pill only changes theme/sidebar/header — tab VISIBILITY is
// handled by switchProfileTabs (all pills share this one window's DOM, so
// each profile's tabs must be shown/hidden, not rebuilt).
function showProfile(p) {
  active = p
  applyTheme(p.theme || {})
  buildProfileTabs(); buildSidebar(p)
  document.getElementById('hdr-logo').textContent = p.logo || ''
  document.getElementById('hdr-name').textContent = p.display_name || ''
  document.title = 'Cloud Terminal — ' + (p.display_name || '')
  switchProfileTabs(p.name)
}

// ── boot ──
async function init() {
  const data = await invoke('get_init')
  allProfiles = data.profiles || [data]
  const label = data.name
  document.getElementById('hdr-host').textContent = '@ ' + (data.host || '')
  sessionData = await invoke('session_load').catch(() => null) || {}
  showProfile(allProfiles.find(p => p.name === data.name) || data)  // builds this profile's tabs via switchProfileTabs
  try {
    await Promise.all([
      listen('pty-data:' + label, e => { const [id, d] = e.payload; const p = panes.get(id); if (p) p.term.write(d) }),
      listen('pty-exit:' + label, e => { const id = e.payload; const p = panes.get(id); if (p) p.term.write('\r\n\x1b[33m[shell exited]\x1b[0m\r\n') }),
      listen('tray-run:' + label, e => runItem({ ...e.payload, ptyId: activePane })),
    ])
  } catch (err) { console.error('event listen failed:', err) }
  sessionReady = true
  setTimeout(doFit, 60)
}

// Type a command into the JUST-created tab's shell (for default "command"
// tabs). activePane is that tab's pane (newTab focuses it). Small delay so the
// login shell has drawn its prompt before we feed the line.
function autoRun(cmd) {
  const id = activePane
  setTimeout(() => { const p = panes.get(id); if (p && p.kind === 'term') invoke('pty_input', { id, d: cmd + '\r' }) }, 700)
}

// ── context menu ──
const ctx = document.getElementById('ctxmenu')
function showCtxMenu(x, y) {
  ctx.style.display = 'block'
  const w = ctx.offsetWidth, h = ctx.offsetHeight
  ctx.style.left = Math.min(x, window.innerWidth  - w - 4) + 'px'
  ctx.style.top  = Math.min(y, window.innerHeight - h - 4) + 'px'
}
function hideCtxMenu() { ctx.style.display = 'none' }
window.addEventListener('click', hideCtxMenu)
window.addEventListener('blur', hideCtxMenu)
ctx.addEventListener('click', e => {
  const it = e.target.closest('.ctx-item'); if (!it) return
  const p = panes.get(activePane)
  const isTerm = p && p.kind === 'term'
  switch (it.dataset.act) {
    case 'copy':      { if (isTerm) { const s = p.term.getSelection(); if (s) clip.write(s) } break }
    case 'paste':     if (isTerm) clip.read().then(x => { if (x) invoke('pty_input', { id: activePane, d: x }) }); break
    case 'selall':    if (isTerm) p.term.selectAll(); break
    case 'split-h':   splitActive('row'); break
    case 'split-v':   splitActive('col'); break
    case 'closepane': closePane(activePane); break
    case 'clear':     if (isTerm) p.term.clear(); break
    case 'newtab':    newTab(); break
  }
  hideCtxMenu(); focusActivePaneTerm()
})

document.getElementById('newtab').onclick        = () => newTab()
document.getElementById('newmon').onclick        = () => newMonitorTab()
document.getElementById('split-h').onclick      = () => splitActive('row')
document.getElementById('split-v').onclick      = () => splitActive('col')
document.getElementById('closepane-btn').onclick = () => closePane(activePane)
document.getElementById('clear-btn').onclick    = () => { const p = panes.get(activePane); if (p && p.kind === 'term') { p.term.clear(); p.term.focus() } }
document.getElementById('kill-btn').onclick     = () => { if (activePane != null) invoke('pty_input', { id: activePane, d: '\x03' }) }

const _search = document.getElementById('sidebar-search')
_search.addEventListener('input', () => filterSidebar(_search.value))
_search.addEventListener('keydown', e => { if (e.key === 'Escape') { _search.value = ''; filterSidebar('') } })

window.addEventListener('DOMContentLoaded', init)
</script>
</body>
