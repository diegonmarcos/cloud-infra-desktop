<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloud Terminal</title>
<!-- xterm shipped as static vendor assets (no bundler, no node require).
     build.sh copies these from node_modules into frontend/vendor/. -->
<link rel="stylesheet" href="vendor/xterm.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<style>
  :root {
    --accent:  #7b7fff;
    --accent2: #a78bfa;
    --bg:      #0e0f1a;
    --fg:      #e2e8f0;
    --sidebar: #13141f;
    --item-bg: #1a1b2e;
    --sep:     #2a2b3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px; background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  #tabbar {
    display: flex; align-items: center; gap: 4px; padding: 6px 10px 0;
    background: var(--sidebar); border-bottom: 1px solid var(--sep);
    flex-shrink: 0; overflow-x: auto;
  }
  #tabbar .profile-pill {
    padding: 5px 14px; border-radius: 6px 6px 0 0; cursor: pointer;
    font-size: 12px; color: #888; background: transparent; border: none;
    white-space: nowrap; transition: color .15s, background .15s;
  }
  #tabbar .profile-pill:hover  { color: var(--fg); background: var(--item-bg); }
  #tabbar .profile-pill.active { color: var(--accent); background: var(--bg); border-bottom: 2px solid var(--accent); }
  #header {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: var(--bg); border-bottom: 1px solid var(--sep); flex-shrink: 0;
  }
  #header .logo  { font-size: 18px; }
  #header .name  { font-weight: 600; color: var(--accent); }
  #header .host  { color: #6b7280; font-size: 11px; }
  #header .spacer { flex: 1; }
  #header button {
    padding: 4px 10px; background: var(--item-bg); color: var(--fg);
    border: 1px solid var(--sep); border-radius: 4px; cursor: pointer;
    font-family: inherit; font-size: 11px;
  }
  #header button:hover     { border-color: var(--accent); color: var(--accent); }
  #header #kill-btn:hover  { border-color: #f87171; color: #f87171; }
  #body { display: flex; flex: 1; overflow: hidden; }
  #sidebar {
    width: 230px; background: var(--sidebar); border-right: 1px solid var(--sep);
    flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-search {
    margin: 8px; padding: 6px 9px; flex-shrink: 0; background: var(--item-bg);
    color: var(--fg); border: 1px solid var(--sep); border-radius: 5px;
    font-family: inherit; font-size: 12px; outline: none;
  }
  #sidebar-search:focus { border-color: var(--accent); }
  #sidebar-list { flex: 1; overflow-y: auto; }
  #sidebar-list::-webkit-scrollbar { width: 4px; }
  #sidebar-list::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 2px; }
  .section-title {
    padding: 10px 12px 4px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent2); opacity: .85;
  }
  .cmd-item {
    display: block; text-align: left; padding: 7px 14px; background: none;
    border: none; color: var(--fg); cursor: pointer; font-family: inherit;
    font-size: 12px; border-radius: 4px; margin: 1px 4px;
    width: calc(100% - 8px); transition: background .1s, color .1s;
  }
  .cmd-item:hover  { background: var(--item-bg); color: var(--accent); }
  .cmd-item:active { background: var(--sep); }
  .sep-line { height: 1px; background: var(--sep); margin: 4px 10px; }
  #terminal-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #termtabs {
    display: flex; align-items: center; gap: 2px; padding: 4px 6px 0;
    background: var(--sidebar); border-bottom: 1px solid var(--sep);
    flex-shrink: 0; overflow-x: auto;
  }
  .term-tab {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 5px 5px 0 0; cursor: pointer; font-size: 11px; color: #888;
    background: transparent; border: none; white-space: nowrap;
  }
  .term-tab:hover  { background: var(--item-bg); color: var(--fg); }
  .term-tab.active { background: var(--bg); color: var(--accent); border-bottom: 2px solid var(--accent); }
  .term-tab .close { opacity: .5; font-size: 12px; }
  .term-tab .close:hover { opacity: 1; color: #f87171; }
  #newtab {
    padding: 4px 10px; border: none; background: transparent; color: var(--accent2);
    font-size: 15px; cursor: pointer; border-radius: 5px;
  }
  #newtab:hover { background: var(--item-bg); }

  /* ── Split panes (KDE-style) ─────────────────────────────────────── */
  #terms { position: relative; flex: 1; overflow: hidden; }
  .tab-root { position: absolute; inset: 0; display: none; }
  .tab-root.active { display: flex; }
  .split { display: flex; flex: 1 1 0; min-width: 0; min-height: 0; }
  .split.row { flex-direction: row; }
  .split.col { flex-direction: column; }
  .leaf {
    flex: 1 1 0; min-width: 48px; min-height: 40px; position: relative;
    padding: 4px 6px; overflow: hidden; border: 1px solid transparent;
  }
  .leaf.focused { border-color: var(--accent); }
  .leaf > .xterm { width: 100%; height: 100%; }
  .divider { flex: 0 0 6px; background: var(--sep); }
  .split.row > .divider { cursor: col-resize; }
  .split.col > .divider { cursor: row-resize; }
  .divider:hover { background: var(--accent); }

  /* ══ System monitor — btop-neon + glances-dense ════════════════════ */
  .leaf.monitor { padding: 0; overflow: hidden; background:
    radial-gradient(1200px 600px at 20% -10%, #15172b 0%, var(--bg) 60%); }
  .mon { padding: 8px; height: 100%; display: flex; flex-direction: column; gap: 8px;
    font-size: 11px; overflow-y: auto; overflow-x: hidden; }
  .mon::-webkit-scrollbar { width: 6px; } .mon::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 3px; }

  /* header — glances status line + live clock */
  .mon-head {
    flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 5px 18px; align-items: baseline;
    padding: 6px 14px; border-radius: 8px; color: #9aa4b2; font-size: 11px;
    background: linear-gradient(90deg, rgba(123,127,255,.10), rgba(167,139,250,.04));
    border: 1px solid var(--sep);
  }
  .mon-head b { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: .02em; }
  .mon-head .k { color: #6b7280; } .mon-head .val { color: #e2e8f0; font-variant-numeric: tabular-nums; }
  .mon-head .clock { margin-left: auto; color: var(--accent2); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .mon-row { display: grid; gap: 8px; flex-shrink: 0; }
  .mon-row.top  { grid-template-columns: 1.55fr 1fr; min-height: 210px; }
  .mon-row.trip { grid-template-columns: 1fr 1fr 1fr; min-height: 150px; }

  /* panel with btop bracket corners */
  .panel {
    background: rgba(19,20,31,.72); border: 1px solid var(--sep); border-radius: 8px;
    padding: 8px 10px 10px; display: flex; flex-direction: column;
    min-width: 0; min-height: 0; position: relative; overflow: hidden;
    box-shadow: inset 0 0 30px rgba(123,127,255,.04);
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 12px; height: 12px; pointer-events: none;
    border: 2px solid var(--accent); opacity: .55;
  }
  .panel::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; border-radius: 5px 0 0 0; }
  .panel::after  { bottom: 4px; right: 4px; border-left: 0; border-top: 0; border-radius: 0 0 5px 0; }
  .panel .ph {
    font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700;
    color: var(--accent); margin-bottom: 5px; flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .panel .ph .sub { color: #6b7280; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 10px; }
  .panel canvas.g { width: 100%; flex: 1 1 0; min-height: 30px; display: block; }

  /* CPU panel: PSI column · graph · circular gauge */
  .cpu-body { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 96px 1fr 96px; gap: 8px; }
  .cpu-psi { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
  .cpsi-row { display: flex; flex-direction: column; gap: 1px; }
  .cpsi-row .lbl { font-size: 8px; color: #6b7280; text-transform: uppercase; letter-spacing: .08em; }
  .cpsi-row .full { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .cpsi-row .track { height: 4px; background: var(--item-bg); border-radius: 2px; overflow: hidden; }
  .cpsi-row .track > i { display: block; height: 100%; border-radius: 2px; box-shadow: 0 0 5px currentColor; }
  .cpsi-row .some { font-size: 8px; color: #9aa4b2; font-variant-numeric: tabular-nums; }
  .swapst { font-size: 8px; margin-top: 3px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--sep); text-align: center; }
  .swapst.ok { color: #4ade80; } .swapst.warn { color: #fbbf24; } .swapst.crit { color: #f87171; border-color: #f87171; }
  /* PSI-clean bar under the Processes toolbar */
  .psi-clean { display: flex; gap: 6px; flex-shrink: 0; padding: 4px 8px 2px; flex-wrap: wrap; }
  .psi-clean button { font: inherit; font-size: 9px; padding: 3px 9px; border-radius: 5px; cursor: pointer;
    background: var(--item-bg); color: #9aa4b2; border: 1px solid var(--sep); white-space: nowrap; }
  .psi-clean button:hover { color: #f87171; border-color: #f87171; }
  .psi-clean button.all { margin-left: auto; color: var(--accent2); }
  .psi-clean button.all:hover { color: #fbbf24; border-color: #fbbf24; }
  .psi-clean button.busy { color: #fbbf24; border-color: #fbbf24; }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .gauge-wrap canvas { width: 92px; height: 92px; }
  .gauge-wrap .glbl { font-size: 9px; color: #6b7280; text-transform: uppercase; letter-spacing: .1em; }

  /* MEM panel: stacked segment bar + gauges */
  .mem-body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .seg { height: 20px; border-radius: 5px; overflow: hidden; display: flex; background: var(--item-bg); border: 1px solid var(--sep); }
  .seg > span { height: 100%; transition: width .3s ease; }
  .seg-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 10px; color: #9aa4b2; }
  .seg-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .mem-gauges { display: flex; gap: 10px; justify-content: space-around; flex: 1 1 0; min-height: 0; align-items: center; }

  /* per-core sparkline grid — each core its OWN mini graph (btop signature) */
  .panel.cores-panel { min-height: 132px; }
  .cores { flex: 1 1 0; min-height: 0; display: grid; gap: 5px;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); grid-auto-rows: 1fr; }
  .core { background: var(--item-bg); border-radius: 4px; padding: 2px 4px; display: flex; flex-direction: column;
    min-height: 30px; overflow: hidden; border: 1px solid var(--sep); }
  .core .ct { display: flex; justify-content: space-between; font-size: 9px; color: #9aa4b2; flex-shrink: 0; }
  .core .ct .p { font-variant-numeric: tabular-nums; color: #cbd5e1; }
  .core canvas { width: 100%; flex: 1 1 0; min-height: 10px; display: block; }

  /* gradient meter bars (disks, temps, net ifaces) */
  .bars { display: flex; flex-direction: column; gap: 4px; flex: 1 1 0; min-height: 0; overflow-y: auto; }
  .bars::-webkit-scrollbar { width: 5px; } .bars::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 3px; }
  .bar { font-size: 10px; }
  .bar .lbl { display: flex; justify-content: space-between; gap: 6px; color: #9aa4b2; }
  .bar .lbl .r { color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .bar .track { height: 9px; background: var(--item-bg); border-radius: 4px; overflow: hidden; margin-top: 1px; border: 1px solid var(--sep); }
  .bar .track > i { display: block; height: 100%; border-radius: 4px; box-shadow: 0 0 8px currentColor; }

  /* net panel: split up/down glow graphs + iface table */
  .netgraphs { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
  .netgraphs .ng { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .netgraphs .ng .cap { font-size: 9px; flex-shrink: 0; display: flex; justify-content: space-between; }
  .netgraphs .ng .cap .dn { color: #22d3ee; } .netgraphs .ng .cap .up { color: #e879f9; }
  .netgraphs .ng .cap .rate { color: #cbd5e1; font-variant-numeric: tabular-nums; }

  /* process table — glances. flex-grow so it fills the space under it. */
  .panel.proc { min-height: 230px; flex: 1 0 auto; }
  .ptbl-wrap { flex: 1 1 0; min-height: 0; overflow-y: auto; }
  .ptbl-wrap::-webkit-scrollbar { width: 6px; } .ptbl-wrap::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 3px; }
  .ptbl { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ptbl th { text-align: left; color: #6b7280; font-weight: 600; padding: 3px 7px; position: sticky; top: 0;
    background: #13141f; z-index: 1; text-transform: uppercase; font-size: 9px; letter-spacing: .06em; border-bottom: 1px solid var(--sep); }
  .ptbl th.num, .ptbl td.num { text-align: right; }
  .ptbl td { padding: 2px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptbl tbody tr:nth-child(odd) td { background: rgba(255,255,255,.015); }
  .ptbl tbody tr:hover td { background: rgba(123,127,255,.10); }
  .ptbl td.n { color: #cbd5e1; max-width: 240px; }
  .ptbl td.hier { max-width: 0; width: 99%; }
  .ptbl td.u { color: #7dd3fc; } .ptbl td.st { color: #6b7280; }
  .ptbl td.num { color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .ptbl td.hot { color: #f87171; font-weight: 700; text-shadow: 0 0 6px rgba(248,113,113,.5); }
  .ptbl td.warm { color: #fbbf24; }
  .ptbl-tabs { display: flex; gap: 4px; }
  .ptbl-tabs button { font: inherit; font-size: 9px; padding: 2px 9px; border-radius: 5px; cursor: pointer;
    background: var(--item-bg); color: #9aa4b2; border: 1px solid var(--sep); }
  .ptbl-tabs button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 700; }

  /* per-core VERTICAL bars (btop equalizer): fill rises from the bottom */
  .panel.cores-panel { min-height: 150px; }
  .cores { flex: 1 1 0; min-height: 0; display: flex; align-items: stretch; gap: 4px;
    overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
  .cores::-webkit-scrollbar { height: 5px; } .cores::-webkit-scrollbar-thumb { background: var(--sep); border-radius: 3px; }
  .vcore { flex: 1 1 0; min-width: 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .vcore .vpct { font-size: 8px; color: #cbd5e1; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .vcore .vtrack { flex: 1 1 0; width: 100%; min-height: 20px; background: var(--item-bg); border: 1px solid var(--sep);
    border-radius: 3px; overflow: hidden; display: flex; align-items: flex-end; }
  .vcore .vtrack > i { display: block; width: 100%; border-radius: 0 0 2px 2px; box-shadow: 0 0 8px currentColor; transition: height .3s ease; }
  .vcore .vlbl { font-size: 8px; color: #6b7280; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  /* key/value data blocks (memory full breakdown, battery) */
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 10px; align-content: start; overflow-y: auto; flex: 1 1 0; min-height: 0; }
  .kv .k { color: #6b7280; } .kv .v { color: #cbd5e1; text-align: right; font-variant-numeric: tabular-nums; }
  .kv .v.hi { color: var(--accent2); } .kv .sec { grid-column: 1/3; color: var(--accent); font-size: 9px;
    text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; border-bottom: 1px solid var(--sep); padding-bottom: 1px; }

  /* PSI panel: 3 resources, each a time graph (0–30% ceiling) + avg numbers */
  .psi { display: flex; flex-direction: column; gap: 5px; flex: 1 1 0; min-height: 0; }
  .psi-g { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .psi-gh { display: flex; justify-content: space-between; align-items: baseline; font-size: 9px; flex-shrink: 0; }
  .psi-gh .pl { color: var(--accent2); text-transform: uppercase; letter-spacing: .06em; }
  .psi-avgs { color: #6b7280; font-variant-numeric: tabular-nums; } .psi-avgs b { color: #cbd5e1; }
  .psi-g canvas { flex: 1 1 0; min-height: 14px; width: 100%; display: block; }

  /* battery panel */
  .batt { flex: 1 1 0; min-height: 0; display: flex; gap: 10px; align-items: center; }
  .batt .bg { flex-shrink: 0; }
  .batt .bg canvas { width: 84px; height: 84px; }
  .batt .bi { font-size: 10px; color: #9aa4b2; display: flex; flex-direction: column; gap: 2px; }
  .batt .bi b { color: #e2e8f0; font-size: 12px; }
  .batt .bi .flow.in { color: #4ade80; } .batt .bi .flow.out { color: #fbbf24; }

  /* network per-interface table */
  .ntbl { width: 100%; border-collapse: collapse; font-size: 10px; flex: 1 1 0; min-height: 0; display: block; overflow: auto; }
  .ntbl th { text-align: left; color: #6b7280; font-weight: 600; padding: 2px 5px; text-transform: uppercase; font-size: 8px; letter-spacing: .05em; }
  .ntbl td { padding: 1px 5px; white-space: nowrap; }
  .ntbl td.if { color: var(--accent2); font-weight: 600; } .ntbl td.ip { color: #7dd3fc; }
  .ntbl td.num { text-align: right; color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .ntbl td.dn { color: #22d3ee; } .ntbl td.up { color: #e879f9; } .ntbl td.err { color: #f87171; }

  /* process toolbar: sort + view-mode toggles + copy */
  .proc-tools { display: flex; gap: 8px; align-items: center; }
  .cpbtn { font: inherit; font-size: 9px; padding: 2px 9px; border-radius: 5px; cursor: pointer;
    background: var(--item-bg); color: #9aa4b2; border: 1px solid var(--sep); }
  .cpbtn:hover { color: var(--accent); border-color: var(--accent); }
  .mbtn { font: inherit; font-size: 9px; padding: 2px 9px; border-radius: 5px; cursor: pointer;
    background: var(--item-bg); color: #9aa4b2; border: 1px solid var(--sep); white-space: nowrap; }
  .mbtn:hover { color: #fbbf24; border-color: #fbbf24; }
  .mbtn.arm { color: #f87171; border-color: #f87171; font-weight: 600; }
  .proc-tbl td.n { cursor: pointer; }
  .proc-tbl td.hier { color: #8b93a7; font-size: 10px; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .proc-tbl td.n .tw { color: #4b5563; }         /* tree branch glyphs */
  .proc-tbl tr.prow.open td { background: rgba(123,127,255,.12); }
  .pdetail td { padding: 0 !important; }
  .pd { padding: 7px 12px; background: #0c0d16; border-left: 2px solid var(--accent); display: flex; flex-direction: column; gap: 5px; }
  .pd .cmd { color: #e2e8f0; font-size: 11px; white-space: pre-wrap; word-break: break-all; user-select: text; }
  .pd .pdmeta { color: #6b7280; font-size: 10px; }
  .pd .pdrow { font-size: 10px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
  .pd .pdrow .k { color: #6b7280; margin-right: 6px; text-transform: uppercase; font-size: 9px; letter-spacing: .05em; }
  .pd .pdkv { display: grid; grid-template-columns: repeat(3, auto 1fr); gap: 2px 8px; font-size: 10px; }
  .pd .pdkv .k { color: #6b7280; } .pd .pdkv .v { color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .pd .pdkv .v.hot { color: #f87171; font-weight: 600; } .pd .pdkv .v.warm { color: #fbbf24; }
  .pd .pdbtns { display: flex; gap: 6px; margin-top: 2px; }
  .pd .pdbtns button { font: inherit; font-size: 10px; padding: 3px 11px; border-radius: 5px; cursor: pointer;
    background: var(--item-bg); color: #cbd5e1; border: 1px solid var(--sep); }
  .pd .pdbtns button:hover { border-color: var(--accent); color: var(--accent); }
  .pd .pdbtns button.warn:hover { border-color: #fbbf24; color: #fbbf24; }
  .pd .pdbtns button.crit:hover { border-color: #f87171; color: #f87171; }

  /* ══ Journal Logs dashboard ════════════════════════════════════════ */
  .leaf.journal { padding: 0; overflow: hidden; background:
    radial-gradient(1200px 600px at 20% -10%, #15172b 0%, var(--bg) 60%); }
  .jrn { padding: 8px; height: 100%; display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
  .jrn-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; flex-shrink: 0; }
  .jstat { background: rgba(19,20,31,.72); border: 1px solid var(--sep); border-radius: 8px; padding: 7px 10px;
    display: flex; flex-direction: column; gap: 1px; }
  .jstat .n { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e2e8f0; line-height: 1.1; }
  .jstat .l { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; }
  .jstat.err .n { color: #f87171; } .jstat.warn .n { color: #fbbf24; } .jstat.info .n { color: var(--accent2); }
  .jrn-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--item-bg);
    border: 1px solid var(--sep); flex-shrink: 0; }

<script>
window.addEventListener('error', e => {
  const d = document.createElement('div')

  const msg = 'JS ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + (e.error && e.error.stack ? '\n' + e.error.stack : '')
  d.textContent = msg
  document.body.appendChild(d)
  document.title = 'ERR: ' + msg.slice(0, 200)
})
window.addEventListener('unhandledrejection', e => {
  const d = document.createElement('div')
  d.style.cssText = 'position:fixed;top:40px;left:0;z-index:99999;background:orange;color:black;font:12px monospace;padding:8px;max-width:100vw;white-space:pre-wrap'
  d.textContent = 'PROMISE REJECTION: ' + (e.reason && e.reason.stack || e.reason)
  document.body.appendChild(d)
})
</script>

<script>
// ── Tauri IPC ──
// DEV CONTROL instrumentation: every invoke() call (SSH probes, docker
// stats, journal reads, process scans — everything a dashboard does) is
// timed and recorded into a rolling buffer so the DEV CONTROL tab can show
// exactly what's slow, how often it's called, and from which pane — instead
// of guessing which of 5 heavy dashboards is thrashing the UX. Near-zero
// overhead: one Date.now() before/after and a ring-buffer push, no
// allocation-heavy tracing.
const _rawInvoke = window.__TAURI__.core.invoke
const DEVCTL_MAX = 500
const devctlLog = []          // ring buffer: {cmd, args, ms, at, ok}
const devctlListeners = new Set()
function devctlPush(entry) {
  devctlLog.push(entry)
  if (devctlLog.length > DEVCTL_MAX) devctlLog.shift()
  for (const fn of devctlListeners) { try { fn(entry) } catch (_) {} }
}
const invoke = (cmd, args) => {
  const t0 = Date.now()
  return _rawInvoke(cmd, args).then(
    r => { devctlPush({ cmd, args, ms: Date.now() - t0, at: t0, ok: true }); return r },
    e => { devctlPush({ cmd, args, ms: Date.now() - t0, at: t0, ok: false, err: String(e) }); throw e }
  )
}
const listen = window.__TAURI__.event.listen
const Terminal = window.Terminal
const FitAddon = window.FitAddon.FitAddon
const clip = {
  write: (t) => { try { navigator.clipboard.writeText(t) } catch (_) {} },
  read:  ()  => navigator.clipboard.readText().catch(() => ''),
}

let allProfiles = []
let active = null
let curTheme = {}

// ── Model ──
// panes: ptyId → { term, fit, leaf(DOM), tabId }.  Each leaf is one PTY.
// tabs:  tabId → { root(DOM), btn, title, profile, type, cmd }. A tab holds a
//        binary split tree of .leaf / .split.row / .split.col nodes
//        (KDE-style splits). `profile` scopes the tab to ONE profile pill —
//        all profile pills share this window's DOM, so tabs are shown/hidden
//        by profile rather than living in separate documents.
const panes = new Map()
const tabs  = new Map()
let paneSeq = 0
let tabSeq  = 0
let activeTab = null
let activePane = null
const profileActiveTab = {}     // profile name -> last-active tabId (restored on pill switch)
const initializedProfiles = new Set()
let sessionData = {}            // loaded once at boot: { [profile]: { tabs:[{type,title,cmd,arg}], active } }
let sessionReady = false        // don't save() until the initial load+restore finished
let saveTimer = null

function termTheme(theme) {
  return { background: theme.bg || '#0e0f1a', foreground: '#e2e8f0', cursor: theme.accent || '#7b7fff' }
}

// ── Pane (leaf = one terminal + PTY) ──
function makePane(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf'
  leaf.dataset.pane = String(id)

  const term = new Terminal({
    fontFamily: "'JetBrains Mono','Fira Code',monospace",
    fontSize: 13, cursorBlink: true, scrollback: 10000, theme: termTheme(curTheme),
  })
  const fit = new FitAddon()
  term.loadAddon(fit)
  term.open(leaf)

  term.attachCustomKeyEventHandler(e => {
    if (e.type !== 'keydown') return true
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyC') { const s = term.getSelection(); if (s) clip.write(s); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyV') { clip.read().then(t => { if (t) invoke('pty_input', { id, d: t }) }); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyE') { splitActive('row'); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') { splitActive('col'); return false }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyW') { closePane(activePane); return false }
    // Font zoom for THIS pane: Ctrl+= / Ctrl++ in, Ctrl+- out, Ctrl+0 reset.
    if (e.ctrlKey && !e.shiftKey && (e.code === 'Equal' || e.code === 'NumpadAdd'))      { setFont(id, +1); return false }
    if (e.ctrlKey &&  e.shiftKey &&  e.code === 'Equal')                                 { setFont(id, +1); return false }
    if (e.ctrlKey && (e.code === 'Minus' || e.code === 'NumpadSubtract'))                { setFont(id, -1); return false }
    if (e.ctrlKey && (e.code === 'Digit0' || e.code === 'Numpad0'))                      { setFont(id,  0); return false }
    return true
  })
  term.onData(d => invoke('pty_input', { id, d }))
  // Rename the tab to the shell's title (fish sets it to the running command /
  // cwd via the OSC title escape). Reflects the last command run in the tab.
  term.onTitleChange(t => { if (t) setTabTitle(tabId, t) })
  // focus-follows-click; capture so it fires before xterm handles it
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  leaf.addEventListener('contextmenu', e => { e.preventDefault(); focusPane(id); showCtxMenu(e.clientX, e.clientY) })

  panes.set(id, { term, fit, leaf, tabId, kind: 'term' })
  invoke('pty_start', { id, cols: term.cols || 80, rows: term.rows || 24 })
  return { id, leaf }
}

// ══ System-monitor pane (no PTY): a btop-neon + glances clone ═════════
// Visuals: neon-glow area graphs (green base → yellow → red peaks), per-core
// sparklines (each core its own mini graph), circular gauges for CPU/RAM/Swap,
// a stacked memory-segment bar. Data (glances-dense): host/os/kernel/uptime +
// clock, CPU model/freq/load, mem breakdown (used/cached/buffers/free/swap),
// disk I/O read/write, per-iface net rates + totals, temps, filesystems, and a
// full process table (PID/USER/CPU%/MEM%/TIME+/CMD) sortable by CPU or MEM.
const MON_HIST = 200
function fmtBytes(n) {
  if (n < 1024) return n + ' B'
  const u = ['K', 'M', 'G', 'T', 'P']; let i = -1
  do { n /= 1024; i++ } while (n >= 1024 && i < u.length - 1)
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i] + 'B'
}
function fmtRate(n) { return fmtBytes(n) + '/s' }
function fmtUptime(sec) {
  sec = Math.floor(sec || 0)
  const d = Math.floor(sec / 86400); sec %= 86400
  const h = Math.floor(sec / 3600); sec %= 3600
  const m = Math.floor(sec / 60)
  const p = x => String(x).padStart(2, '0')
  return (d ? d + 'd ' : '') + p(h) + ':' + p(m)
}
function fmtTimeplus(sec) {           // glances TIME+ : Hh:MM:SS
  sec = Math.floor(sec || 0)
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60
  const p = x => String(x).padStart(2, '0')
  return (h ? h + ':' : '') + p(m) + ':' + p(ss)
}
// green→yellow→red by fraction (0..1). btop meter colouring.
function heat(p) { p = Math.max(0, Math.min(1, p)); return `hsl(${(130 * (1 - p)).toFixed(0)}deg 70% 55%)` }
function setCanvas(cv) {
  const dpr = window.devicePixelRatio || 1
  const w = cv.clientWidth, h = cv.clientHeight
  if (w < 2 || h < 2) return null
  cv.width = w * dpr; cv.height = h * dpr
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h)
  return { g, w, h }
}
// btop area graph with neon glow. hue: single-hue (net); else heat gradient.
function drawGraph(cv, data, maxHint, hue, hard) {
  const c = setCanvas(cv); if (!c) return
  const { g, w, h } = c
  const n = data.length; if (n < 2) return
  // hard: use maxHint as a fixed ceiling (values above clip at the top);
  // otherwise auto-scale to the data. PSI uses a fixed 0–30% ceiling.
  const max = hard ? Math.max(maxHint, 1e-6) : Math.max(maxHint || 1, ...data, 1e-6)
  const dx = w / (MON_HIST - 1)
  const y = v => h - (v / max) * h
  const x0 = w - (n - 1) * dx
  // faint baseline grid
  g.strokeStyle = 'rgba(255,255,255,.04)'; g.lineWidth = 1
  for (let q = 1; q < 4; q++) { const yy = h * q / 4; g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke() }
  g.beginPath(); g.moveTo(x0, h)
  for (let i = 0; i < n; i++) g.lineTo(x0 + i * dx, y(data[i]))
  g.lineTo(x0 + (n - 1) * dx, h); g.closePath()
  const grad = g.createLinearGradient(0, 0, 0, h)
  if (hue != null) {
    grad.addColorStop(0, `hsla(${hue},85%,62%,.6)`); grad.addColorStop(1, `hsla(${hue},85%,55%,.03)`)
  } else {
    grad.addColorStop(0, 'hsla(0,75%,58%,.6)'); grad.addColorStop(.38, 'hsla(45,80%,56%,.4)')
    grad.addColorStop(.72, 'hsla(130,64%,50%,.2)'); grad.addColorStop(1, 'hsla(130,64%,50%,.03)')
  }
  g.fillStyle = grad; g.fill()
  // glowing stroke
  g.beginPath()
  for (let i = 0; i < n; i++) { const px = x0 + i * dx, py = y(data[i]); i ? g.lineTo(px, py) : g.moveTo(px, py) }
  const col = hue != null ? `hsl(${hue},90%,64%)` : heat(data[n - 1] / max)
  g.lineWidth = 1.6; g.strokeStyle = col; g.shadowBlur = 9; g.shadowColor = col; g.stroke(); g.shadowBlur = 0
}
// tiny per-core sparkline
function drawSpark(cv, data) {
  const c = setCanvas(cv); if (!c) return
  const { g, w, h } = c
  const n = data.length; if (n < 2) return
  const dx = w / (MON_HIST - 1), y = v => h - (v / 100) * h, x0 = w - (n - 1) * dx
  g.beginPath(); g.moveTo(x0, h)
  for (let i = 0; i < n; i++) g.lineTo(x0 + i * dx, y(data[i]))
  g.lineTo(x0 + (n - 1) * dx, h); g.closePath()
  const col = heat(data[n - 1] / 100)
  g.fillStyle = col.replace('hsl', 'hsla').replace(')', ',.22)'); g.fill()
  g.beginPath()
  for (let i = 0; i < n; i++) { const px = x0 + i * dx, py = y(data[i]); i ? g.lineTo(px, py) : g.moveTo(px, py) }
  g.lineWidth = 1.2; g.strokeStyle = col; g.stroke()
}
// circular gauge: track + value arc (heat) + centered % and label.
function drawGauge(cv, pct, label) {
  const c = setCanvas(cv); if (!c) return
  const { g, w, h } = c
  const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 7
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25
  pct = Math.max(0, Math.min(100, pct || 0))
  g.lineWidth = 7; g.lineCap = 'round'
  g.strokeStyle = 'rgba(255,255,255,.08)'
  g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke()
  const col = heat(pct / 100)
  g.strokeStyle = col; g.shadowBlur = 10; g.shadowColor = col
  g.beginPath(); g.arc(cx, cy, r, a0, a0 + (a1 - a0) * pct / 100); g.stroke(); g.shadowBlur = 0
  g.fillStyle = '#e2e8f0'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.font = '700 ' + Math.round(r * 0.55) + 'px monospace'
  g.fillText(Math.round(pct) + '%', cx, cy - 2)
  if (label) { g.fillStyle = '#6b7280'; g.font = '9px monospace'; g.fillText(label, cx, cy + r * 0.55) }
}
function bar(lbl, pct, right, col) {
  pct = Math.max(0, Math.min(100, pct || 0))
  const c = col || heat(pct / 100)
  return `<div class="bar"><div class="lbl"><span>${lbl}</span><span class="r">${right}</span></div>` +
    `<div class="track"><i style="width:${pct.toFixed(1)}%;background:${c};color:${c}"></i></div></div>`
}

  })

  const poll = async () => {
    let s; try { s = await invoke('sys_stats') } catch (_) { return }
    if (!leaf.isConnected) return
    const clock = new Date().toLocaleTimeString('en-GB')

    // ── header ──
    const psiC = ((s.psi || {}).cpu || {}).some || {}
    $('#m-head-' + id).innerHTML =
      `<span><b>${esc(s.host || '')}</b></span>` +
      `<span><span class="k">os</span> <span class="val">${esc(s.os || '')}</span></span>` +
      `<span><span class="k">kernel</span> <span class="val">${esc(s.kernel || '')}</span></span>` +
      `<span><span class="k">up</span> <span class="val">${fmtUptime(s.uptime)}</span></span>` +
      `<span><span class="k">tasks</span> <span class="val">${s.running || 0} run · ${s.nproc || 0} total</span></span>` +
      `<span class="clock">${clock}</span>`

    // ── CPU + gauge ──
    push(hist.cpu, s.cpu)
    drawGraph($('#m-cpu-' + id), hist.cpu, 100)
    drawGauge($('#m-cpugauge-' + id), s.cpu, 'CPU')
    const ghz = s.cpu_freq ? (s.cpu_freq / 1000).toFixed(2) + 'GHz' : ''
    $('#m-cpusub-' + id).textContent = `${(s.cpu_name || '').slice(0, 40)} · ${s.pcpu || s.ncpu}c/${s.ncpu}t · ${ghz} · PSI ${(psiC.avg10 || 0).toFixed(1)}%`
    $('#m-cpuload-' + id).textContent = 'load ' + (s.load || []).map(x => x.toFixed(2)).join(' ')

    // CPU-box PSI: FULL 10s (big) + SOME 10s (small), bar scaled so 30% = full.
    // Numbers are the absolute avg10 %. cpu has no "full" → falls back to some.
    const psiAll = s.psi || {}
    const cpsi = (k, o) => {
      o = o || {}
      const full = (o.full && o.full.avg10 != null) ? o.full.avg10 : ((o.some && o.some.avg10) || 0)
      const some = (o.some && o.some.avg10) || 0
      const col = heat(Math.min(1, full / 30))
      return `<div class="cpsi-row"><div class="lbl">${k}</div>` +
        `<div class="full" style="color:${col}">${full.toFixed(1)}<span style="font-size:8px;color:#6b7280"> full</span></div>` +
        `<div class="track"><i style="width:${Math.min(100, full / 30 * 100).toFixed(0)}%;background:${col};color:${col}"></i></div>` +
        `<div class="some">some ${some.toFixed(1)}%</div></div>`
    }
    $('#m-cpupsi-' + id).innerHTML = cpsi('CPU', psiAll.cpu) + cpsi('IO', psiAll.io) + cpsi('MEM', psiAll.memory)
    // swapping status: swap growing (or high mem pressure) → swapping now.
    const swU = (s.mem || {}).swap_used || 0, swT = (s.mem || {}).swap_total || 0
    const memFull = (((psiAll.memory || {}).full || {}).avg10) || 0
    let swCls = 'ok', swTxt = 'no swap'
    if (swT) {
      if ((prevSwap != null && swU > prevSwap + 1048576) || memFull > 5) { swCls = 'crit'; swTxt = '⚠ swapping' }
      else if (swU > 0) { swCls = 'warn'; swTxt = 'swap ' + fmtBytes(swU) }
      else { swCls = 'ok'; swTxt = 'swap idle' }
    }
    prevSwap = swU
    const swEl = $('#m-swapst-' + id); if (swEl) { swEl.className = 'swapst ' + swCls; swEl.textContent = swTxt }

    // ── CPU cores: vertical bars (fill rises from bottom) ──
    const cores = s.cores || [], freqs = s.cores_freq || []
    if ($('#m-cores-' + id).childElementCount !== cores.length) {
      $('#m-cores-' + id).innerHTML = cores.map((_, i) =>
        `<div class="vcore" id="m-cv-${id}-${i}"><span class="vpct" id="m-cp-${id}-${i}"></span>` +
        `<div class="vtrack"><i id="m-cbar-${id}-${i}"></i></div><span class="vlbl">${i}</span></div>`).join('')
    }
    $('#m-coresub-' + id).textContent = cores.length + ' threads'
    cores.forEach((c, i) => {
      const col = heat(c / 100)
      const ib = $('#m-cbar-' + id + '-' + i); if (ib) { ib.style.height = Math.min(100, c) + '%'; ib.style.background = col; ib.style.color = col }
      $('#m-cp-' + id + '-' + i).textContent = c.toFixed(0)
      const cell = $('#m-cv-' + id + '-' + i); if (cell) cell.title = `CPU${i} · ${c.toFixed(0)}%` + (freqs[i] ? ` · ${(freqs[i] / 1000).toFixed(2)} GHz` : '')
    })

    // ── MEM: segment + gauges + full breakdown ──
    const m = s.mem, total = m.total || 1
    const buffers = m.buffers || 0, cached = m.cached || 0, used = m.used, free = m.free || 0
    const mp = used / total * 100
    push(hist.mem, mp)
    $('#m-memsub-' + id).textContent = fmtBytes(used) + ' / ' + fmtBytes(total)
    const seg = [
      ['used', used, 'hsl(0,72%,56%)'], ['cache', cached, 'hsl(190,72%,55%)'],
      ['buffers', buffers, 'hsl(45,80%,55%)'], ['free', Math.max(0, total - used - cached - buffers), 'hsl(150,30%,32%)'],
    ]
    $('#m-seg-' + id).innerHTML = seg.map(([, v, c]) => `<span style="width:${(v / total * 100).toFixed(2)}%;background:${c}"></span>`).join('')
    $('#m-seglegend-' + id).innerHTML = seg.map(([l, v, c]) => `<span><i style="background:${c}"></i>${l} ${fmtBytes(v)}</span>`).join('')
    drawGauge($('#m-ramg-' + id), mp, 'RAM')
    drawGauge($('#m-swapg-' + id), m.swap_total ? m.swap_used / m.swap_total * 100 : 0, 'SWAP')
    const kv = (k, v, hi) => `<span class="k">${k}</span><span class="v${hi ? ' hi' : ''}">${v}</span>`
    const zr = s.zram || []
    let zkv = ''
    if (zr.length) {
      const zOrig = zr.reduce((a, z) => a + (z.orig || 0), 0)
      const zUsed = zr.reduce((a, z) => a + (z.used || 0), 0)          // RAM actually consumed
      const zRatio = zUsed ? zOrig / zUsed : (zr[0].ratio || 0)
      zkv = `<span class="sec">ZRAM (compressed swap in RAM)</span>` +
        kv('stored', fmtBytes(zOrig), 1) + kv('in RAM', fmtBytes(zUsed)) +
        kv('ratio', '×' + zRatio.toFixed(2)) + kv('saved', fmtBytes(Math.max(0, zOrig - zUsed)))
    }
    $('#m-memkv-' + id).innerHTML =
      `<span class="sec">RAM</span>` +
      kv('total', fmtBytes(total), 1) + kv('used', fmtBytes(used)) + kv('available', fmtBytes(m.avail || 0)) +
      kv('cached', fmtBytes(cached)) + kv('buffers', fmtBytes(buffers)) + kv('free', fmtBytes(free)) +
      `<span class="sec">SWAP</span>` +
      kv('total', fmtBytes(m.swap_total || 0), 1) + kv('used', fmtBytes(m.swap_used || 0)) +
      kv('free', fmtBytes((m.swap_total || 0) - (m.swap_used || 0))) +
      zkv

    // ── PSI panel: per-resource time graphs (fixed 0–30% ceiling, so 30%
    // stall fills the graph) with absolute avg10/avg60/avg300 numbers. ──
    const psi = s.psi || {}
    const PSI_MAX = 30
    for (const [k, key, hue] of [['cpu', 'cpu', 45], ['io', 'io', 190], ['mem', 'memory', 300]]) {
      const some = (psi[key] || {}).some || {}
      push(psiHist[k], some.avg10 || 0)
      drawGraph($('#m-psic-' + k + '-' + id), psiHist[k], PSI_MAX, hue, true)
      $('#m-psia-' + k + '-' + id).innerHTML =
        `10s <b>${(some.avg10 || 0).toFixed(1)}%</b> · 1m ${(some.avg60 || 0).toFixed(1)}% · 5m ${(some.avg300 || 0).toFixed(1)}%`
    }

    // ── SWAP · ZRAM breakdown ──
    const swaps = s.swaps || [], zram = s.zram || []
    let sk = ''
    if (swaps.length) { sk += `<span class="sec">SWAP DEVICES</span>`; for (const w of swaps) sk += kv(esc((w.name || '').split('/').pop()) + ' (' + w.kind + ')', fmtBytes(w.used) + ' / ' + fmtBytes(w.size)) }
    if (zram.length) { sk += `<span class="sec">ZRAM</span>`; for (const z of zram) sk += kv(esc(z.name) + ' ×' + (z.ratio || 0).toFixed(1), fmtBytes(z.orig) + ' → ' + fmtBytes(z.used), 1) }
    if (!sk) sk = `<span class="k">no swap / zram</span><span class="v">—</span>`
    $('#m-swapkv-' + id).innerHTML = sk
    $('#m-swapsub-' + id).textContent = zram.length ? 'zram ×' + (zram[0].ratio || 0).toFixed(1) : ''

    // ── BATTERY ──
    const pw = s.power || {}, bats = pw.batteries || []
    if (bats.length) {
      const b = bats[0]
      const charging = b.status === 'Charging', flowCls = charging ? 'in' : 'out'
      $('#m-batt-' + id).innerHTML =
        `<div class="bg"><canvas id="m-battg-${id}"></canvas></div>` +
        `<div class="bi"><b>${b.capacity}% · ${esc(b.status)}</b>` +
        `<span class="flow ${flowCls}">${charging ? '▲ charging' : '▼ draining'} ${(b.watts || 0).toFixed(1)} W</span>` +
        `<span>energy ${(b.energy || 0).toFixed(1)} / ${(b.energy_full || 0).toFixed(1)} Wh</span>` +
        `<span>${b.secs ? (charging ? 'full in ' : 'empty in ') + fmtUptime(b.secs) : ''}</span>` +
        `<span>AC ${pw.ac ? 'plugged' : 'unplugged'}</span></div>`
      drawGauge($('#m-battg-' + id), b.capacity, 'BATT')
      $('#m-battsub-' + id).textContent = pw.ac ? '⚡ AC' : 'on battery'
    } else {
      $('#m-batt-' + id).innerHTML = `<div class="bi"><b>${pw.ac ? '⚡ AC power' : 'no battery'}</b><span>desktop / no battery sensor</span></div>`
      $('#m-battsub-' + id).textContent = ''
    }

    // ── NET graphs ──
    let rx = 0, tx = 0, rxT = 0, txT = 0
    for (const nf of (s.net || [])) { rx += nf.rx; tx += nf.tx; rxT += nf.rx_total; txT += nf.tx_total }
    push(hist.rx, rx); push(hist.tx, tx)
    const nmax = Math.max(1, ...hist.rx, ...hist.tx)
    drawGraph($('#m-net-rx-' + id), hist.rx, nmax, 190)
    drawGraph($('#m-net-tx-' + id), hist.tx, nmax, 292)
    $('#m-rx-' + id).textContent = fmtRate(rx)
    $('#m-tx-' + id).textContent = fmtRate(tx)
    $('#m-netsub-' + id).textContent = 'Σ ▼' + fmtBytes(rxT) + ' ▲' + fmtBytes(txT)

    // ── NET per-interface table (mesh/web/dns/wg all shown) ──
    $('#m-niface-' + id).innerHTML = (s.net || []).map(nf => {
      const ip = (nf.ips || []).find(x => x.indexOf(':') === -1) || (nf.ips || [])[0] || '—'
      const err = (nf.rx_err || 0) + (nf.tx_err || 0)
      return `<tr><td class="if">${esc(nf.name)}</td><td class="ip" title="${esc((nf.ips || []).join(', '))} ${esc(nf.mac || '')}">${esc(ip)}</td>` +
        `<td class="num dn">${fmtRate(nf.rx)}</td><td class="num up">${fmtRate(nf.tx)}</td>` +
        `<td class="num">${fmtBytes(nf.rx_total)}</td><td class="num">${fmtBytes(nf.tx_total)}</td>` +
        `<td class="num">${nf.rx_pkts || 0}/${nf.tx_pkts || 0}</td>` +
        `<td class="num ${err ? 'err' : ''}">${err}</td></tr>`
    }).join('') || '<tr><td colspan="8" style="color:#6b7280">no interfaces</td></tr>'

    // ── DISKS + I/O ──
    const io = s.diskio || {}
    $('#m-diosub-' + id).textContent = 'R ' + fmtRate(io.read || 0) + ' · W ' + fmtRate(io.write || 0)
    $('#m-disk-' + id).innerHTML = (s.disks || []).map(d => {
      const u = d.total - d.avail, pc = d.total ? u / d.total * 100 : 0
      return bar(d.mount + (d.fs ? ' · ' + d.fs : ''), pc, fmtBytes(u) + '/' + fmtBytes(d.total) + ' ' + pc.toFixed(0) + '%')
    }).join('') || '<span style="color:#6b7280">no filesystems</span>'

    // ── SENSORS ──
    const temps = (s.temps || []).filter(t => t.temp > 0)
    $('#m-temp-' + id).innerHTML = temps.map(t => {
      const hi = t.crit || t.high || 100
      return bar(esc(t.label), t.temp / hi * 100, t.temp.toFixed(0) + '°C')
    }).join('') || '<span style="color:#6b7280">no sensors exposed</span>'

    // ── PROCESSES (flat metric or parent/child tree) ──
    lastS = s
    renderProcs()
  }
  // PSI-targeted reclaim buttons (CPU box): kill the top hog of a resource
  // until its PSI ≤ 1% (user apps only; SIGTERM). ALL = diagnose worst first.
  $('#m-psiclean-' + id).addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || b.classList.contains('busy')) return
    const k = b.dataset.k, orig = b.textContent
    b.classList.add('busy'); b.textContent = '…killing'
    try {
      const r = k === 'all' ? await invoke('psi_clean_all') : await invoke('psi_clean', { kind: k, target: 1.0 })
      const n = (r.killed || []).length
      b.textContent = k === 'all' ? `⚡ ${r.diagnosed} · ${n}` : (n ? `✓ ${n} killed` : '✓ clear')
    } catch (_) { b.textContent = '✗ fail' }
    setTimeout(() => { b.classList.remove('busy'); b.textContent = orig }, 2800)
  })

  const timer = setInterval(poll, 1000)
  poll()
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'monitor', stop: () => clearInterval(timer) })
  return { id, leaf }
}

// ══ Journal Logs dashboard (no PTY) — stats on top, live feed below ══
const JPRIO = ['emerg', 'alert', 'crit', 'err', 'warn', 'notice', 'info', 'debug']
function jColor(p) { return p <= 3 ? '#f87171' : p === 4 ? '#fbbf24' : p === 5 ? '#22d3ee' : p === 6 ? '#9aa4b2' : '#5b6270' }
// classify a log entry by where it comes from (security / ssh / kernel / service / session)
const JCATS = ['security', 'ssh', 'kernel', 'service', 'session']
function jcat(r) {
  const u = (r.unit || '').toLowerCase()
  if (/sshd|ssh@|ssh\.service|openssh/.test(u)) return 'ssh'
  if (/sudo|polkit|audit|pam|login|logind|fail2ban|crowdsec|apparmor|firewall|nftables|auth/.test(u)) return 'security'
  if (/kernel/.test(u)) return 'kernel'
  if (r.src === 'user') return 'session'
  return 'service'
}
function jcatColor(c) { return { security: '#f87171', ssh: '#fb923c', kernel: '#a78bfa', service: '#22d3ee', session: '#7dd3fc' }[c] || '#9aa4b2' }
function jIntelBar(label, val, max, color) {
  const pct = max > 0 ? val / max * 100 : 0
  return `<div class="ibar"><span class="iu">${label}</span><span class="itrack"><i style="width:${pct.toFixed(0)}%;background:${color}"></i></span><span class="in">${val}</span></div>`
}
function makeJournal(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf journal'; leaf.dataset.pane = String(id)
  leaf.innerHTML = `
    <div class="jrn">
      <div class="jrn-stats" id="j-stats-${id}"></div>
      <div class="jrn-bar" id="j-bar-${id}" title="log entries by priority"></div>
      <div class="jrn-intel">
        <div class="ip"><div class="ih">BY SOURCE · SECURITY / SSH / KERNEL</div><div class="ibars" id="j-cat-${id}"></div></div>
        <div class="ip"><div class="ih">BY IMPORTANCE · PRIORITY</div><div class="ibars" id="j-prio2-${id}"></div></div>
        <div class="ip"><div class="ih">TOP UNITS · VOLUME</div><div class="ilist" id="j-topu-${id}"></div></div>
        <div class="ip"><div class="ih">TOP ERROR SOURCES</div><div class="ilist" id="j-toperr-${id}"></div></div>
      </div>
      <div class="jrn-tools">
        <span class="ptbl-tabs" id="j-scope-${id}"><button data-v="all" class="on">ALL</button><button data-v="system">SYSTEM</button><button data-v="user">USER</button></span>
        <span class="ptbl-tabs" id="j-prio-${id}"><button data-v="all" class="on">ALL</button><button data-v="3">ERR</button><button data-v="4">WARN</button><button data-v="6">INFO</button></span>
        <input class="jrn-search" id="j-search-${id}" placeholder="🔍  filter unit / message…" autocomplete="off" spellcheck="false">
        <span class="jrn-count" id="j-count-${id}"></span>
        <button class="cpbtn" id="j-refresh-${id}" title="Reload">↻</button>
        <button class="cpbtn on" id="j-auto-${id}" title="Auto-refresh (5s)">⏱ auto</button>
        <button class="cpbtn" id="j-copy-${id}" title="Copy filtered feed">⎘</button>
      </div>
      <div class="jrn-feed" id="j-feed-${id}"></div>
    </div>`
  let rows = [], scope = 'all', prio = 'all', q = '', auto = true
  const $ = s => leaf.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const passes = r => (scope === 'all' || r.src === scope) && (prio === 'all' || r.prio <= +prio) &&
    (!q || (r.unit + ' ' + r.msg).toLowerCase().indexOf(q) !== -1)
  const jt = t => { const d = new Date(t); return d.toLocaleTimeString('en-GB') + '.' + String(d.getMilliseconds()).padStart(3, '0') }

  function render() {
    const tot = rows.length || 1
    let err = 0, warn = 0, info = 0, sys = 0, usr = 0; const hist = Array(8).fill(0)
    for (const r of rows) { hist[r.prio] = (hist[r.prio] || 0) + 1; if (r.prio <= 3) err++; else if (r.prio === 4) warn++; else info++; r.src === 'system' ? sys++ : usr++ }
    $('#j-stats-' + id).innerHTML = [['total', rows.length, ''], ['errors', err, 'err'], ['warnings', warn, 'warn'], ['info+', info, 'info'], ['system', sys, ''], ['user', usr, '']]
      .map(([l, n, c]) => `<div class="jstat ${c}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('')
    $('#j-bar-' + id).innerHTML = hist.map((c, p) => c ? `<i style="width:${(c / rows.length * 100).toFixed(2)}%;background:${jColor(p)}" title="${JPRIO[p]}: ${c}"></i>` : '').join('')

    // ── intelligence: where alerts come from, importance, noisiest + errors ──
    const cats = {}, units = {}, errUnits = {}
    for (const r of rows) {
      const c = jcat(r); cats[c] = (cats[c] || 0) + 1
      units[r.unit] = (units[r.unit] || 0) + 1
      if (r.prio <= 3) errUnits[r.unit] = (errUnits[r.unit] || 0) + 1
    }
    const maxCat = Math.max(1, ...JCATS.map(c => cats[c] || 0))
    $('#j-cat-' + id).innerHTML = JCATS.map(c => jIntelBar(c, cats[c] || 0, maxCat, jcatColor(c))).join('')
    const maxPr = Math.max(1, ...hist)
    $('#j-prio2-' + id).innerHTML = hist.map((c, p) => c ? jIntelBar(JPRIO[p], c, maxPr, jColor(p)) : '').join('')
    const topU = Object.entries(units).sort((a, b) => b[1] - a[1]).slice(0, 7)
    $('#j-topu-' + id).innerHTML = topU.map(([u, n]) => `<div class="il"><span class="iu" title="${esc(u)}">${esc(u)}</span><span class="in">${n}</span></div>`).join('') || '<div class="ds-empty">—</div>'
    const topE = Object.entries(errUnits).sort((a, b) => b[1] - a[1]).slice(0, 7)
    $('#j-toperr-' + id).innerHTML = topE.map(([u, n]) => `<div class="il"><span class="iu" title="${esc(u)}">${esc(u)}</span><span class="in" style="color:#f87171">${n}</span></div>`).join('') || '<div class="ds-empty" style="color:#4ade80">no errors 🎉</div>'

    const f = rows.filter(passes).slice(0, 800)
    $('#j-count-' + id).textContent = f.length + ' / ' + rows.length
    $('#j-feed-' + id).innerHTML = f.map(r =>
      `<div class="jline"><span class="jt">${jt(r.t)}</span>` +
      `<span class="jp" style="color:${jColor(r.prio)}">${JPRIO[r.prio] || r.prio}</span>` +
      `<span class="ju" title="${esc(r.unit)} · ${r.src} · pid ${r.pid}">${esc(r.unit)}</span>` +
      `<span class="jm">${esc(r.msg)}</span></div>`).join('')
  }
  async function load() {
    try { rows = await invoke('journal_feed', { n: 600 }) } catch (_) { rows = [] }
    if (!leaf.isConnected) return
    render()
  }
  const segClick = (sel, set) => $(sel).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    set(b.dataset.v); for (const x of $(sel).children) x.classList.toggle('on', x === b); render()
  })
  segClick('#j-scope-' + id, v => scope = v)
  segClick('#j-prio-' + id, v => prio = v)
  $('#j-search-' + id).addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render() })
  $('#j-refresh-' + id).addEventListener('click', load)
  $('#j-auto-' + id).addEventListener('click', () => { auto = !auto; $('#j-auto-' + id).classList.toggle('on', auto) })
  $('#j-copy-' + id).addEventListener('click', () => {
    const f = rows.filter(passes).slice(0, 800)
    clip.write(f.map(r => `${jt(r.t)} ${JPRIO[r.prio] || r.prio} ${r.src} ${r.unit}: ${r.msg}`).join('\n'))
    const b = $('#j-copy-' + id), t = b.textContent; b.textContent = '✓'; setTimeout(() => b.textContent = t, 1200)
  })
  const timer = setInterval(() => { if (auto) load() }, 5000)
  load()
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'journal', stop: () => clearInterval(timer) })
  return { id, leaf }
}

// ══ Cloud Control Center (no PTY) — VMs, containers, log center ══════
function makeCloud(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf cloud'; leaf.dataset.pane = String(id)
  leaf.innerHTML = `
    <div class="cloud">
      <div class="cloud-vms" id="c-vms-${id}"></div>
      <div class="panel cloud-cont"><div class="ph"><span id="c-conthdr-${id}">CONTAINERS</span>
        <span class="proc-tools">
          <span class="ptbl-tabs" id="c-view-${id}"><button data-v="vm" class="on">BY VM</button><button data-v="service">BY SERVICE</button></span>
          <button class="cpbtn" id="c-refresh-${id}" title="Re-probe all VMs (docker ps + stats over the SSH mux)">↻ probe</button></span></div>
        <div class="ptbl-wrap"><table class="ptbl ctbl">
          <thead><tr><th>NAME</th><th>VM</th><th>IMAGE</th><th>STATE</th><th class="num">CPU%</th><th class="num">MEM</th><th>PORTS</th></tr></thead>
          <tbody id="c-cont-${id}"></tbody></table></div></div>
      <div class="panel cloud-logs"><div class="ph"><span id="c-loghdr-${id}">LOG CENTER</span>
        <span class="proc-tools">
          <span class="ptbl-tabs" id="c-logsrc-${id}"><button data-v="system" class="on">SYSTEM</button><button data-v="container">CONTAINER</button></span>
          <select class="jrn-search" id="c-logcont-${id}" style="max-width:150px" title="Pick a container (CONTAINER mode)"><option value="">— pick container —</option></select>
          <input class="jrn-search" id="c-logq-${id}" placeholder="🔍  filter log lines…" autocomplete="off" spellcheck="false">
          <span class="ptbl-tabs" id="c-tail-${id}"><button data-v="100">100</button><button data-v="200" class="on">200</button><button data-v="500">500</button></span>
          <button class="cpbtn" id="c-logref-${id}" title="Reload logs">↻</button>
          <button class="cpbtn" id="c-logcopy-${id}" title="Copy logs">⎘</button>
        </span></div>
        <div class="cloud-logfeed" id="c-logfeed-${id}">select a VM or container…</div></div>
    </div>`
  let targets = [], vms = {}, selVm = null, selCont = null, tail = 200, logq = '', logRaw = '', viewMode = 'vm', catMap = [], logSrc = 'system'
  const $ = s => leaf.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const contStat = (vm, name) => ((vms[vm] || {}).stats || {})[name] || {}
  const rowHtml = (c, vm) => {
    const st = c.State || '', cls = st === 'running' ? 'st-run' : st === 'exited' ? 'st-exit' : 'st-other', s = contStat(vm, c.Names)
    return `<tr class="${selCont === c.Names && selVm === vm ? 'sel' : ''}" data-cont="${esc(c.Names || '')}" data-vm="${esc(vm)}">` +
      `<td class="nm">${esc(c.Names || '')}</td><td class="ip">${esc(vm)}</td>` +
      `<td class="im">${esc((c.Image || '').slice(0, 28))}</td><td class="${cls}">${esc(st)}</td>` +
      `<td class="num">${esc(s.CPUPerc || '·')}</td><td class="num">${esc(s.MemPerc || '·')}</td>` +
      `<td style="color:#6b7280">${esc((c.Ports || '').slice(0, 26))}</td></tr>`
  }

  function renderVms() {
    $('#c-vms-' + id).innerHTML = targets.map(t => {
      const v = vms[t.alias] || {}, up = v.reachable
      const dot = up ? '#4ade80' : v.error ? '#f87171' : '#6b7280'
      const ping = v.ping
      const pcol = ping ? (ping.up ? '#4ade80' : '#f87171') : '#6b7280'
      return `<div class="vmcard ${selVm === t.alias ? 'sel' : ''}" data-vm="${esc(t.alias)}">
        <div class="vh"><span class="dot" style="color:${dot};background:${dot}"></span><span class="al">${esc(t.alias)}</span><span class="wg">${esc(t.wg || '')}</span></div>
        <div class="lbl">${esc(t.label || '')}</div>
        <div class="meta">${up
          ? `<span>⏱ <b>${esc(v.uptime || '?')}</b></span><span>📦 <b>${v.n_running || 0}</b>/${v.n_containers || 0}</span><span>💾 <b>${v.disk_pct || 0}%</b></span>`
          : `<span style="color:#f87171">${esc((v.error || 'probing…')).slice(0, 40)}</span>`}
          ${ping ? `<span class="pill" style="color:${pcol};border-color:${pcol}">edge ${ping.code || '×'} · ${ping.ms || '?'}ms</span>` : ''}</div>
      </div>`
    }).join('')
  }
  function renderConts() {
    const tb = $('#c-cont-' + id)
    if (viewMode === 'service') {
      // aggregate all containers across reachable VMs, group by category
      const all = []
      for (const t of targets) { const v = vms[t.alias]; if (v && v.containers) for (const c of v.containers) all.push({ c, vm: t.alias }) }
      $('#c-conthdr-' + id).textContent = 'CONTAINERS · by service · ' + all.length
      let html = ''; const used = new Set()
      for (const m of catMap) {
        const rows = all.filter(x => !used.has(x.vm + '/' + x.c.Names) && (m.match || []).some(p => (x.c.Names || '').toLowerCase().indexOf(p) !== -1))
        if (!rows.length) continue
        rows.forEach(x => used.add(x.vm + '/' + x.c.Names))
        rows.sort((a, b) => (a.c.Names || '').localeCompare(b.c.Names || ''))
        html += `<tr class="catrow"><td colspan="7">${esc(m.group)} · ${esc(m.cat)} · ${rows.length}</td></tr>` + rows.map(x => rowHtml(x.c, x.vm)).join('')
      }
      const rest = all.filter(x => !used.has(x.vm + '/' + x.c.Names)).sort((a, b) => (a.c.Names || '').localeCompare(b.c.Names || ''))
      if (rest.length) html += `<tr class="catrow"><td colspan="7">Other · ${rest.length}</td></tr>` + rest.map(x => rowHtml(x.c, x.vm)).join('')
      tb.innerHTML = html || '<tr><td colspan="7" style="color:#6b7280">no containers (probe first)</td></tr>'
    } else {
      // BY VM: every VM gets its own grouped table section (same catrow
      // pattern as BY SERVICE) — not just the currently-selected one.
      let total = 0
      let html = ''
      for (const t of targets) {
        const v = vms[t.alias]
        const rows = (v && v.containers) || []
        total += rows.length
        const sel = t.alias === selVm ? ' sel-vm' : ''
        const status = v ? (v.reachable ? (v.n_running || 0) + '/' + (v.n_containers || 0) + ' running' : (v.error || 'unreachable')) : 'not probed'
        rows.sort((a, b) => (a.Names || '').localeCompare(b.Names || ''))
        html += `<tr class="catrow${sel}" data-vmhdr="${esc(t.alias)}"><td colspan="7">${esc(t.alias)} · ${esc(status)}</td></tr>` +
          (rows.length ? rows.map(c => rowHtml(c, t.alias)).join('')
            : `<tr><td colspan="7" style="color:#6b7280;padding-left:14px">no containers</td></tr>`)
      }
      $('#c-conthdr-' + id).textContent = 'CONTAINERS · by VM · ' + total
      tb.innerHTML = html || '<tr><td colspan="7" style="color:#6b7280">no VMs configured</td></tr>'
    }
  }
  function renderLogs() {
    const lines = logRaw.split('\n')
    const f = logq ? lines.filter(l => l.toLowerCase().indexOf(logq) !== -1) : lines
    $('#c-logfeed-' + id).innerHTML = esc(f.join('\n')) || '(no output)'
  }
  // Container picker for the SYSTEM/CONTAINER log-source filter — repopulated
  // whenever the selected VM's container list changes (probe/select).
  function populateLogContainerPicker() {
    const sel = $('#c-logcont-' + id); if (!sel) return
    const list = ((vms[selVm] || {}).containers || []).map(c => c.Names).filter(Boolean)
    const cur = sel.value
    sel.innerHTML = '<option value="">— pick container —</option>' + list.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')
    if (list.includes(cur)) sel.value = cur
    else if (list.includes(selCont)) sel.value = selCont
  }
  async function loadLogs() {
    if (!selVm) return
    // logSrc drives WHAT we fetch: 'system' → VM journal (container=null);
    // 'container' → the picked container's docker logs.
    const container = logSrc === 'container' ? (selCont || null) : null
    $('#c-loghdr-' + id).textContent = 'LOG CENTER · ' + selVm + (container ? ' · ' + container : ' · system journal')
    if (logSrc === 'container' && !container) {
      $('#c-logfeed-' + id).textContent = 'pick a container above, or click one in the CONTAINERS table…'
      return
    }
    $('#c-logfeed-' + id).textContent = 'loading…'
    try { logRaw = await invoke('cloud_logs', { alias: selVm, container, tail }) }
    catch (e) { logRaw = 'error: ' + e }
    if (!leaf.isConnected) return
    renderLogs()
    $('#c-logfeed-' + id).scrollTop = $('#c-logfeed-' + id).scrollHeight
  }
  function selectVm(alias) { selVm = alias; selCont = null; renderVms(); renderConts(); populateLogContainerPicker(); loadLogs() }
  async function probe() {
    $('#c-refresh-' + id).textContent = '… probing'
    await Promise.all(targets.map(async t => {
      const [v, ping, stats] = await Promise.all([
        invoke('cloud_vm', { alias: t.alias }).catch(e => ({ alias: t.alias, reachable: false, error: String(e) })),
        t.pub ? invoke('cloud_ping', { url: t.pub }).catch(() => null) : Promise.resolve(null),
        invoke('cloud_stats', { alias: t.alias }).catch(() => null),   // docker stats over the SSH mux
      ])
      v.ping = ping
      v.stats = {}; for (const s of ((stats && stats.stats) || [])) v.stats[s.Name] = s
      vms[t.alias] = v
      // BOTH view modes now show every VM's containers (grouped), so refresh
      // regardless of which one is active.
      if (leaf.isConnected) { renderVms(); renderConts(); if (t.alias === selVm) populateLogContainerPicker() }
    }))
    if (!leaf.isConnected) return
    $('#c-refresh-' + id).textContent = '↻ probe'
    if (!selVm) { const first = targets.find(t => (vms[t.alias] || {}).reachable) || targets[0]; if (first) selectVm(first.alias) }
    else { renderConts(); populateLogContainerPicker() }
  }
  async function init() {
    const data = await invoke('cloud_targets').catch(() => null)
    targets = (data && data.vms) || []
    catMap = (data && data.service_categories) || []
    if (!leaf.isConnected) return
    renderVms(); probe()
  }

  const syncLogSrcButtons = () => { for (const x of $('#c-logsrc-' + id).children) x.classList.toggle('on', x.dataset.v === logSrc) }
  $('#c-vms-' + id).addEventListener('click', e => { const c = e.target.closest('.vmcard'); if (c) selectVm(c.dataset.vm) })
  $('#c-cont-' + id).addEventListener('click', e => {
    const hdr = e.target.closest('tr[data-vmhdr]')
    if (hdr) { selVm = hdr.dataset.vmhdr; selCont = null; logSrc = 'system'; syncLogSrcButtons(); renderConts(); populateLogContainerPicker(); loadLogs(); return }
    const r = e.target.closest('tr[data-cont]'); if (!r) return
    selCont = r.dataset.cont || null; if (r.dataset.vm) selVm = r.dataset.vm   // service view: follow the row's VM
    logSrc = 'container'; syncLogSrcButtons(); populateLogContainerPicker()
    renderConts(); loadLogs()
  })
  $('#c-view-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    viewMode = b.dataset.v; for (const x of $('#c-view-' + id).children) x.classList.toggle('on', x === b); renderConts()
  })
  $('#c-refresh-' + id).addEventListener('click', probe)
  $('#c-logsrc-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    logSrc = b.dataset.v; syncLogSrcButtons()
    if (logSrc === 'container') populateLogContainerPicker()
    loadLogs()
  })
  $('#c-logcont-' + id).addEventListener('change', e => { selCont = e.target.value || null; loadLogs() })
  $('#c-logref-' + id).addEventListener('click', loadLogs)
  $('#c-logq-' + id).addEventListener('input', e => { logq = e.target.value.trim().toLowerCase(); renderLogs() })
  $('#c-tail-' + id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tail = +b.dataset.v; for (const x of $('#c-tail-' + id).children) x.classList.toggle('on', x === b); loadLogs() })
  $('#c-logcopy-' + id).addEventListener('click', () => { clip.write(logRaw); const b = $('#c-logcopy-' + id), t = b.textContent; b.textContent = '✓'; setTimeout(() => b.textContent = t, 1200) })

  init()
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'cloud', stop: () => {} })
  return { id, leaf }
}

// ══ Data Sync Center (no PTY) — data topology, sync, peers, stats ════
function makeDataSync(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf datasync'; leaf.dataset.pane = String(id)
  const P = (t, hdr, body) => `<div class="panel ${t}"><div class="ph"><span>${hdr}</span></div>${body}</div>`
  leaf.innerHTML = `
    <div class="ds">
      <div class="ds-top"><span style="font-weight:700;color:var(--accent);letter-spacing:.08em">DATA SYNC CENTER</span>
        <span style="flex:1"></span><span class="jrn-count" id="d-note-${id}"></span>
        <button class="cpbtn" id="d-refresh-${id}">↻ refresh</button></div>
      <div class="jrn-stats" id="d-stats-${id}"></div>
      <div class="ds-grid">
        ${P('', 'LOCAL · MOUNTS', '<div class="seg" id="d-mseg-' + id + '"></div><div class="seg-legend" id="d-mleg-' + id + '"></div><div class="bars" id="d-mounts-' + id + '"></div>')}
        ${P('', 'DOCKER VOLUMES', '<div class="ds-list" id="d-vols-' + id + '"></div>')}
        ${P('', 'GIT REPOS', '<div class="ds-list" id="d-git-' + id + '"></div>')}
        ${P('', 'RCLONE · CLOUD REMOTES', '<div class="ds-list" id="d-remotes-' + id + '"></div>')}
        ${P('', 'S3 · ORACLE OBJECT STORAGE', '<div class="ds-list" id="d-s3-' + id + '"></div>')}
        ${P('', 'GHCR · CONTAINER IMAGES', '<div class="ds-list" id="d-ghcr-' + id + '"></div>')}
        ${P('', 'RELEASES', '<div class="ds-list" id="d-rel-' + id + '"></div>')}
        ${P('', 'SYNC PEERS', '<div class="ds-list" id="d-peers-' + id + '"></div>')}
        ${P('', 'FUSE · USB', '<div class="ds-list" id="d-fuseusb-' + id + '"></div>')}
        ${P('', 'SYNC RULES · RCLONE', '<div class="ds-list" id="d-rules-' + id + '"></div>')}
      </div>
    </div>`
  const $ = s => leaf.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const empty = m => `<div class="ds-empty">${m}</div>`
  const kv = (k, v, t) => `<div class="ds-kv"><span class="k">${esc(k)}${t ? ' <span class="t">' + esc(t) + '</span>' : ''}</span><span class="v">${esc(v)}</span></div>`

  function renderLocal(d) {
    // stat tiles
    let tUsed = 0, tSize = 0
    for (const m of (d.mounts || [])) { tUsed += +m.used || 0; tSize += +m.size || 0 }
    const dirtyRepos = (d.repos || []).filter(r => r.dirty > 0).length
    $('#d-stats-' + id).innerHTML = [
      ['disk used', fmtBytes(tUsed), ''], ['disk total', fmtBytes(tSize), ''],
      ['mounts', (d.mounts || []).length, ''], ['volumes', (d.volumes || []).length, ''],
      ['git dirty', dirtyRepos + '/' + (d.repos || []).length, dirtyRepos ? 'warn' : ''],
      ['remotes', (d.remotes || []).length, ''], ['peers', (d.peers || []).length, 'info'],
    ].map(([l, n, c]) => `<div class="jstat ${c}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('')
    // stacked color segment bar — used space per filesystem (like the MEM box)
    const mts = d.mounts || []
    const dpal = ['hsl(0,72%,56%)', 'hsl(190,72%,55%)', 'hsl(45,80%,55%)', 'hsl(280,60%,62%)', 'hsl(150,52%,50%)', 'hsl(20,82%,56%)', 'hsl(320,60%,60%)']
    const dTotUsed = mts.reduce((a, m) => a + (+m.used || 0), 0) || 1
    $('#d-mseg-' + id).innerHTML = mts.map((m, i) => `<span style="width:${(+m.used / dTotUsed * 100).toFixed(2)}%;background:${dpal[i % dpal.length]}" title="${esc(m.target)} ${fmtBytes(+m.used || 0)}"></span>`).join('')
    $('#d-mleg-' + id).innerHTML = mts.map((m, i) => `<span><i style="background:${dpal[i % dpal.length]}"></i>${esc(m.target)} ${fmtBytes(+m.used || 0)}</span>`).join('')
    // per-mount gradient bars (real per-device usage after dedupe)
    $('#d-mounts-' + id).innerHTML = mts.map(m => {
      const pct = parseFloat(String(m.usep)) || (m.size ? (+m.used / +m.size * 100) : 0)
      return bar(m.target + '  ' + m.fstype, pct, fmtBytes(+m.used || 0) + ' / ' + fmtBytes(+m.size || 0) + '  ' + pct.toFixed(0) + '%')
    }).join('') || empty('no mounts')
    // volumes
    $('#d-vols-' + id).innerHTML = (d.volumes || []).map(v => kv(v.Name || v.name || '?', v.Driver || v.driver || '', (v.Scope || ''))).join('') || empty('no docker volumes')
    // git
    $('#d-git-' + id).innerHTML = (d.repos || []).map(r => {
      const b = []
      if (r.dirty) b.push(`<span class="ds-badge dirty">±${r.dirty}</span>`); else b.push(`<span class="ds-badge clean">clean</span>`)
      if (r.ahead) b.push(`<span class="ds-badge ahead">↑${r.ahead}</span>`)
      if (r.behind) b.push(`<span class="ds-badge behind">↓${r.behind}</span>`)
      return `<div class="ds-repo"><span class="rn">${esc(r.name)}</span><span class="rl" title="${esc(r.last)}">${esc(r.branch)} · ${esc(r.last)}</span><span class="rb">${b.join('')}</span></div>`
    }).join('') || empty('no repos')
    // rclone remotes + S3 split
    const s3t = d.s3_types || ['s3', 'oracleobjectstorage']
    $('#d-remotes-' + id).innerHTML = (d.remotes || []).map(r => kv(r.name, '', r.type)).join('') || empty('no rclone remotes')
    const s3 = (d.remotes || []).filter(r => s3t.indexOf(r.type) !== -1)
    $('#d-s3-' + id).innerHTML = s3.map(r => kv(r.name, '', r.type)).join('') || empty('no S3 / OCI object storage remote configured')
    // fuse + usb
    const fu = (d.fuse || []).map(f => kv(f.target, f.fstype, 'fuse')).join('') +
      (d.usb || []).map(u => kv((u.name || '') + (u.label ? ' · ' + u.label : ''), fmtBytes(+u.size || 0), 'usb ' + (u.mountpoint || 'unmounted'))).join('')
    $('#d-fuseusb-' + id).innerHTML = fu || empty('no fuse / usb')
    // rules
    $('#d-rules-' + id).innerHTML = (d.rclone_rules || []).map(r => kv(r.name, r.src || '', r.note || '')).join('') || empty('no sync rules configured')
    // peers (reachability filled async)
    peers = d.peers || []
    $('#d-peers-' + id).innerHTML = peers.map((p, i) =>
      `<div class="ds-peer" id="d-peer-${id}-${i}"><span class="dot" style="color:#6b7280;background:#6b7280"></span><span class="ph">${esc(p.name)}</span><span class="pk">${esc(p.kind)}</span><span class="pi">…</span></div>`).join('') || empty('no peers')
  }
  let peers = []
  async function probePeers() {
    await Promise.all(peers.map(async (p, i) => {
      const r = await invoke('peer_ping', { host: p.host || p.name, local: p.kind === 'local' }).catch(() => ({ up: false, info: 'error' }))
      const el = $('#d-peer-' + id + '-' + i); if (!el) return
      const col = r.up ? '#4ade80' : '#f87171'
      el.querySelector('.dot').style.color = el.querySelector('.dot').style.background = col
      el.querySelector('.pi').textContent = r.info || (r.up ? 'up' : 'down')
    }))
  }
  async function loadGh() {
    $('#d-ghcr-' + id).innerHTML = empty('loading…'); $('#d-rel-' + id).innerHTML = empty('loading…')
    const g = await invoke('data_gh').catch(() => null)
    if (!leaf.isConnected || !g) { $('#d-ghcr-' + id).innerHTML = empty('unavailable'); $('#d-rel-' + id).innerHTML = empty('unavailable'); return }
    $('#d-ghcr-' + id).innerHTML = (g.ghcr || []).map(p => kv(p.name, 'v×' + (p.versions || 0), p.visibility)).join('') || empty('no GHCR packages (needs read:packages)')
    $('#d-rel-' + id).innerHTML = (g.releases || []).map(rr =>
      (rr.releases || []).slice(0, 2).map(rel => kv((rr.repo || '').split('/').pop() + ' ' + (rel.tagName || ''), rel.isLatest ? 'latest' : '', '')).join('')).join('') || empty('no releases')
  }
  async function load() {
    $('#d-refresh-' + id).textContent = '… loading'
    const d = await invoke('data_sync').catch(() => null)
    if (!leaf.isConnected) return
    if (d) { renderLocal(d); probePeers() }
    $('#d-refresh-' + id).textContent = '↻ refresh'
    loadGh()
  }
  $('#d-refresh-' + id).addEventListener('click', load)
  load()
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'datasync', stop: () => {} })
  return { id, leaf }
}

// ══ DEV CONTROL (no PTY) — invoke() instrumentation, live ═══════════
// Answers "what's actually trashing the UX": every invoke() call app-wide
// (SSH probes, docker stats, journal reads, process scans) is timed by the
// wrapper near the top of this file and pushed into devctlLog. This tab
// aggregates by command (count/total/avg/max — sorted by TOTAL time, the
// real culprit ranking) or shows the raw recent-call feed, live via
// devctlListeners rather than polling.
function makeDevControl(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf devctl'; leaf.dataset.pane = String(id)
  leaf.innerHTML = `
    <div class="devctl">
      <div class="panel">
        <div class="ph"><span id="dc-hdr-${id}">DEV CONTROL · invoke() instrumentation</span>
          <span class="proc-tools">
            <span class="ptbl-tabs" id="dc-view-${id}"><button data-v="agg" class="on">BY COMMAND</button><button data-v="recent">RECENT</button></span>
            <button class="cpbtn" id="dc-pause-${id}" title="Pause live updates">⏸ pause</button>
            <button class="cpbtn" id="dc-clear-${id}" title="Clear the recorded log">🗑 clear</button>
          </span>
        </div>
        <div class="ptbl-wrap"><table class="ptbl">
          <thead id="dc-head-${id}"></thead>
          <tbody id="dc-body-${id}"></tbody>
        </table></div>
      </div>
    </div>`
  const $ = s => leaf.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const fmtMs = ms => ms >= 1000 ? (ms / 1000).toFixed(2) + 's' : ms.toFixed(0) + 'ms'
  const agoStr = at => { const s = Math.max(0, Math.round((Date.now() - at) / 1000)); return s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago' }
  let view = 'agg', paused = false

  function renderAgg() {
    $('#dc-head-' + id).innerHTML = '<tr><th>COMMAND</th><th class="num">CALLS</th><th class="num">TOTAL</th>' +
      '<th class="num">AVG</th><th class="num">MAX</th><th class="num">ERRORS</th><th class="num">LAST</th></tr>'
    const agg = new Map()
    for (const e of devctlLog) {
      const a = agg.get(e.cmd) || { cmd: e.cmd, calls: 0, total: 0, max: 0, errs: 0, last: 0 }
      a.calls++; a.total += e.ms; a.max = Math.max(a.max, e.ms); if (!e.ok) a.errs++; a.last = Math.max(a.last, e.at)
      agg.set(e.cmd, a)
    }
    const rows = [...agg.values()].sort((a, b) => b.total - a.total)
    $('#dc-body-' + id).innerHTML = rows.map(a => {
      const avg = a.total / a.calls, cc = avg > 800 ? 'hot' : avg > 200 ? 'warm' : ''
      return `<tr><td class="n">${esc(a.cmd)}</td><td class="num">${a.calls}</td>` +
        `<td class="num ${cc}">${fmtMs(a.total)}</td><td class="num ${cc}">${fmtMs(avg)}</td>` +
        `<td class="num">${fmtMs(a.max)}</td><td class="num ${a.errs ? 'hot' : ''}">${a.errs || '·'}</td>` +
        `<td class="num st">${agoStr(a.last)}</td></tr>`
    }).join('') || `<tr><td colspan="7" style="color:#6b7280">no invoke() calls recorded yet</td></tr>`
  }
  function renderRecent() {
    $('#dc-head-' + id).innerHTML = '<tr><th class="num">WHEN</th><th>COMMAND</th><th>ARGS</th><th class="num">MS</th><th>OK</th></tr>'
    const rows = devctlLog.slice().reverse().slice(0, 200)
    $('#dc-body-' + id).innerHTML = rows.map(e => {
      const cc = e.ms > 800 ? 'hot' : e.ms > 200 ? 'warm' : ''
      const args = e.args ? esc(JSON.stringify(e.args)).slice(0, 60) : '·'
      return `<tr><td class="num st">${agoStr(e.at)}</td><td class="n">${esc(e.cmd)}</td>` +
        `<td class="hier">${args}</td><td class="num ${cc}">${fmtMs(e.ms)}</td>` +
        `<td class="${e.ok ? '' : 'hot'}">${e.ok ? '✓' : '✗ ' + esc(e.err || '')}</td></tr>`
    }).join('') || `<tr><td colspan="5" style="color:#6b7280">no invoke() calls recorded yet</td></tr>`
  }
  function render() { view === 'agg' ? renderAgg() : renderRecent() }
  const onNewEntry = () => { if (!paused && leaf.isConnected) render() }
  devctlListeners.add(onNewEntry)

  $('#dc-view-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    for (const x of $('#dc-view-' + id).children) x.classList.remove('on')
    b.classList.add('on'); view = b.dataset.v; render()
  })
  $('#dc-pause-' + id).addEventListener('click', () => {
    paused = !paused
    $('#dc-pause-' + id).textContent = paused ? '▶ resume' : '⏸ pause'
  })
  $('#dc-clear-' + id).addEventListener('click', () => { devctlLog.length = 0; render() })

  render()
  leaf.addEventListener('mousedown', () => focusPane(id), true)
  panes.set(id, { leaf, tabId, kind: 'devctl', stop: () => devctlListeners.delete(onNewEntry) })
  return { id, leaf }
}

// ══ AGI dashboard (no PTY) — Claude Code usage analytics ═════════════
function makeAGI(tabId) {
  const id = ++paneSeq
  const leaf = document.createElement('div')
  leaf.className = 'leaf agi'; leaf.dataset.pane = String(id)
  leaf.innerHTML = `
    <div class="agi">
      <div class="agi-top"><span style="font-weight:700;color:var(--accent2);letter-spacing:.08em">AGI · CLAUDE USAGE</span>
        <span style="flex:1"></span><span class="jrn-count" id="a-note-${id}"></span>
        <button class="cpbtn" id="a-refresh-${id}">↻ refresh</button></div>
      <div class="agi-cur" id="a-cur-${id}"></div>

      <div class="agi-grid">
        <div class="panel agi-panel-wide"><div class="ph"><span>5-HOUR CYCLES</span><span class="sub">tokens · ~16 days</span></div>
