<script>
window.addEventListener('error', e => {
  const d = document.createElement('div')
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:red;color:white;font:11px monospace;padding:8px;white-space:pre-wrap;word-break:break-all'
  const msg = 'JS ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + (e.error && e.error.stack ? '\n' + e.error.stack : '')
  d.textContent = msg
  document.body.appendChild(d)
  document.title = 'ERR: ' + msg.slice(0, 200)
})
window.addEventListener('unhandledrejection', e => {
  const d = document.createElement('div')
  d.style.cssText = 'position:fixed;top:40px;left:0;z-index:99999;background:orange;color:black;font:12px monospace;padding:8px;max-width:100vw;white-space:pre-wrap'
  d.textContent = 'PROMISE REJECTION: ' + (e.reason && e.reason.stack || e.reason)
  document.body.appendChild(d)
})
</script>

<script>
// ══ System-monitor pane (no PTY): a btop-neon + glances clone ═════════
// Visuals: neon-glow area graphs (green base → yellow → red peaks), per-core
// sparklines (each core its own mini graph), circular gauges for CPU/RAM/Swap,
// a stacked memory-segment bar. Data (glances-dense): host/os/kernel/uptime +
// clock, CPU model/freq/load, mem breakdown (used/cached/buffers/free/swap),
// disk I/O read/write, per-iface net rates + totals, temps, filesystems, and a
// full process table (PID/USER/CPU%/MEM%/TIME+/CMD) sortable by CPU or MEM.
const MON_HIST = 200
function fmtBytes(n) {
  if (n < 1024) return n + ' B'
  const u = ['K', 'M', 'G', 'T', 'P']; let i = -1
  do { n /= 1024; i++ } while (n >= 1024 && i < u.length - 1)
  return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i] + 'B'
}
function fmtRate(n) { return fmtBytes(n) + '/s' }
function fmtUptime(sec) {
  sec = Math.floor(sec || 0)
  const d = Math.floor(sec / 86400); sec %= 86400
  const h = Math.floor(sec / 3600); sec %= 3600
  const m = Math.floor(sec / 60)
  const p = x => String(x).padStart(2, '0')
  return (d ? d + 'd ' : '') + p(h) + ':' + p(m)
}
function fmtTimeplus(sec) {           // glances TIME+ : Hh:MM:SS
  sec = Math.floor(sec || 0)
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60
  const p = x => String(x).padStart(2, '0')
  return (h ? h + ':' : '') + p(m) + ':' + p(ss)
}
// green→yellow→red by fraction (0..1). btop meter colouring.
function heat(p) { p = Math.max(0, Math.min(1, p)); return `hsl(${(130 * (1 - p)).toFixed(0)}deg 70% 55%)` }
function setCanvas(cv) {
  const dpr = window.devicePixelRatio || 1
  const w = cv.clientWidth, h = cv.clientHeight
  if (w < 2 || h < 2) return null
  cv.width = w * dpr; cv.height = h * dpr
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h)
  return { g, w, h }
}
// btop area graph with neon glow. hue: single-hue (net); else heat gradient.
function drawGraph(cv, data, maxHint, hue, hard) {
  const c = setCanvas(cv); if (!c) return
  const { g, w, h } = c
  const n = data.length; if (n < 2) return
  // hard: use maxHint as a fixed ceiling (values above clip at the top);
  // otherwise auto-scale to the data. PSI uses a fixed 0–30% ceiling.
  const max = hard ? Math.max(maxHint, 1e-6) : Math.max(maxHint || 1, ...data, 1e-6)
  const dx = w / (MON_HIST - 1)
  const y = v => h - (v / max) * h
  const x0 = w - (n - 1) * dx
  // faint baseline grid
  g.strokeStyle = 'rgba(255,255,255,.04)'; g.lineWidth = 1
  for (let q = 1; q < 4; q++) { const yy = h * q / 4; g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke() }
  g.beginPath(); g.moveTo(x0, h)
  for (let i = 0; i < n; i++) g.lineTo(x0 + i * dx, y(data[i]))
  g.lineTo(x0 + (n - 1) * dx, h); g.closePath()
  const grad = g.createLinearGradient(0, 0, 0, h)
  if (hue != null) {
    grad.addColorStop(0, `hsla(${hue},85%,62%,.6)`); grad.addColorStop(1, `hsla(${hue},85%,55%,.03)`)
  } else {
    grad.addColorStop(0, 'hsla(0,75%,58%,.6)'); grad.addColorStop(.38, 'hsla(45,80%,56%,.4)')
    grad.addColorStop(.72, 'hsla(130,64%,50%,.2)'); grad.addColorStop(1, 'hsla(130,64%,50%,.03)')
  }
  g.fillStyle = grad; g.fill()
  // glowing stroke
  g.beginPath()
  for (let i = 0; i < n; i++) { const px = x0 + i * dx, py = y(data[i]); i ? g.lineTo(px, py) : g.moveTo(px, py) }
  const col = hue != null ? `hsl(${hue},90%,64%)` : heat(data[n - 1] / max)
  g.lineWidth = 1.6; g.strokeStyle = col; g.shadowBlur = 9; g.shadowColor = col; g.stroke(); g.shadowBlur = 0
}
// tiny per-core sparkline
function drawSpark(cv, data) {
  const c = setCanvas(cv); if (!c) return
  const { g, w, h } = c
  const n = data.length; if (n < 2) return
  const dx = w / (MON_HIST - 1), y = v => h - (v / 100) * h, x0 = w - (n - 1) * dx
  g.beginPath(); g.moveTo(x0, h)
  for (let i = 0; i < n; i++) g.lineTo(x0 + i * dx, y(data[i]))
  g.lineTo(x0 + (n - 1) * dx, h); g.closePath()
  const col = heat(data[n - 1] / 100)
  g.fillStyle = col.replace('hsl', 'hsla').replace(')', ',.22)'); g.fill()
  g.beginPath()
  for (let i = 0; i < n; i++) { const px = x0 + i * dx, py = y(data[i]); i ? g.lineTo(px, py) : g.moveTo(px, py) }
  g.lineWidth = 1.2; g.strokeStyle = col; g.stroke()
}
// circular gauge: track + value arc (heat) + centered % and label.
function drawGauge(cv, pct, label) {
  const c = setCanvas(cv); if (!c) return
  const { g, w, h } = c
  const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 7
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25
  pct = Math.max(0, Math.min(100, pct || 0))
  g.lineWidth = 7; g.lineCap = 'round'
  g.strokeStyle = 'rgba(255,255,255,.08)'
  g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke()
  const col = heat(pct / 100)
  g.strokeStyle = col; g.shadowBlur = 10; g.shadowColor = col
  g.beginPath(); g.arc(cx, cy, r, a0, a0 + (a1 - a0) * pct / 100); g.stroke(); g.shadowBlur = 0
  g.fillStyle = '#e2e8f0'; g.textAlign = 'center'; g.textBaseline = 'middle'
  g.font = '700 ' + Math.round(r * 0.55) + 'px monospace'
  g.fillText(Math.round(pct) + '%', cx, cy - 2)
  if (label) { g.fillStyle = '#6b7280'; g.font = '9px monospace'; g.fillText(label, cx, cy + r * 0.55) }
}
function bar(lbl, pct, right, col) {
  pct = Math.max(0, Math.min(100, pct || 0))
  const c = col || heat(pct / 100)
  return `<div class="bar"><div class="lbl"><span>${lbl}</span><span class="r">${right}</span></div>` +
    `<div class="track"><i style="width:${pct.toFixed(1)}%;background:${c};color:${c}"></i></div></div>`
}

// ══ STACK dashboard (no PTY) — fully static machine + config + cloud info ══
// Loads ONCE on open, no timer at all — this is the new default landing
// page precisely because it must never poll. Config-level per request (not
// just a high-level description): real repo-tree presence, real env-var
// presence (never values), real tool --version output, and the cloud
// network's static topology (no live SSH probing — that's the Cloud tab's
// job). Modeled on the fish greeting's info-dense layout.
function makeStack(tabId) { return buildFrame('stack', tabId) }
registerFrame({
  type: 'stack',
  title: '📦 stack',
  refreshMs: 60000,
  autoFirstOpen: true,   // fully local/static info — matches prior always-load-on-open
  make(el, ctx) {
  const { id, leaf } = ctx
  el.innerHTML = `
      <div class="jrn-stats" id="s-mach-${id}"></div>
      <div class="jrn-stats" id="s-mach2-${id}"></div>
      <div class="agi-grid">
        <div class="panel"><div class="ph"><span>SECURITY</span></div><div id="s-sec-${id}"></div></div>
        <div class="panel"><div class="ph"><span>NIXOS / HOME-MANAGER</span></div><div id="s-gen-${id}"></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>MULTI-OS LAYOUT</span></div><div id="s-multios-${id}" class="stack-list"></div></div>
        <div class="panel"><div class="ph"><span>BOOTLOADER</span></div><div id="s-boot-${id}" class="stack-list"></div></div>
        <div class="panel"><div class="ph"><span>BUILDERS</span></div><div id="s-builders-${id}" class="stack-list"></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>FLAKES / REPOS</span></div>
          <div class="ptbl-wrap"><table class="ptbl"><thead><tr><th>REPO</th><th>VIS</th><th>ROLE</th><th>PRESENT</th></tr></thead><tbody id="s-flakes-${id}"></tbody></table></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>GIT STATUS</span></div>
          <div class="ptbl-wrap"><table class="ptbl"><thead><tr><th>REPO</th><th>BRANCH</th><th class="num">DIRTY</th><th>LAST COMMIT</th></tr></thead><tbody id="s-gitst-${id}"></tbody></table></div></div>
        <div class="panel"><div class="ph"><span>TOOLS · CLI</span></div><div id="s-tools-${id}" class="stack-chips"></div></div>
        <div class="panel"><div class="ph"><span>TOOLS · GUI</span></div><div id="s-gui-${id}" class="stack-chips"></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>ENV VARS</span><span class="sub">presence only — never values</span></div><div id="s-envs-${id}"></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>CLOUD NETWORK · VMs</span><span class="sub">static topology — see the Cloud tab for live status</span></div>
          <div class="ptbl-wrap"><table class="ptbl"><thead><tr><th>ALIAS</th><th>WG IP</th><th>LABEL</th><th>PUBLIC URL</th></tr></thead><tbody id="s-cloud-${id}"></tbody></table></div></div>
        <div class="panel agi-panel-wide"><div class="ph"><span>CLOUD NETWORK · SERVICE CATEGORIES</span></div><div id="s-cats-${id}" class="stack-chips"></div></div>
      </div>`
  const $ = s => el.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const chip = (label, ok, title) => `<span class="stack-chip ${ok ? 'ok' : 'bad'}" ${title ? `title="${esc(title)}"` : ''}>${ok ? '●' : '○'} ${esc(label)}</span>`
  const listRow = (label, detail) => `<div class="stack-list-row"><b>${esc(label)}</b><span>${esc(detail || '')}</span></div>`
  const empty = t => `<span class="ds-empty">${esc(t)}</span>`

  function render(d) {
    if (!d) { $('#s-mach-' + id).textContent = 'unavailable'; return }
    const m = d.machine || {}
    const ramGb = (m.mem_kb || 0) / 1024 / 1024
    const diskUsedGb = (m.disk_used_kb || 0) / 1024 / 1024
    const diskTotalGb = (m.disk_total_kb || 0) / 1024 / 1024
    const up = m.uptime_secs || 0
    const upStr = up < 3600 ? `${fmtNum(up / 60)}m` : up < 86400 ? `${fmtNum(up / 3600)}h` : `${fmtNum(up / 86400)}d`
    $('#s-mach-' + id).innerHTML = [
      ['host', esc(m.hostname || '?')], ['os', esc(m.os || '?')], ['kernel', esc(m.kernel || '?')], ['arch', esc(m.arch || '?')],
      ['cpu', esc((m.cpu_model || '?').slice(0, 30))], ['cores', fmtNum(m.cores)], ['ram', fmtNum(ramGb) + ' GB'], ['up', upStr],
    ].map(([l, v]) => `<span><span class="k">${l}</span> <span class="v">${v}</span></span>`).join('')
    const net = d.network || {}
    $('#s-mach2-' + id).innerHTML = [
      ['disk', `${fmtNum(diskUsedGb)} / ${fmtNum(diskTotalGb)} GB`], ['load', esc(net.load_avg || m.load_avg || '?')],
      ['ip (priv)', esc(net.ip_priv || '?')], ['dns', esc((net.dns_servers || []).join(', ') || '?')],
    ].map(([l, v]) => `<span><span class="k">${l}</span> <span class="v">${v}</span></span>`).join('')

    const sec = d.security || {}
    const secOk = v => v === 'active'
    $('#s-sec-' + id).innerHTML = ['ssh', 'firewall', 'fail2ban'].map(k => chip(k, secOk(sec[k]), sec[k] || 'n/a')).join('')

    $('#s-gen-' + id).innerHTML = [
      ['nixos gen', d.nixos_gen ? '#' + esc(d.nixos_gen) : 'n/a'], ['hm gen', d.hm_gen ? '#' + esc(d.hm_gen) : 'n/a'],
    ].map(([l, v]) => `<span><span class="k">${l}</span> <span class="v">${v}</span></span>`).join('')

    $('#s-multios-' + id).innerHTML = (d.multi_os || []).map(o => listRow(o.label, o.detail)).join('') || empty('none configured')
    $('#s-boot-' + id).innerHTML = (d.bootloader || []).map(o => listRow(o.label, o.detail)).join('') || empty('none configured')
    $('#s-builders-' + id).innerHTML = (d.builders || []).map(o => listRow(o.label, o.detail)).join('') || empty('none configured')

    $('#s-flakes-' + id).innerHTML = (d.flakes || []).map(f => {
      const present = (d.repos || []).find(r => r.name === f.name)
      return `<tr><td class="n">${esc(f.name)}</td><td>${esc(f.visibility)}</td><td class="hier">${esc(f.role)}</td>` +
        `<td>${present && present.exists ? '<span style="color:#4ade80">●</span>' : '<span style="color:#f87171">○</span>'}</td></tr>`
    }).join('') || `<tr><td colspan="4" style="color:#6b7280">none configured</td></tr>`

    $('#s-gitst-' + id).innerHTML = (d.git_status || []).map(g =>
      `<tr><td class="n">${esc(g.name)}</td><td>${esc(g.branch || '?')}</td>` +
      `<td class="num${g.dirty_files ? ' hot' : ''}">${fmtNum(g.dirty_files)}</td><td class="hier">${esc(g.last_commit || '')}</td></tr>`
    ).join('') || `<tr><td colspan="4" style="color:#6b7280">no repos found</td></tr>`

    $('#s-tools-' + id).innerHTML = (d.tools || []).map(t => chip(t.name, t.available, t.version || 'not found')).join('') || empty('none configured')
    $('#s-gui-' + id).innerHTML = (d.gui_apps || []).map(t => chip(t.name, t.available, t.available ? 'in PATH' : 'not found')).join('') || empty('none configured')

    $('#s-envs-' + id).innerHTML = (d.env_groups || []).map(g =>
      `<div class="ibar"><span class="iu" style="width:70px">${esc(g.label)}</span><span class="stack-chips">` +
      (g.vars || []).map(v => chip(v.name, v.set)).join('') + `</span></div>`
    ).join('') || empty('none configured')

    const targets = (d.cloud_targets && d.cloud_targets.vms) || []
    $('#s-cloud-' + id).innerHTML = targets.map(t =>
      `<tr><td class="n">${esc(t.alias || '?')}</td><td>${esc(t.wg || '')}</td><td class="hier">${esc(t.label || '')}</td>` +
      `<td>${t.pub ? `<span style="color:#7dd3fc">${esc(t.pub)}</span>` : '·'}</td></tr>`
    ).join('') || `<tr><td colspan="4" style="color:#6b7280">no VMs configured</td></tr>`

    const cats = (d.cloud_targets && d.cloud_targets.service_categories) || []
    $('#s-cats-' + id).innerHTML = cats.map(c =>
      `<span class="stack-chip ok" title="${esc((c.match || []).join(', '))}">${esc(c.group)} · ${esc(c.cat)}</span>`
    ).join('') || empty('none configured')
  }
  async function load() {
    const d = await cachedInvoke('stack_info').catch(() => null)
    if (leaf.isConnected) render(d)
  }

  const cached = cachePeek('stack_info')
  if (cached) render(cached)   // instant paint from last session — "as of" comes from a real refresh
  return { load }
  },
  async refresh(api) { await api.load() },
})

// Monitor's own render() innerHTML-replaces #m-head every tick (host/os/
// clock line) — any button placed inside that div was silently destroyed
// (listeners and all) after the first render. The frame contract's toolbar
// lives outside the render target entirely, which fixes that as a side
// effect of the conversion, not just a refactor.
function makeMonitor(tabId) { return buildFrame('monitor', tabId) }
registerFrame({
  type: 'monitor',
  title: '📊 monitor',
  refreshMs: 1000,
  autoFirstOpen: true,   // fully local /proc reads — matches prior always-render-on-open
  make(el, ctx) {
  const { id, leaf } = ctx
  el.innerHTML = `
    <div class="mon">
      <div class="mon-head" id="m-head-${id}"></div>

      <div class="mon-row top">
        <div class="panel cpu"><div class="ph"><span>CPU</span><span class="sub" id="m-cpusub-${id}"></span></div>
          <div class="cpu-body">
            <div class="cpu-psi" id="m-cpupsi-${id}"></div>
            <canvas class="g" id="m-cpu-${id}"></canvas>
            <div class="gauge-wrap"><canvas id="m-cpugauge-${id}"></canvas><span class="glbl" id="m-cpuload-${id}"></span><span class="swapst" id="m-swapst-${id}"></span></div>
          </div></div>
        <div class="panel mem"><div class="ph"><span>MEMORY</span>
            <span style="margin-left:auto;display:flex;gap:8px;align-items:baseline">
              <span class="sub" id="m-memsub-${id}"></span>
              <button class="mbtn" id="m-clean-${id}" title="Free RAM via mem-reclaim: kills non-essential apps, spares this terminal + the KDE session">🧹 clean</button>
            </span></div>
          <div class="mem-body">
            <div class="seg" id="m-seg-${id}"></div>
            <div class="seg-legend" id="m-seglegend-${id}"></div>
            <div style="display:flex;gap:12px;flex:1 1 0;min-height:0;">
              <div class="mem-gauges" style="flex:0 0 auto;">
                <div class="gauge-wrap"><canvas id="m-ramg-${id}"></canvas></div>
                <div class="gauge-wrap"><canvas id="m-swapg-${id}"></canvas></div>
              </div>
              <div class="kv" id="m-memkv-${id}"></div>
            </div>
          </div></div>
      </div>

      <div class="mon-row cores-psi">
        <div class="panel cores-panel"><div class="ph"><span>CPU CORES</span><span class="sub" id="m-coresub-${id}"></span></div>
          <div class="cores" id="m-cores-${id}"></div></div>
        <div class="panel psi-panel"><div class="ph"><span>PRESSURE · PSI</span><span class="sub">% stalled · 10s avg</span></div>
          <div class="psi-hbars">
            <div class="psi-group">
              <div class="psi-gt">SOME <span class="psi-gsub">task stalled</span></div>
              <div class="psi-hrow"><span class="phlbl">CPU</span><div class="phtrack"><i id="m-psib-some-cpu-${id}"></i></div><span class="phval" id="m-psiv-some-cpu-${id}"></span></div>
              <div class="psi-hrow"><span class="phlbl">IO</span><div class="phtrack"><i id="m-psib-some-io-${id}"></i></div><span class="phval" id="m-psiv-some-io-${id}"></span></div>
              <div class="psi-hrow"><span class="phlbl">MEM</span><div class="phtrack"><i id="m-psib-some-mem-${id}"></i></div><span class="phval" id="m-psiv-some-mem-${id}"></span></div>
            </div>
            <div class="psi-group">
              <div class="psi-gt">FULL <span class="psi-gsub">all stalled</span></div>
              <div class="psi-hrow"><span class="phlbl">CPU</span><div class="phtrack"><i id="m-psib-full-cpu-${id}"></i></div><span class="phval" id="m-psiv-full-cpu-${id}"></span></div>
              <div class="psi-hrow"><span class="phlbl">IO</span><div class="phtrack"><i id="m-psib-full-io-${id}"></i></div><span class="phval" id="m-psiv-full-io-${id}"></span></div>
              <div class="psi-hrow"><span class="phlbl">MEM</span><div class="phtrack"><i id="m-psib-full-mem-${id}"></i></div><span class="phval" id="m-psiv-full-mem-${id}"></span></div>
            </div>
          </div></div>
      </div>

      <div class="mon-row pair">
        <div class="panel swap-panel"><div class="ph"><span>SWAP · ZRAM</span><span class="sub" id="m-swapsub-${id}"></span></div>
          <div class="kv" id="m-swapkv-${id}"></div></div>
        <div class="panel batt-panel"><div class="ph"><span>BATTERY</span><span class="sub" id="m-battsub-${id}"></span></div>
          <div class="batt" id="m-batt-${id}"></div></div>
      </div>

      <div class="mon-row trip">
        <div class="panel net"><div class="ph"><span>NETWORK</span><span class="sub" id="m-netsub-${id}"></span></div>
          <div class="netgraphs">
            <div class="ng"><div class="cap"><span class="dn">▼ DOWN</span><span class="rate" id="m-rx-${id}"></span></div><canvas class="g" id="m-net-rx-${id}"></canvas></div>
            <div class="ng"><div class="cap"><span class="up">▲ UP</span><span class="rate" id="m-tx-${id}"></span></div><canvas class="g" id="m-net-tx-${id}"></canvas></div>
          </div></div>
        <div class="panel disk"><div class="ph"><span>DISKS</span><span class="sub" id="m-diosub-${id}"></span></div>
          <div class="bars" id="m-disk-${id}"></div></div>
        <div class="panel temp"><div class="ph"><span>SENSORS</span></div>
          <div class="bars" id="m-temp-${id}"></div></div>
      </div>

      <div class="panel net-detail"><div class="ph"><span>INTERFACES</span><span class="sub">mesh · web · dns</span></div>
        <table class="ntbl"><thead><tr><th>IFACE</th><th>ADDRESS</th><th class="num">▼ RATE</th><th class="num">▲ RATE</th>
          <th class="num">▼ TOTAL</th><th class="num">▲ TOTAL</th><th class="num">PKTS ▼/▲</th><th class="num">ERR</th></tr></thead>
          <tbody id="m-niface-${id}"></tbody></table></div>

      <div class="panel proc"><div class="ph"><span id="m-prochdr-${id}">PROCESSES</span>
          <span class="proc-tools">
            <span class="ptbl-tabs" id="m-sort-${id}"><button data-s="cpu" class="on">CPU</button><button data-s="mem">MEM</button><button data-s="io">IO</button><button data-s="lineage">LINEAGE</button></span>
            <span class="ptbl-tabs" id="m-view-${id}"><button data-v="flat" class="on">FLAT</button><button data-v="tree">TREE</button></span>
            <button class="cpbtn" id="m-zombie-${id}" title="Reap zombie processes (SIGCHLD their parents)">🧟 reap</button>
            <button class="cpbtn" id="m-copy-${id}" title="Copy visible table (TSV)">⎘ copy</button>
          </span></div>
        <div class="psi-clean" id="m-psiclean-${id}">
          <button data-k="cpu" title="Kill the top CPU hog (user apps only) until CPU PSI ≤ 1%">🧹 Clean CPU-starving</button>
          <button data-k="mem" title="Kill the top MEM hog until MEM PSI ≤ 1%">🧹 Clean MEM-starving</button>
          <button data-k="io"  title="Kill the top IO hog until IO PSI ≤ 1%">🧹 Clean IO-starving</button>
          <button data-k="all" class="all" title="Diagnose the worst PSI and kill exactly that culprit">⚡ Clean All</button>
        </div>
        <div class="ptbl-wrap"><table class="ptbl proc-tbl">
          <thead><tr><th class="num">PID</th><th>USER</th><th class="num">CPU%</th><th class="num">MEM%</th><th class="num">IO</th><th class="num" title="Pressure of the process's cgroup (worst of cpu/io/mem)">PSI</th><th class="num">TIME+</th><th>NAME</th><th id="m-hierh-${id}">LINEAGE</th></tr></thead>
          <tbody id="m-proc-${id}"></tbody></table></div></div>
    </div>`
  const hist = { cpu: [], mem: [], rx: [], tx: [] }
  const coreHist = []
  let prevSwap = null                            // for swapping-activity detection
  let sortBy = 'cpu', viewMode = 'flat', lastS = null
  const expanded = new Set()            // pids with the detail row open
  const procIndex = new Map()           // pid → row (for detail / copy / kill)
  const $ = s => el.querySelector(s)
  const push = (a, v) => { a.push(v); if (a.length > MON_HIST) a.shift() }
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))

  // ── process table: flat (sorted by metric) or parent/child tree ──
  const zomb = st => /zomb/i.test(st || '')
  function psiMax(p) { const q = p.psi || {}; return Math.max(q.cpu || 0, q.io || 0, q.mem || 0) }
  function procRowHtml(p, tw) {
    const cc = p.cpu > 50 ? 'hot' : p.cpu > 10 ? 'warm' : ''
    const hier = zomb(p.status) ? '<span style="color:#f87171">zombie</span>' : esc((p.anc || []).join(' ▸ ')) || '—'
    const q = p.psi || {}, pm = psiMax(p), pc = pm > 20 ? 'hot' : pm > 5 ? 'warm' : ''
    const psiCell = p.psi ? `<td class="num ${pc}" title="cpu ${(q.cpu || 0).toFixed(1)}% · io ${(q.io || 0).toFixed(1)}% · mem ${(q.mem || 0).toFixed(1)}% (cgroup)">${pm.toFixed(1)}</td>` : `<td class="num st">·</td>`
    const open = expanded.has(p.pid)
    let h = `<tr class="prow${open ? ' open' : ''}" data-pid="${p.pid}">` +
      `<td class="num">${p.pid}</td><td class="u">${esc((p.user || '').slice(0, 9))}</td>` +
      `<td class="num ${cc}">${p.cpu.toFixed(1)}</td><td class="num">${(p.memp || 0).toFixed(1)}</td>` +
      `<td class="num">${p.io ? fmtRate(p.io) : '·'}</td>` +
      psiCell +
      `<td class="num st">${fmtTimeplus(p.time)}</td>` +
      `<td class="n">${tw ? '<span class="tw">' + tw + '</span>' : ''}${open ? '▾ ' : '▸ '}${esc(p.name)}</td>` +
      `<td class="hier">${hier}</td></tr>`
    if (open) {
      const kd = (k, v, cls) => `<span class="k">${k}</span><span class="v${cls ? ' ' + cls : ''}">${v}</span>`
      const started = p.start ? new Date(p.start * 1000).toLocaleString('en-GB') : '—'
      h += `<tr class="pdetail"><td colspan="9"><div class="pd">` +
        `<div class="cmd">$ ${esc(p.cmd || p.name)}</div>` +
        `<div class="pdrow"><span class="k">exe</span>${esc(p.exe || '—')}</div>` +
        `<div class="pdrow"><span class="k">cwd</span>${esc(p.cwd || '—')}</div>` +
        `<div class="pdkv">` +
          kd('ppid', p.ppid) + kd('status', esc(p.status), zomb(p.status) ? 'hot' : '') + kd('threads', p.threads || 0) +
          kd('cpu', p.cpu.toFixed(1) + '%', cc) + kd('mem', (p.memp || 0).toFixed(1) + '% · ' + fmtBytes(p.mem)) + kd('virt', fmtBytes(p.vms || 0)) +
          kd('io now', fmtRate(p.io || 0)) + kd('io read', fmtBytes(p.io_rt || 0)) + kd('io write', fmtBytes(p.io_wt || 0)) +
          kd('psi cpu', (q.cpu || 0).toFixed(1) + '%', q.cpu > 5 ? 'warm' : '') + kd('psi io', (q.io || 0).toFixed(1) + '%', q.io > 5 ? 'warm' : '') + kd('psi mem', (q.mem || 0).toFixed(1) + '%', q.mem > 5 ? 'warm' : '') +
          kd('started', started) + kd('runtime', fmtTimeplus(p.time)) + kd('lineage', esc((p.anc || []).join(' / ')) || '—') +
        `</div>` +
        `<div class="pdbtns"><button data-act="copy" data-pid="${p.pid}">⎘ copy info</button>` +
        `<button data-act="term" data-pid="${p.pid}" class="warn">◼ TERM · soft kill</button>` +
        `<button data-act="kill" data-pid="${p.pid}" class="crit">✕ KILL · force</button></div></div></td></tr>`
    }
    return h
  }
  function renderTree(all) {
    const kids = new Map(), byId = new Map()
    for (const p of all) byId.set(p.pid, p)
    for (const p of all) { const k = kids.get(p.ppid) || []; k.push(p); kids.set(p.ppid, k) }
    // roots = procs whose parent isn't in the set (or pid 1/0)
    const roots = all.filter(p => !byId.has(p.ppid) || p.ppid === p.pid).sort((a, b) => b.cpu - a.cpu)
    const out = []; const seen = new Set()
    const walk = (p, depth) => {
      if (seen.has(p.pid) || depth > 30) return; seen.add(p.pid)
      const tw = depth ? '│ '.repeat(depth - 1) + '├ ' : ''
      out.push(procRowHtml(p, tw))
      for (const c of (kids.get(p.pid) || []).sort((a, b) => b.cpu - a.cpu)) walk(c, depth + 1)
    }
    for (const r of roots) walk(r, 0)
    return out.join('')
  }
  function renderProcs() {
    const s = lastS; if (!s) return
    procIndex.clear()
    for (const p of (s.procs_all || [])) procIndex.set(p.pid, p)
    const hdr = $('#m-hierh-' + id)
    if (viewMode === 'tree') {
      if (hdr) hdr.textContent = 'LINEAGE'
      $('#m-proc-' + id).innerHTML = renderTree(s.procs_all || [])
    } else {
      let list
      if (sortBy === 'lineage') {
        // sort the FULL set alphabetically by user ▸ lineage ▸ own name — no
        // cap (the table scrolls; a fixed slice silently hid most processes).
        const key = p => ((p.user || '') + '/' + (p.anc || []).join('/') + '/' + (p.name || '')).toLowerCase()
        list = [...(s.procs_all || [])].sort((a, b) => key(a).localeCompare(key(b)))
      } else {
        list = sortBy === 'mem' ? s.procs_mem : sortBy === 'io' ? s.procs_io : s.procs
      }
      for (const p of (list || [])) procIndex.set(p.pid, p)   // ensure rows indexed
      $('#m-proc-' + id).innerHTML = (list || []).map(p => procRowHtml(p, '')).join('')
    }
    $('#m-prochdr-' + id).textContent = 'PROCESSES · ' + (s.nproc || 0) +
      (viewMode === 'tree' ? ' · tree' : ' · by ' + sortBy.toUpperCase())
  }

  // toolbar: sort toggle
  $('#m-sort-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    sortBy = b.dataset.s; viewMode = 'flat'
    for (const x of $('#m-sort-' + id).children) x.classList.toggle('on', x === b)
    for (const x of $('#m-view-' + id).children) x.classList.toggle('on', x.dataset.v === 'flat')
    renderProcs()
  })
  // toolbar: view-mode toggle (flat metrics vs parent/child tree)
  $('#m-view-' + id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    viewMode = b.dataset.v
    for (const x of $('#m-view-' + id).children) x.classList.toggle('on', x === b)
    renderProcs()
  })
  // copy the whole visible table as TSV
  $('#m-copy-' + id).addEventListener('click', () => {
    const s = lastS; if (!s) return
    const list = viewMode === 'tree' ? s.procs_all : (sortBy === 'mem' ? s.procs_mem : sortBy === 'io' ? s.procs_io : s.procs)
    const head = ['PID', 'PPID', 'USER', 'CPU%', 'MEM%', 'IO/s', 'PSI%', 'THR', 'TIME+', 'STATUS', 'NAME', 'LINEAGE', 'COMMAND'].join('\t')
    const rows = (list || []).map(p => [p.pid, p.ppid, p.user, p.cpu.toFixed(1), (p.memp || 0).toFixed(1),
      fmtRate(p.io || 0), psiMax(p).toFixed(1), p.threads || 0, fmtTimeplus(p.time), p.status, p.name, (p.anc || []).join('/'), p.cmd || p.name].join('\t'))
    clip.write([head, ...rows].join('\n'))
    const btn = $('#m-copy-' + id); const t = btn.textContent; btn.textContent = '✓ copied'; setTimeout(() => btn.textContent = t, 1200)
  })
  // row expand + per-process actions (copy / soft-kill / force-kill)
  $('#m-proc-' + id).addEventListener('click', e => {
    const act = e.target.closest('.pdbtns button')
    if (act) {
      const pid = +act.dataset.pid, p = procIndex.get(pid)
      if (act.dataset.act === 'copy' && p) {
        const q = p.psi || {}
        clip.write(`pid=${p.pid} ppid=${p.ppid} user=${p.user} status=${p.status} threads=${p.threads || 0}\n` +
          `cpu=${p.cpu.toFixed(1)}% mem=${(p.memp || 0).toFixed(1)}% (${fmtBytes(p.mem)}) virt=${fmtBytes(p.vms || 0)}\n` +
          `io now=${fmtRate(p.io || 0)} read=${fmtBytes(p.io_rt || 0)} write=${fmtBytes(p.io_wt || 0)}\n` +
          `psi cpu=${(q.cpu || 0).toFixed(1)}% io=${(q.io || 0).toFixed(1)}% mem=${(q.mem || 0).toFixed(1)}%\n` +
          `started=${p.start ? new Date(p.start * 1000).toLocaleString('en-GB') : '—'} runtime=${fmtTimeplus(p.time)}\n` +
          `exe: ${p.exe || '—'}\ncwd: ${p.cwd || '—'}\nlineage: ${(p.anc || []).join(' / ')}\ncmd: ${p.cmd || p.name}`)
        const t = act.textContent; act.textContent = '✓ copied'; setTimeout(() => act.textContent = t, 1200)
      } else if (act.dataset.act === 'term') { invoke('proc_kill', { pid, force: false }).catch(() => {}) }
      else if (act.dataset.act === 'kill') { invoke('proc_kill', { pid, force: true }).catch(() => {}) }
      return
    }
    const row = e.target.closest('.prow'); if (!row) return
    const pid = +row.dataset.pid
    expanded.has(pid) ? expanded.delete(pid) : expanded.add(pid)
    renderProcs()
  })
  // memory panic button — two-click confirm (it kills non-essential apps)
  {
    const b = $('#m-clean-' + id); let arm = false, t
    b.addEventListener('click', () => {
      if (!arm) { arm = true; b.textContent = '⚠ confirm'; b.classList.add('arm'); t = setTimeout(() => { arm = false; b.textContent = '🧹 clean'; b.classList.remove('arm') }, 3000); return }
      clearTimeout(t); arm = false; b.classList.remove('arm'); b.textContent = '… cleaning'
      invoke('mem_reclaim', { dry: false })
        .then(() => { b.textContent = '✓ freed'; setTimeout(() => b.textContent = '🧹 clean', 2500) })
        .catch(() => { b.textContent = '✗ failed'; setTimeout(() => b.textContent = '🧹 clean', 2500) })
    })
  }
  // zombie reaper — SIGCHLD the parents of any state-Z processes. A zombie
  // can't be killed (it's already dead, just an unreaped table entry) — the
  // only lever we have is nudging its PARENT to call wait(). That fails
  // outright for a root-owned parent (EPERM, no permission to signal it as
  // an unprivileged user) and isn't guaranteed even for same-uid parents
  // (SIGCHLD isn't queued — if the parent already dropped/ignored it,
  // resending changes nothing). Report the real outcome, not a fake success.
  $('#m-zombie-' + id).addEventListener('click', () => {
    const b = $('#m-zombie-' + id); b.textContent = '…'
    invoke('zombie_reap')
      .then(r => {
        const n = (r && r.zombies) || 0, nudged = (r && r.parents_nudged) || 0, denied = (r && r.parents_denied) || []
        b.title = denied.length ? `${denied.length} parent PID(s) refused signal (not owned by you): ${denied.join(', ')}` : ''
        b.textContent = !n ? '🧟 none' : denied.length ? `🧟 ${n} zombies, ${denied.length} blocked` : `🧟 ${n} nudged`
        setTimeout(() => { b.textContent = '🧟 reap'; b.title = '' }, 3500)
      })
      .catch(() => { b.textContent = '✗'; setTimeout(() => b.textContent = '🧟 reap', 2000) })
  })

  const poll = async () => {
    let s; try { s = await invoke('sys_stats') } catch (_) { return }
    if (!leaf.isConnected) return
    const clock = new Date().toLocaleTimeString('en-GB')

    // ── header ──
    const psiC = ((s.psi || {}).cpu || {}).some || {}
    $('#m-head-' + id).innerHTML =
      `<span><b>${esc(s.host || '')}</b></span>` +
      `<span><span class="k">os</span> <span class="val">${esc(s.os || '')}</span></span>` +
      `<span><span class="k">kernel</span> <span class="val">${esc(s.kernel || '')}</span></span>` +
      `<span><span class="k">up</span> <span class="val">${fmtUptime(s.uptime)}</span></span>` +
      `<span><span class="k">tasks</span> <span class="val">${fmtNum(s.running)} run · ${fmtNum(s.nproc)} total</span></span>` +
      `<span class="clock">${clock}</span>`

    // ── CPU + gauge ──
    push(hist.cpu, s.cpu)
    drawGraph($('#m-cpu-' + id), hist.cpu, 100)
    drawGauge($('#m-cpugauge-' + id), s.cpu, 'CPU')
    const ghz = s.cpu_freq ? (s.cpu_freq / 1000).toFixed(2) + 'GHz' : ''
    $('#m-cpusub-' + id).textContent = `${(s.cpu_name || '').slice(0, 40)} · ${s.pcpu || s.ncpu}c/${s.ncpu}t · ${ghz} · PSI ${(psiC.avg10 || 0).toFixed(1)}%`
    $('#m-cpuload-' + id).textContent = 'load ' + (s.load || []).map(x => x.toFixed(2)).join(' ')

    // CPU-box PSI: FULL 10s (big) + SOME 10s (small), bar scaled so 30% = full.
    // Numbers are the absolute avg10 %. cpu has no "full" → falls back to some.
    const psiAll = s.psi || {}
    const cpsi = (k, o) => {
      o = o || {}
      const full = (o.full && o.full.avg10 != null) ? o.full.avg10 : ((o.some && o.some.avg10) || 0)
      const some = (o.some && o.some.avg10) || 0
      const col = heat(Math.min(1, full / 30))
      return `<div class="cpsi-row"><div class="lbl">${k}</div>` +
        `<div class="full" style="color:${col}">${full.toFixed(1)}<span style="font-size:8px;color:#6b7280"> full</span></div>` +
        `<div class="track"><i style="width:${Math.min(100, full / 30 * 100).toFixed(0)}%;background:${col};color:${col}"></i></div>` +
        `<div class="some">some ${some.toFixed(1)}%</div></div>`
    }
    $('#m-cpupsi-' + id).innerHTML = cpsi('CPU', psiAll.cpu) + cpsi('IO', psiAll.io) + cpsi('MEM', psiAll.memory)
    // swapping status: swap growing (or high mem pressure) → swapping now.
    const swU = (s.mem || {}).swap_used || 0, swT = (s.mem || {}).swap_total || 0
    const memFull = (((psiAll.memory || {}).full || {}).avg10) || 0
    let swCls = 'ok', swTxt = 'no swap'
    if (swT) {
      if ((prevSwap != null && swU > prevSwap + 1048576) || memFull > 5) { swCls = 'crit'; swTxt = '⚠ swapping' }
      else if (swU > 0) { swCls = 'warn'; swTxt = 'swap ' + fmtBytes(swU) }
      else { swCls = 'ok'; swTxt = 'swap idle' }
    }
    prevSwap = swU
    const swEl = $('#m-swapst-' + id); if (swEl) { swEl.className = 'swapst ' + swCls; swEl.textContent = swTxt }

    // ── CPU cores: vertical bars (fill rises from bottom) ──
    const cores = s.cores || [], freqs = s.cores_freq || []
    if ($('#m-cores-' + id).childElementCount !== cores.length) {
      $('#m-cores-' + id).innerHTML = cores.map((_, i) =>
        `<div class="vcore" id="m-cv-${id}-${i}"><span class="vpct" id="m-cp-${id}-${i}"></span>` +
        `<div class="vtrack"><i id="m-cbar-${id}-${i}"></i></div><span class="vlbl">${i}</span></div>`).join('')
    }
    $('#m-coresub-' + id).textContent = cores.length + ' threads'
    cores.forEach((c, i) => {
      const col = heat(c / 100)
      const ib = $('#m-cbar-' + id + '-' + i); if (ib) { ib.style.height = Math.min(100, c) + '%'; ib.style.background = col; ib.style.color = col }
      $('#m-cp-' + id + '-' + i).textContent = c.toFixed(0)
      const cell = $('#m-cv-' + id + '-' + i); if (cell) cell.title = `CPU${i} · ${c.toFixed(0)}%` + (freqs[i] ? ` · ${(freqs[i] / 1000).toFixed(2)} GHz` : '')
    })

    // ── MEM: segment + gauges + full breakdown ──
    const m = s.mem, total = m.total || 1
    const buffers = m.buffers || 0, cached = m.cached || 0, used = m.used, free = m.free || 0
    const mp = used / total * 100
    push(hist.mem, mp)
    $('#m-memsub-' + id).textContent = fmtBytes(used) + ' / ' + fmtBytes(total)
    const seg = [
      ['used', used, 'hsl(0,72%,56%)'], ['cache', cached, 'hsl(190,72%,55%)'],
      ['buffers', buffers, 'hsl(45,80%,55%)'], ['free', Math.max(0, total - used - cached - buffers), 'hsl(150,30%,32%)'],
    ]
    $('#m-seg-' + id).innerHTML = seg.map(([, v, c]) => `<span style="width:${(v / total * 100).toFixed(2)}%;background:${c}"></span>`).join('')
    $('#m-seglegend-' + id).innerHTML = seg.map(([l, v, c]) => `<span><i style="background:${c}"></i>${l} ${fmtBytes(v)}</span>`).join('')
    drawGauge($('#m-ramg-' + id), mp, 'RAM')
    drawGauge($('#m-swapg-' + id), m.swap_total ? m.swap_used / m.swap_total * 100 : 0, 'SWAP')
    const kv = (k, v, hi) => `<span class="k">${k}</span><span class="v${hi ? ' hi' : ''}">${v}</span>`
    const zr = s.zram || []
    let zkv = ''
    if (zr.length) {
      const zOrig = zr.reduce((a, z) => a + (z.orig || 0), 0)
      const zUsed = zr.reduce((a, z) => a + (z.used || 0), 0)          // RAM actually consumed
      const zRatio = zUsed ? zOrig / zUsed : (zr[0].ratio || 0)
      zkv = `<span class="sec">ZRAM (compressed swap in RAM)</span>` +
        kv('stored', fmtBytes(zOrig), 1) + kv('in RAM', fmtBytes(zUsed)) +
        kv('ratio', '×' + zRatio.toFixed(2)) + kv('saved', fmtBytes(Math.max(0, zOrig - zUsed)))
    }
    $('#m-memkv-' + id).innerHTML =
      `<span class="sec">RAM</span>` +
      kv('total', fmtBytes(total), 1) + kv('used', fmtBytes(used)) + kv('available', fmtBytes(m.avail || 0)) +
      kv('cached', fmtBytes(cached)) + kv('buffers', fmtBytes(buffers)) + kv('free', fmtBytes(free)) +
      `<span class="sec">SWAP</span>` +
      kv('total', fmtBytes(m.swap_total || 0), 1) + kv('used', fmtBytes(m.swap_used || 0)) +
      kv('free', fmtBytes((m.swap_total || 0) - (m.swap_used || 0))) +
      zkv

    // ── PSI panel: horizontal bars, two groups (some/full) × 3 resources.
    // CPU has no "full" line in the kernel (stall-all-tasks makes no sense
    // for cpu) — its full bar just reads 0%. Fill % is scaled against a
    // 30%-stall ceiling so real-world pressure (rarely >10%) still reads. ──
    const psi = s.psi || {}
    const PSI_MAX = 30
    for (const [k, key] of [['cpu', 'cpu'], ['io', 'io'], ['mem', 'memory']]) {
      const r = psi[key] || {}
      for (const tag of ['some', 'full']) {
        const avg10 = (r[tag] || {}).avg10 || 0
        const bar = $(`#m-psib-${tag}-${k}-${id}`)
        if (bar) { const col = heat(1 - Math.min(1, avg10 / PSI_MAX)); bar.style.width = Math.min(100, avg10 / PSI_MAX * 100) + '%'; bar.style.background = col; bar.style.color = col }
        const val = $(`#m-psiv-${tag}-${k}-${id}`); if (val) val.textContent = avg10.toFixed(1) + '%'
      }
    }

    // ── SWAP · ZRAM breakdown ──
    const swaps = s.swaps || [], zram = s.zram || []
    let sk = ''
    if (swaps.length) { sk += `<span class="sec">SWAP DEVICES</span>`; for (const w of swaps) sk += kv(esc((w.name || '').split('/').pop()) + ' (' + w.kind + ')', fmtBytes(w.used) + ' / ' + fmtBytes(w.size)) }
    if (zram.length) { sk += `<span class="sec">ZRAM</span>`; for (const z of zram) sk += kv(esc(z.name) + ' ×' + (z.ratio || 0).toFixed(1), fmtBytes(z.orig) + ' → ' + fmtBytes(z.used), 1) }
    if (!sk) sk = `<span class="k">no swap / zram</span><span class="v">—</span>`
    $('#m-swapkv-' + id).innerHTML = sk
    $('#m-swapsub-' + id).textContent = zram.length ? 'zram ×' + (zram[0].ratio || 0).toFixed(1) : ''

    // ── BATTERY ──
    const pw = s.power || {}, bats = pw.batteries || []
    if (bats.length) {
      const b = bats[0]
      const charging = b.status === 'Charging', flowCls = charging ? 'in' : 'out'
      $('#m-batt-' + id).innerHTML =
        `<div class="bg"><canvas id="m-battg-${id}"></canvas></div>` +
        `<div class="bi"><b>${b.capacity}% · ${esc(b.status)}</b>` +
        `<span class="flow ${flowCls}">${charging ? '▲ charging' : '▼ draining'} ${(b.watts || 0).toFixed(1)} W</span>` +
        `<span>energy ${(b.energy || 0).toFixed(1)} / ${(b.energy_full || 0).toFixed(1)} Wh</span>` +
        `<span>${b.secs ? (charging ? 'full in ' : 'empty in ') + fmtUptime(b.secs) : ''}</span>` +
        `<span>AC ${pw.ac ? 'plugged' : 'unplugged'}</span></div>`
      drawGauge($('#m-battg-' + id), b.capacity, 'BATT')
      $('#m-battsub-' + id).textContent = pw.ac ? '⚡ AC' : 'on battery'
    } else {
      $('#m-batt-' + id).innerHTML = `<div class="bi"><b>${pw.ac ? '⚡ AC power' : 'no battery'}</b><span>desktop / no battery sensor</span></div>`
      $('#m-battsub-' + id).textContent = ''
    }

    // ── NET graphs ──
    let rx = 0, tx = 0, rxT = 0, txT = 0
    for (const nf of (s.net || [])) { rx += nf.rx; tx += nf.tx; rxT += nf.rx_total; txT += nf.tx_total }
    push(hist.rx, rx); push(hist.tx, tx)
    const nmax = Math.max(1, ...hist.rx, ...hist.tx)
    drawGraph($('#m-net-rx-' + id), hist.rx, nmax, 190)
    drawGraph($('#m-net-tx-' + id), hist.tx, nmax, 292)
    $('#m-rx-' + id).textContent = fmtRate(rx)
    $('#m-tx-' + id).textContent = fmtRate(tx)
    $('#m-netsub-' + id).textContent = 'Σ ▼' + fmtBytes(rxT) + ' ▲' + fmtBytes(txT)

    // ── NET per-interface table (mesh/web/dns/wg all shown) ──
    $('#m-niface-' + id).innerHTML = (s.net || []).map(nf => {
      const ip = (nf.ips || []).find(x => x.indexOf(':') === -1) || (nf.ips || [])[0] || '—'
      const err = (nf.rx_err || 0) + (nf.tx_err || 0)
      return `<tr><td class="if">${esc(nf.name)}</td><td class="ip" title="${esc((nf.ips || []).join(', '))} ${esc(nf.mac || '')}">${esc(ip)}</td>` +
        `<td class="num dn">${fmtRate(nf.rx)}</td><td class="num up">${fmtRate(nf.tx)}</td>` +
        `<td class="num">${fmtBytes(nf.rx_total)}</td><td class="num">${fmtBytes(nf.tx_total)}</td>` +
        `<td class="num">${nf.rx_pkts || 0}/${nf.tx_pkts || 0}</td>` +
        `<td class="num ${err ? 'err' : ''}">${err}</td></tr>`
    }).join('') || '<tr><td colspan="8" style="color:#6b7280">no interfaces</td></tr>'

    // ── DISKS + I/O ──
    const io = s.diskio || {}
    $('#m-diosub-' + id).textContent = 'R ' + fmtRate(io.read || 0) + ' · W ' + fmtRate(io.write || 0)
    $('#m-disk-' + id).innerHTML = (s.disks || []).map(d => {
      const u = d.total - d.avail, pc = d.total ? u / d.total * 100 : 0
      return bar(d.mount + (d.fs ? ' · ' + d.fs : ''), pc, fmtBytes(u) + '/' + fmtBytes(d.total) + ' ' + pc.toFixed(0) + '%')
    }).join('') || '<span style="color:#6b7280">no filesystems</span>'

    // ── SENSORS ──
    const temps = (s.temps || []).filter(t => t.temp > 0)
    $('#m-temp-' + id).innerHTML = temps.map(t => {
      const hi = t.crit || t.high || 100
      return bar(esc(t.label), t.temp / hi * 100, t.temp.toFixed(0) + '°C')
    }).join('') || '<span style="color:#6b7280">no sensors exposed</span>'

    // ── PROCESSES (flat metric or parent/child tree) ──
    lastS = s
    renderProcs()
  }
  // PSI-targeted reclaim buttons (CPU box): kill the top hog of a resource
  // until its PSI ≤ 1% (user apps only; SIGTERM). ALL = diagnose worst first.
  $('#m-psiclean-' + id).addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b || b.classList.contains('busy')) return
    const k = b.dataset.k, orig = b.textContent
    b.classList.add('busy'); b.textContent = '…killing'
    try {
      const r = k === 'all' ? await invoke('psi_clean_all') : await invoke('psi_clean', { kind: k, target: 1.0 })
      const n = (r.killed || []).length
      b.textContent = k === 'all' ? `⚡ ${r.diagnosed} · ${n}` : (n ? `✓ ${n} killed` : '✓ clear')
    } catch (_) { b.textContent = '✗ fail' }
    setTimeout(() => { b.classList.remove('busy'); b.textContent = orig }, 2800)
  })

  return { poll }
  },
  async refresh(api) { await api.poll() },
})

// ══ Journal Logs dashboard (no PTY) — stats on top, live feed below ══
const JPRIO = ['emerg', 'alert', 'crit', 'err', 'warn', 'notice', 'info', 'debug']
function jColor(p) { return p <= 3 ? '#f87171' : p === 4 ? '#fbbf24' : p === 5 ? '#22d3ee' : p === 6 ? '#9aa4b2' : '#5b6270' }
// classify a log entry by where it comes from (security / ssh / kernel / service / session)
const JCATS = ['security', 'ssh', 'kernel', 'service', 'session']
function jcat(r) {
  const u = (r.unit || '').toLowerCase()
  if (/sshd|ssh@|ssh\.service|openssh/.test(u)) return 'ssh'
  if (/sudo|polkit|audit|pam|login|logind|fail2ban|crowdsec|apparmor|firewall|nftables|auth/.test(u)) return 'security'
  if (/kernel/.test(u)) return 'kernel'
  if (r.src === 'user') return 'session'
  return 'service'
}
function jcatColor(c) { return { security: '#f87171', ssh: '#fb923c', kernel: '#a78bfa', service: '#22d3ee', session: '#7dd3fc' }[c] || '#9aa4b2' }
function jIntelBar(label, val, max, color) {
  const pct = max > 0 ? val / max * 100 : 0
  return `<div class="ibar"><span class="iu">${label}</span><span class="itrack"><i style="width:${pct.toFixed(0)}%;background:${color}"></i></span><span class="in">${val}</span></div>`
}
// Reference conversion to the frame contract (js/frame.js) — refresh
// button + auto-toggle are now injected uniformly by buildFrame(), so this
// dashboard only owns its OWN filter toolbar (scope/prio/search/copy) and
// data-fetch/render. See js/frame.js's header comment for the contract.
function makeJournal(tabId) { return buildFrame('journal', tabId) }
registerFrame({
  type: 'journal',
  title: '📜 journal',
  refreshMs: 5000,
  autoFirstOpen: true,   // local journal read (no network) — safe to load on open
  make(el, ctx) {
    const { id } = ctx
    el.innerHTML = `
      <div class="jrn-stats" id="j-stats-${id}"></div>
      <div class="jrn-bar" id="j-bar-${id}" title="log entries by priority"></div>
      <div class="jrn-intel">
        <div class="ip"><div class="ih">BY SOURCE · SECURITY / SSH / KERNEL</div><div class="ibars" id="j-cat-${id}"></div></div>
        <div class="ip"><div class="ih">BY IMPORTANCE · PRIORITY</div><div class="ibars" id="j-prio2-${id}"></div></div>
        <div class="ip"><div class="ih">TOP UNITS · VOLUME</div><div class="ilist" id="j-topu-${id}"></div></div>
        <div class="ip"><div class="ih">TOP ERROR SOURCES</div><div class="ilist" id="j-toperr-${id}"></div></div>
      </div>
      <div class="jrn-tools">
        <span class="ptbl-tabs" id="j-scope-${id}"><button data-v="all" class="on">ALL</button><button data-v="system">SYSTEM</button><button data-v="user">USER</button></span>
        <span class="ptbl-tabs" id="j-prio-${id}"><button data-v="all" class="on">ALL</button><button data-v="3">ERR</button><button data-v="4">WARN</button><button data-v="6">INFO</button></span>
        <input class="jrn-search" id="j-search-${id}" placeholder="🔍  filter unit / message…" autocomplete="off" spellcheck="false">
        <span class="jrn-count" id="j-count-${id}"></span>
        <button class="cpbtn" id="j-copy-${id}" title="Copy filtered feed">⎘</button>
      </div>
      <div class="jrn-feed" id="j-feed-${id}"></div>
    `
    let rows = [], scope = 'all', prio = 'all', q = ''
    const $ = s => el.querySelector(s)
    const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
    const passes = r => (scope === 'all' || r.src === scope) && (prio === 'all' || r.prio <= +prio) &&
      (!q || (r.unit + ' ' + r.msg).toLowerCase().indexOf(q) !== -1)
    const jt = t => { const d = new Date(t); return d.toLocaleTimeString('en-GB') + '.' + String(d.getMilliseconds()).padStart(3, '0') }

    function render() {
      let err = 0, warn = 0, info = 0, sys = 0, usr = 0; const hist = Array(8).fill(0)
      for (const r of rows) { hist[r.prio] = (hist[r.prio] || 0) + 1; if (r.prio <= 3) err++; else if (r.prio === 4) warn++; else info++; r.src === 'system' ? sys++ : usr++ }
      $('#j-stats-' + id).innerHTML = [['total', rows.length, ''], ['errors', err, 'err'], ['warnings', warn, 'warn'], ['info+', info, 'info'], ['system', sys, ''], ['user', usr, '']]
        .map(([l, n, c]) => `<div class="jstat ${c}"><span class="n">${n}</span><span class="l">${l}</span></div>`).join('')
      $('#j-bar-' + id).innerHTML = hist.map((c, p) => c ? `<i style="width:${(c / rows.length * 100).toFixed(2)}%;background:${jColor(p)}" title="${JPRIO[p]}: ${c}"></i>` : '').join('')

      // ── intelligence: where alerts come from, importance, noisiest + errors ──
      const cats = {}, units = {}, errUnits = {}
      for (const r of rows) {
        const c = jcat(r); cats[c] = (cats[c] || 0) + 1
        units[r.unit] = (units[r.unit] || 0) + 1
        if (r.prio <= 3) errUnits[r.unit] = (errUnits[r.unit] || 0) + 1
      }
      const maxCat = Math.max(1, ...JCATS.map(c => cats[c] || 0))
      $('#j-cat-' + id).innerHTML = JCATS.map(c => jIntelBar(c, cats[c] || 0, maxCat, jcatColor(c))).join('')
      const maxPr = Math.max(1, ...hist)
      $('#j-prio2-' + id).innerHTML = hist.map((c, p) => c ? jIntelBar(JPRIO[p], c, maxPr, jColor(p)) : '').join('')
      const topU = Object.entries(units).sort((a, b) => b[1] - a[1]).slice(0, 7)
      $('#j-topu-' + id).innerHTML = topU.map(([u, n]) => `<div class="il"><span class="iu" title="${esc(u)}">${esc(u)}</span><span class="in">${n}</span></div>`).join('') || '<div class="ds-empty">—</div>'
      const topE = Object.entries(errUnits).sort((a, b) => b[1] - a[1]).slice(0, 7)
      $('#j-toperr-' + id).innerHTML = topE.map(([u, n]) => `<div class="il"><span class="iu" title="${esc(u)}">${esc(u)}</span><span class="in" style="color:#f87171">${n}</span></div>`).join('') || '<div class="ds-empty" style="color:#4ade80">no errors 🎉</div>'

      const f = rows.filter(passes).slice(0, 800)
      $('#j-count-' + id).textContent = f.length + ' / ' + rows.length
      $('#j-feed-' + id).innerHTML = f.map(r =>
        `<div class="jline"><span class="jt">${jt(r.t)}</span>` +
        `<span class="jp" style="color:${jColor(r.prio)}">${JPRIO[r.prio] || r.prio}</span>` +
        `<span class="ju" title="${esc(r.unit)} · ${r.src} · pid ${r.pid}">${esc(r.unit)}</span>` +
        `<span class="jm">${esc(r.msg)}</span></div>`).join('')
    }
    const segClick = (sel, set) => $(sel).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return
      set(b.dataset.v); for (const x of $(sel).children) x.classList.toggle('on', x === b); render()
    })
    segClick('#j-scope-' + id, v => scope = v)
    segClick('#j-prio-' + id, v => prio = v)
    $('#j-search-' + id).addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render() })
    $('#j-copy-' + id).addEventListener('click', () => {
      const f = rows.filter(passes).slice(0, 800)
      clip.write(f.map(r => `${jt(r.t)} ${JPRIO[r.prio] || r.prio} ${r.src} ${r.unit}: ${r.msg}`).join('\n'))
      const b = $('#j-copy-' + id), t = b.textContent; b.textContent = '✓'; setTimeout(() => b.textContent = t, 1200)
    })
    return { setRows: r => { rows = r }, render }
  },
  async refresh(api) {
    let rows = []
    try { rows = await invoke('journal_feed', { n: 600 }) } catch (_) { rows = [] }
    api.setRows(rows)
    api.render()
  },
})

// ══ Cloud Control Center (no PTY) — VMs, containers, log center ══════
// Two-tier data: the local static topology (cloud_targets) always loads on
// open — cheap, no network. probe() is the heavy SSH/docker work and is
// what refresh()/the auto-toggle drive; it must NEVER fire just from the
// tab being opened (that was the root cause of an earlier "Cloud tab
// freezes on open" bug) — hence autoFirstOpen:false below.
function makeCloud(tabId) { return buildFrame('cloud', tabId) }
registerFrame({
  type: 'cloud',
  title: '☁ cloud',
  refreshMs: 10000,
  autoFirstOpen: false,
  make(el, ctx) {
  const { id, leaf } = ctx
  el.innerHTML = `
      <div class="cloud-vms" id="c-vms-${id}"></div>
      <div class="panel cloud-cont"><div class="ph"><span id="c-conthdr-${id}">CONTAINERS</span>
        <span class="proc-tools">
          <span class="ptbl-tabs" id="c-view-${id}"><button data-v="vm" class="on">BY VM</button><button data-v="service">BY SERVICE</button></span>
        </span></div>
        <div class="ptbl-wrap"><table class="ptbl ctbl">
          <thead><tr><th>NAME</th><th>VM</th><th>IMAGE</th><th>STATE</th><th class="num">CPU%</th><th class="num">MEM</th><th>PORTS</th></tr></thead>
          <tbody id="c-cont-${id}"></tbody></table></div></div>
      <div class="panel cloud-logs"><div class="ph"><span id="c-loghdr-${id}">LOG CENTER</span>
        <span class="proc-tools">
          <span class="ptbl-tabs" id="c-logsrc-${id}"><button data-v="system" class="on">SYSTEM</button><button data-v="container">CONTAINER</button></span>
          <select class="jrn-search" id="c-logcont-${id}" style="max-width:150px" title="Pick a container (CONTAINER mode)"><option value="">— pick container —</option></select>
          <input class="jrn-search" id="c-logq-${id}" placeholder="🔍  filter log lines…" autocomplete="off" spellcheck="false">
          <span class="ptbl-tabs" id="c-tail-${id}"><button data-v="100">100</button><button data-v="200" class="on">200</button><button data-v="500">500</button></span>
          <button class="cpbtn" id="c-logref-${id}" title="Reload logs">↻</button>
          <button class="cpbtn" id="c-logcopy-${id}" title="Copy logs">⎘</button>
        </span></div>
        <div class="cloud-logfeed" id="c-logfeed-${id}">select a VM or container…</div></div>`
  let targets = [], vms = {}, selVm = null, selCont = null, tail = 200, logq = '', logRaw = '', viewMode = 'vm', catMap = [], logSrc = 'system'
  const $ = s => el.querySelector(s)
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const contStat = (vm, name) => ((vms[vm] || {}).stats || {})[name] || {}
  const rowHtml = (c, vm) => {
    const st = c.State || '', cls = st === 'running' ? 'st-run' : st === 'exited' ? 'st-exit' : 'st-other', s = contStat(vm, c.Names)
    return `<tr class="${selCont === c.Names && selVm === vm ? 'sel' : ''}" data-cont="${esc(c.Names || '')}" data-vm="${esc(vm)}">` +
      `<td class="nm">${esc(c.Names || '')}</td><td class="ip">${esc(vm)}</td>` +
      `<td class="im">${esc((c.Image || '').slice(0, 28))}</td><td class="${cls}">${esc(st)}</td>` +
      `<td class="num">${esc(s.CPUPerc || '·')}</td><td class="num">${esc(s.MemPerc || '·')}</td>` +
      `<td style="color:#6b7280">${esc((c.Ports || '').slice(0, 26))}</td></tr>`
  }

  function renderVms() {
    $('#c-vms-' + id).innerHTML = targets.map(t => {
      const v = vms[t.alias] || {}, up = v.reachable
      const dot = up ? '#4ade80' : v.error ? '#f87171' : '#6b7280'
      const ping = v.ping
      const pcol = ping ? (ping.up ? '#4ade80' : '#f87171') : '#6b7280'
      return `<div class="vmcard ${selVm === t.alias ? 'sel' : ''}" data-vm="${esc(t.alias)}">
        <div class="vh"><span class="dot" style="color:${dot};background:${dot}"></span><span class="al">${esc(t.alias)}</span><span class="wg">${esc(t.wg || '')}</span></div>
        <div class="lbl">${esc(t.label || '')}</div>
        <div class="meta">${up
          ? `<span>⏱ <b>${esc(v.uptime || '?')}</b></span><span>📦 <b>${fmtNum(v.n_running)}</b>/${fmtNum(v.n_containers)}</span><span>💾 <b>${fmtNum(v.disk_pct)}%</b></span>`
          : `<span style="color:#6b7280">${esc((v.error || 'not probed — click ↻ probe')).slice(0, 40)}</span>`}
          ${ping ? `<span class="pill" style="color:${pcol};border-color:${pcol}">edge ${ping.code || '×'} · ${ping.ms || '?'}ms</span>` : ''}</div>
      </div>`
    }).join('')
  }
  function renderConts() {
    const tb = $('#c-cont-' + id)

      for (const t of targets) { const v = vms[t.alias]; if (v && v.containers) for (const c of v.containers) all.push({ c, vm: t.alias }) }
      $('#c-conthdr-' + id).textContent = 'CONTAINERS · by service · ' + all.length
      let html = ''; const used = new Set()
      for (const m of catMap) {
        const rows = all.filter(x => !used.has(x.vm + '/' + x.c.Names) && (m.match || []).some(p => (x.c.Names || '').toLowerCase().indexOf(p) !== -1))
        if (!rows.length) continue
        rows.forEach(x => used.add(x.vm + '/' + x.c.Names))
        rows.sort((a, b) => (a.c.Names || '').localeCompare(b.c.Names || ''))
        html += `<tr class="catrow"><td colspan="7">${esc(m.group)} · ${esc(m.cat)} · ${rows.length}</td></tr>` + rows.map(x => rowHtml(x.c, x.vm)).join('')

      tb.innerHTML = html || '<tr><td colspan="7" style="color:#6b7280">no containers (probe first)</td></tr>'
    } else {
      // BY VM: every VM gets its own grouped table section (same catrow

        const v = vms[t.alias]
