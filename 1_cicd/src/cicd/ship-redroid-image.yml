name: "Ship → Redroid baked image (apps + layout + theme baked into GHCR image)"

# Builds the redroid-cloud image with the Cloud app set BAKED IN as system apps + the baked
# Launcher3 layout/theme (system-app bake — NO Android boot, since GitHub-hosted runners have
# no binder and cannot boot redroid). `build.sh bake` fetches the APK set, lays them into
# /system/app, extracts launcher activities statically (aapt), pre-renders the layout SQL, and
# docker-builds da_redroid/src/Dockerfile; `verify` statically asserts every app+layout is in
# the image; then push to GHCR. Runtime = `build.sh up` (pull+run); apps install at boot and
# the seed applies layout+theme on first boot.

on:
  push:
    branches: [main]
    paths:
      - "da_redroid/build.json"
      - "da_redroid/src/**"
      - "da_redroid/build.sh"
      - ".github/workflows/ship-redroid-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the /data snapshot + image are large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install Nix (for the reproducible F-Droid/GitHub APK fetch + aapt)
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bake the redroid-cloud image (boot + provision + snapshot + docker build)
        working-directory: da_redroid
        run: ./build.sh bake

      - name: Verify the baked image (fresh boot → 58 apps + layout present)
        working-directory: da_redroid
        run: ./build.sh verify

      - name: Push to GHCR
        working-directory: da_redroid
        run: ./build.sh push
