name: "Ship → Desktop home-manager closure (build remotely, never freeze the laptop)"

# WHY: the full Plasma home-manager config is a heavy KDE eval that over-commits
# RAM on the 8GB Surface and can thrash into a freeze (same axis as the NixOS
# system freeze). Build it on a GHA x86 runner; the laptop only IMPORTS +
# activates the prebuilt closure (no eval) via `build.sh pull`.
#
# ALL logic in ba_flakes_desktop/build.sh (verb: ci-build). Thin YAML.
# x86_64 home config -> native x86 runner (no QEMU). Secrets are decrypted at
# activation on the device, so the build needs none.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ba_flakes_desktop/src/**"
      - "ba_flakes_desktop/build.sh"
      - "1_cicd/src/cicd/ship_nix-flakes_desktop_hm.yaml"

permissions:
  contents: write        # upload the incremental nix cache as a Release asset
  packages: write        # push the incremental layered HM cache image to GHCR

concurrency:
  group: ship-desktop-hm
  # QUEUE, don't cancel: the closure build takes ~20 min, so cancel-in-progress
  # meant it never completed during active pushes (every new commit killed the
  # in-flight build). `switch` consumes the latest SUCCESSFUL run, so a queued
  # build finishing a commit or two behind HEAD is fine — a completed artifact
  # beats a perpetually-cancelled one.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The HM closure is ~24GB realised; ubuntu-latest ships only ~14GB free on
      # / so the sops-install-secrets Go build hit "no space left on device"
      # (2026-07-16, run 29506574808). Reclaim the ~20-30GB of preinstalled
      # toolchains we never use (Android SDK, .NET, GHC, tool-cache, docker
      # images) before the build.
      #
      # 2026-08-22: large-packages and swap-storage turned ON. They were left
      # off as "slow / risky", but the build was failing with
      # "zstd: error 70 : Write error : cannot write block : Broken pipe" -
      # the runner filling up mid-compression, which reads like a corrupt
      # archive rather than an out-of-disk. A slower job that finishes beats a
      # fast one that does not, and swap costs disk we now have.
      - name: Free up runner disk (large HM closure needs headroom)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build + export home-manager closure (+ push incremental GHCR cache)
        env:
          GHCR_PUSH: "1"                       # build.sh also builds+pushes the layered cache image
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HM_CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/unix-hm-cache
        run: ./ba_flakes_desktop/build.sh ci-build

      # ── Incremental nix cache → GHCR per-path OCI blobs (2026-07-16) ───────
      # Prior transports all failed on the real 5.3GB custom set: gh-pages (git
      # rejects the large push), Release asset (2GiB/asset cap), and a monolith
      # can't be incremental anyway. build.sh nixcache-publish exports each
      # CUSTOM store path to its own zstd blob and `oras push`es them to GHCR as
      # one artifact (layer title = store hash, toplevel on a manifest
      # annotation). GHCR content-addresses blobs → unchanged paths dedup across
      # builds; the desktop switch fetches ONLY blobs for paths it lacks (true
      # per-change delta). No size cap, no monolith. Engine does the work.
      - name: Publish incremental nix cache to GHCR (per-path OCI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./ba_flakes_desktop/build.sh nixcache-publish

      - uses: actions/upload-artifact@v4
        with:
          name: nixos-desktop-hm-closure
          path: ba_flakes_desktop/dist-ci/
          retention-days: 7
          compression-level: 0
