name: "Ship → Waydroid container image (sway+Sunshine GPU stream stack) to GHCR"

# Builds the waydroid-container image (Debian bookworm + waydroid + headless sway +
# Sunshine primary transport + wayvnc fallback) via the project's own engine
# (`build.sh build` — data-driven from build.json, including the sha256-pinned
# Sunshine .deb) and pushes it to GHCR. Runtime machines never build locally:
# `build.sh up` pulls the released image (pull-first logic in _ensure_running).
# No Android boot happens here — GitHub runners have no binder; the image only
# packages the host-side stack, waydroid init runs on first container start.

on:
  push:
    branches: [main]
    paths:
      - "da_waydroid-container/build.json"
      - "da_waydroid-container/src/**"
      - "da_waydroid-container/build.sh"
      - ".github/workflows/ship-waydroid-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image (engine-driven, sha256-pinned Sunshine deb)
        working-directory: da_waydroid-container
        run: ./build.sh build

      - name: Push to GHCR
        working-directory: da_waydroid-container
        run: ./build.sh push
