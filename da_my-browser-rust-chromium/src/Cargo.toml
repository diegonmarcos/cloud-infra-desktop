[package]
name = "my-browser-rust-chromium"
version = "0.0.1"
edition = "2021"
description = "Rust UI + Chromium (CEF) backend browser"

[[bin]]
name = "my-browser-rust-chromium"
path = "main.rs"

[dependencies]
# browser-window: Rust GUI toolkit that hosts a real browser view. The `cef`
# feature backs it with libcef (real Chromium + BoringSSL) → clean Chrome
# fingerprint. (Other features webkitgtk/edge2 exist but WOULD get flagged —
# cef is mandatory here.) This is the fastest path to a Rust-driven window
# rendering pages with the correct fingerprint; the qute-parity chrome bar +
# vim keybinds get ported on top (from antoyo/titanium).
browser-window = { version = "0.12", default-features = false, features = ["cef"] }
