# ╔══════════════════════════════════════════════════════════════════╗
# ║ Diego's Dev Environment — docker compose profiles                ║
# ║                                                                  ║
# ║ Profiles:                                                        ║
# ║   cli   — headless (VMs, SSH, rescue, CI)                        ║
# ║   gui   — desktop integration (X11/Wayland/GPU/audio/clipboard)  ║
# ║   tty   — non-interactive (scripts, Dagu, cron)                  ║
# ║                                                                  ║
# ║ Usage:                                                           ║
# ║   docker compose --profile cli up      # interactive shell       ║
# ║   docker compose --profile gui up      # desktop integrated      ║
# ║   docker compose run --rm tty cmd      # run command and exit    ║
# ║                                                                  ║
# ║ Preferred: sh ~/git/tools/dtk.sh containers {cli|gui|tty}        ║
# ╚══════════════════════════════════════════════════════════════════╝

x-common: &common
  image: ghcr.io/diegonmarcos/diego-user-env:latest
  build:
    context: .
    dockerfile: Containerfile
  user: "1000:1000"
  working_dir: /home/diego
  network_mode: host
  privileged: true
  environment:
    - HOME=/home/diego
    - USER=diego
    - TERM=xterm-256color
    - LANG=en_US.UTF-8
    - PATH=/home/diego/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin:/sbin
  volumes:
    - ${HOME:-/home/diego}:/home/diego
    - /var/run/docker.sock:/var/run/docker.sock
  labels:
    diego.managed-by: "dtk.sh"
    diego.image: "diego-user-env"

services:
  # ── CLI: headless dev environment ────────────────────────────────
  cli:
    <<: *common
    container_name: diego-cli
    hostname: ${HOSTNAME:-dev}-cli
    stdin_open: true
    tty: true
    pid: host
    volumes:
      - ${HOME:-/home/diego}:/home/diego
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/wireguard:/etc/wireguard:ro
      - /opt:/opt
    profiles: [cli]

  # ── GUI: full desktop integration (distrobox-equivalent) ─────────
  gui:
    <<: *common
    container_name: diego-gui
    hostname: ${HOSTNAME:-dev}-gui
    stdin_open: true
    tty: true
    pid: host
    ipc: host
    security_opt:
      - label=disable
      - apparmor=unconfined
    environment:
      - HOME=/home/diego
      - USER=diego
      - TERM=xterm-256color
      - LANG=en_US.UTF-8
      - DISPLAY=${DISPLAY:-}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/1000}
      - DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-}
      - PULSE_SERVER=${PULSE_SERVER:-}
      - SHELL=fish
      - PATH=/home/diego/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin:/sbin
    volumes:
      - ${HOME:-/home/diego}:/home/diego:rslave
      - /tmp:/tmp:rslave
      - /dev:/dev:rslave
      - /sys:/sys:rslave
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}:rslave
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/wireguard:/etc/wireguard:ro
      - /opt:/opt
      - /nix:/nix
      - /var/log/journal:/var/log/journal
      - /etc/hosts:/etc/hosts:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - /etc/hostname:/etc/hostname:ro
    profiles: [gui]

  # ── TTY: non-interactive (CI, scripts, Dagu, cron) ──────────────
  tty:
    <<: *common
    container_name: diego-tty
    hostname: ${HOSTNAME:-dev}-tty
    pid: host
    volumes:
      - ${HOME:-/home/diego}:/home/diego
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/wireguard:/etc/wireguard:ro
      - /opt:/opt
    profiles: [tty]
