<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- my-konsole — Rust Konsole alternative. Breeze-dark terminal window with a
       tab strip (its identity: tabbed terminal) and an accent >_ prompt. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31363b"/>
      <stop offset="1" stop-color="#232629"/>
    </linearGradient>
  </defs>
  <rect x="24" y="36" width="208" height="184" rx="22" fill="url(#g)" stroke="#3daee9" stroke-width="4"/>
  <!-- tab strip -->
  <rect x="24" y="36" width="208" height="34" rx="22" fill="#2a2e32"/>
  <rect x="24" y="52" width="208" height="18" fill="#2a2e32"/>
  <rect x="40" y="46" width="70" height="24" rx="7" fill="#232629" stroke="#3daee9" stroke-width="2.5"/>
  <rect x="118" y="49" width="60" height="21" rx="6" fill="#31363b"/>
  <!-- prompt -->
  <g stroke="#3daee9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="58,120 92,146 58,172"/>
  </g>
  <rect x="112" y="160" width="74" height="13" rx="6.5" fill="#11d116"/>
</svg>
