<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>File Browser</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg-sidebar: #0f1729;
  --border: #2a3a5e;
  --text: #e0e0e0;
  --text-dim: #8899aa;
  --accent: #00d68f;
  --link: #5bc0eb;
  --mono: 'Courier New', Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#sidebar h1 {
  font-size: 14px;
  color: var(--accent);
  padding: 16px 16px 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.search-box {
  padding: 0 12px 10px;
  border-bottom: 1px solid var(--border);
}

.search-box input[type="text"] {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
}

.search-box input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

.search-toggles {
  display: flex;
  gap: 10px;
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-dim);
}

.search-toggles label {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
}

.search-toggles input[type="radio"] { accent-color: var(--accent); }

.path-bar {
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}

.path-bar a {
  color: var(--link);
  text-decoration: none;
  cursor: pointer;
}

.path-bar a:hover { text-decoration: underline; }
.path-bar .sep { color: #484f58; margin: 0 2px; }

#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.file-entry {
  display: block;
  padding: 6px 16px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.1s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-entry:hover {
  color: var(--text);
  background: rgba(255,255,255,0.03);
}

.file-entry.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0,214,143,0.05);
}

.file-entry.is-dir { color: var(--link); }
.file-entry.is-dir:hover { color: #7dd3fc; }

.file-icon { margin-right: 6px; }

#sidebar .meta {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-dim);
}

#right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#viewer-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  min-height: 32px;
}

#viewer-path {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.toolbar-actions {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}

.toggle-label {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-dim);
  font-size: 11px;
}

.toggle-label input[type="checkbox"] { accent-color: var(--accent); }

#viewer {
  flex: 1;
  border: none;
  background: var(--bg);
  width: 100%;
}

.no-results {
  padding: 16px;
  color: var(--text-dim);
  font-size: 12px;
  font-style: italic;
}

html { min-width: 900px; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>File Browser</h1>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search..." autocomplete="off">
    <div class="search-toggles">
      <label><input type="radio" name="smode" value="filename" checked> Filename</label>
      <label><input type="radio" name="smode" value="content"> Content</label>
    </div>
  </div>
  <div class="path-bar" id="path-bar">/</div>
  <div id="file-list"></div>
  <div class="meta" id="meta">http-dev &middot; <a style="color:var(--link)" href="/" target="_self">classic view</a></div>
</div>

<div id="right-panel">
  <div id="viewer-toolbar">
    <span id="viewer-path"></span>
    <div class="toolbar-actions">
      <label class="toggle-label"><input type="checkbox" id="raw-toggle"> Raw</label>
    </div>
  </div>
  <iframe id="viewer" src="about:blank"></iframe>
</div>

<script>
let currentDir = '/';

async function api(endpoint, params) {
  const qs = new URLSearchParams(params);
  const res = await fetch('/__api__/' + endpoint + '?' + qs);
  return res.json();
}

async function loadDir(path) {
  currentDir = path;
  document.getElementById('search').value = '';
  updatePathBar();
  const entries = await api('ls', { path });
  renderEntries(entries, false);
}

function renderEntries(entries, isSearch) {
  const list = document.getElementById('file-list');
  list.innerHTML = '';

  // Parent dir link
  if (!isSearch && currentDir !== '/') {
    const parent = currentDir.replace(/\/[^/]+\/?$/, '') || '/';
    const el = mkEntry('&#128193;', '../', true);
    el.addEventListener('click', () => loadDir(parent));
    list.appendChild(el);
  }

  if (!entries.length) {
    list.innerHTML = '<div class="no-results">' + (isSearch ? 'No results' : 'Empty directory') + '</div>';
    return;
  }

  for (const e of entries) {
    const name = isSearch ? e.path : e.name;
    const icon = e.isDir ? '&#128193;' : fileIcon(name);
    const el = mkEntry(icon, name, e.isDir);

    if (e.isDir) {
      const dirPath = isSearch
        ? (currentDir === '/' ? '/' + e.path : currentDir + '/' + e.path)
        : (currentDir === '/' ? '/' + e.name : currentDir + '/' + e.name);
      el.addEventListener('click', () => loadDir(dirPath));
    } else {
      const filePath = isSearch
        ? (currentDir === '/' ? '/' + e.path : currentDir + '/' + e.path)
        : (currentDir === '/' ? '/' + e.name : currentDir + '/' + e.name);
      el.addEventListener('click', () => openFile(filePath, el));
    }
    list.appendChild(el);
  }
}

function mkEntry(icon, name, isDir) {
  const el = document.createElement('div');
  el.className = 'file-entry' + (isDir ? ' is-dir' : '');
  el.innerHTML = '<span class="file-icon">' + icon + '</span>' + esc(name);
  return el;
}

let currentFilePath = null;

function openFile(path, el) {
  document.querySelectorAll('.file-entry.active').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');
  currentFilePath = path;
  document.getElementById('viewer-path').textContent = path;
  document.getElementById('raw-toggle').checked = false;
  loadViewer(path, false);
}

function loadViewer(path, raw) {
  const src = raw ? path + (path.includes('?') ? '&' : '?') + 'raw' : path;
  document.getElementById('viewer').src = src;
}

document.getElementById('raw-toggle').addEventListener('change', (e) => {
  if (currentFilePath) loadViewer(currentFilePath, e.target.checked);
});

function updatePathBar() {
  const bar = document.getElementById('path-bar');
  const parts = currentDir.split('/').filter(Boolean);
  let html = '<a onclick="loadDir(\'/\')">~</a>';
  let href = '';
  parts.forEach(p => {
    href += '/' + p;
    const h = href;
    html += '<span class="sep">/</span><a onclick="loadDir(\'' + h + '\')">' + esc(p) + '</a>';
  });
  bar.innerHTML = html;
}

// ── Search ──
let searchDebounce;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => runSearch(e.target.value.trim()), 300);
});

async function runSearch(q) {
  if (!q) { loadDir(currentDir); return; }
  const mode = document.querySelector('input[name="smode"]:checked').value;
  // Search recursively from root, not just current dir
  const results = await api('search', { q, mode, path: '/' });
  renderEntries(results, true);
}

function fileIcon(name) {
  if (name.endsWith('.json') || name.endsWith('.secrets')) return '&#128196;';
  if (name.endsWith('.md')) return '&#128220;';
  if (name.endsWith('.html')) return '&#127760;';
  if (name.endsWith('.nix')) return '&#9881;';
  if (name.endsWith('.yaml') || name.endsWith('.yml')) return '&#128203;';
  if (name.endsWith('.sh') || name.endsWith('.fish')) return '&#9654;';
  if (name.endsWith('.ts') || name.endsWith('.js') || name.endsWith('.mjs')) return '&#128187;';
  if (name.endsWith('.rs')) return '&#9881;';
  if (name.endsWith('.css') || name.endsWith('.scss')) return '&#127912;';
  if (name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.svg')) return '&#128247;';
  return '&#128196;';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Init from hash (directory redirects set #/path)
const initDir = decodeURIComponent(location.hash.slice(1)) || '/';
loadDir(initDir);
window.addEventListener('hashchange', () => {
  const dir = decodeURIComponent(location.hash.slice(1)) || '/';
  if (dir !== currentDir) loadDir(dir);
});
</script>
</body>
</html>
