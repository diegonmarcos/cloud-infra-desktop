<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>File Browser</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg-card: #16213e;
  --bg-sidebar: #0f1729;
  --bg-head: #0f3460;
  --bg-row-alt: #1b2a4a;
  --border: #2a3a5e;
  --text: #e0e0e0;
  --text-dim: #8899aa;
  --accent: #00d68f;
  --link: #5bc0eb;
  --mono: 'Courier New', Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  overflow-y: auto;
}

#sidebar h1 {
  font-size: 14px;
  color: var(--accent);
  padding: 16px 16px 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.search-box {
  padding: 0 12px 10px;
  border-bottom: 1px solid var(--border);
}

.search-box input[type="text"] {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
}

.search-box input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}

.search-toggles {
  display: flex;
  gap: 10px;
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-dim);
}

.search-toggles label {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
}

.search-toggles input[type="radio"] { accent-color: var(--accent); }

.path-bar {
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}

.path-bar a {
  color: var(--link);
  text-decoration: none;
  cursor: pointer;
}

.path-bar a:hover { text-decoration: underline; }

.path-bar .sep { color: #484f58; margin: 0 2px; }

#file-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}

.file-entry {
  display: block;
  padding: 6px 16px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.1s;
}

.file-entry:hover {
  color: var(--text);
  background: rgba(255,255,255,0.03);
}

.file-entry.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(0,214,143,0.05);
}

.file-entry.is-dir { color: var(--link); }

.file-icon { margin-right: 6px; }

#sidebar .meta {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
}

#main {
  margin-left: 280px;
  flex: 1;
  padding: 24px 32px;
  min-width: 0;
}

#main h2 {
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

pre.file-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  font-size: 12px;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  max-height: 80vh;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-bottom: 8px;
}

thead th {
  background: var(--bg-head);
  color: var(--text);
  padding: 8px 12px;
  text-align: left;
  font-weight: bold;
  border: 1px solid var(--border);
  position: sticky;
  top: 0;
  white-space: nowrap;
}

tbody td {
  padding: 6px 12px;
  border: 1px solid var(--border);
  vertical-align: top;
  max-width: 500px;
  overflow-wrap: break-word;
}

tbody tr:nth-child(even) { background: var(--bg-row-alt); }
tbody tr:hover { background: rgba(0,214,143,0.05); cursor: pointer; }
tbody tr.row-copied { background: rgba(0,214,143,0.2); transition: background 0.3s; }

.copy-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  margin-left: 8px;
  vertical-align: middle;
  transition: all 0.15s;
  font-family: var(--mono);
}

.copy-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(0,214,143,0.1); }
.copy-btn.copied { color: var(--accent); border-color: var(--accent); }

.val-null { color: #555; }
.val-number { color: #f0a500; }
.val-bool-true { color: var(--accent); }
.val-bool-false { color: #ff6b6b; }

.loading { color: var(--text-dim); padding: 40px; text-align: center; }
.error { color: #ff6b6b; padding: 20px; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); border-radius: 4px; }

.secret-badge {
  font-size: 10px;
  color: #ff6b6b;
  background: rgba(255,107,107,0.15);
  border: 1px solid rgba(255,107,107,0.3);
  border-radius: 3px;
  padding: 2px 6px;
  vertical-align: middle;
  letter-spacing: 1px;
}

html { min-width: 900px; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>File Browser</h1>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search..." autocomplete="off">
    <div class="search-toggles">
      <label><input type="radio" name="smode" value="filename" checked> Filename</label>
      <label><input type="radio" name="smode" value="content"> Content</label>
    </div>
  </div>
  <div class="path-bar" id="path-bar">/</div>
  <div id="file-list"></div>
  <div class="meta" id="meta">http-dev</div>
</div>

<div id="main">
  <div class="loading">Select a file or folder</div>
</div>

<script>
let currentDir = '/';
let currentFile = null;

async function api(endpoint, params) {
  const qs = new URLSearchParams(params);
  const res = await fetch('/__api__/' + endpoint + '?' + qs);
  return res.json();
}

async function loadDir(path) {
  currentDir = path;
  updatePathBar();
  const entries = await api('ls', { path });
  const list = document.getElementById('file-list');
  list.innerHTML = '';

  if (path !== '/') {
    const parent = path.replace(/\/[^/]+\/?$/, '') || '/';
    const el = document.createElement('div');
    el.className = 'file-entry is-dir';
    el.innerHTML = '<span class="file-icon">&#128193;</span>../';
    el.addEventListener('click', () => loadDir(parent));
    list.appendChild(el);
  }

  for (const e of entries) {
    const el = document.createElement('div');
    el.className = 'file-entry' + (e.isDir ? ' is-dir' : '');
    const icon = e.isDir ? '&#128193;' : fileIcon(e.name);
    el.innerHTML = '<span class="file-icon">' + icon + '</span>' + esc(e.name);
    const childPath = path === '/' ? '/' + e.name : path + '/' + e.name;
    if (e.isDir) {
      el.addEventListener('click', () => loadDir(childPath));
    } else {
      el.addEventListener('click', () => loadFile(childPath, el));
    }
    list.appendChild(el);
  }
}

async function loadFile(path, el) {
  currentFile = path;
  document.querySelectorAll('.file-entry.active').forEach(e => e.classList.remove('active'));
  if (el) el.classList.add('active');

  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const data = await api('read', { path });
    if (data.error) { main.innerHTML = '<div class="error">' + esc(data.error) + '</div>'; return; }

    main.innerHTML = '';
    const h2 = document.createElement('h2');
    h2.textContent = path.split('/').pop();

    // Secrets badge
    if (path.includes('.secrets')) {
      const badge = document.createElement('span');
      badge.className = 'secret-badge';
      badge.textContent = 'DECRYPTED';
      h2.appendChild(document.createTextNode(' '));
      h2.appendChild(badge);
    }
    main.appendChild(h2);

    // Try JSON rendering
    if (data.ext === '.json' || data.ext === '.secrets') {
      try {
        const json = JSON.parse(data.content);
        renderJSON(main, json, path.includes('.secrets'));
        return;
      } catch {}
    }

    // Plain text / code
    const pre = document.createElement('pre');
    pre.className = 'file-content';
    pre.textContent = data.content;
    main.appendChild(pre);
  } catch (e) {
    main.innerHTML = '<div class="error">Failed to load file</div>';
  }
}

function renderJSON(container, data, isSecret) {
  if (Array.isArray(data)) {
    container.appendChild(renderArrayTable(data, isSecret));
  } else if (typeof data === 'object' && data !== null) {
    const vals = Object.values(data);
    const isFlat = vals.length && vals.every(v => typeof v !== 'object' || v === null);
    if (isFlat) {
      container.appendChild(renderKVTable(data, isSecret));
    } else {
      for (const [key, val] of Object.entries(data)) {
        const section = document.createElement('div');
        section.style.marginBottom = '20px';
        const h3 = document.createElement('h3');
        h3.style.cssText = 'color:var(--link);font-size:13px;text-transform:uppercase;margin-bottom:8px';
        h3.textContent = key;
        section.appendChild(h3);
        if (Array.isArray(val)) section.appendChild(renderArrayTable(val, isSecret));
        else if (typeof val === 'object' && val !== null) section.appendChild(renderKVTable(val, isSecret));
        else { const p = document.createElement('p'); p.textContent = String(val); section.appendChild(p); }
        container.appendChild(section);
      }
    }
  }
}

function renderKVTable(obj, isSecret) {
  const table = document.createElement('table');
  const tbody = document.createElement('tbody');
  for (const [k, v] of Object.entries(obj)) {
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.innerHTML = '<strong>' + esc(k) + '</strong>';
    tr.appendChild(th);
    const td = document.createElement('td');
    td.textContent = v === null ? '—' : String(v);
    if (isSecret) {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerHTML = '&#x2398;';
      btn.title = 'Copy value';
      btn.addEventListener('click', (e) => { e.stopPropagation(); copyBtn(btn, String(v ?? '')); });
      td.appendChild(btn);
    }
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function renderArrayTable(arr, isSecret) {
  if (!arr.length) return document.createTextNode('(empty)');
  if (typeof arr[0] !== 'object') {
    const d = document.createElement('div');
    d.textContent = arr.join(', ');
    return d;
  }
  const keys = [...new Set(arr.flatMap(o => Object.keys(o)))];
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  keys.forEach(k => { const th = document.createElement('th'); th.textContent = k; hr.appendChild(th); });
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  arr.forEach(obj => {
    const tr = document.createElement('tr');
    keys.forEach(k => {
      const td = document.createElement('td');
      const v = obj[k];
      td.textContent = v === null || v === undefined ? '—' : typeof v === 'object' ? JSON.stringify(v) : String(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function copyBtn(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '&#x2713;';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '&#x2398;'; }, 1500);
  });
}

// Double-click row to copy value
document.addEventListener('dblclick', (e) => {
  const tr = e.target.closest('tbody tr');
  if (!tr) return;
  const cells = tr.querySelectorAll('td');
  if (cells.length < 2) return;
  const valCell = cells[1];
  const text = Array.from(valCell.childNodes)
    .filter(n => !n.classList || !n.classList.contains('copy-btn'))
    .map(n => n.textContent).join('').trim();
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    tr.classList.add('row-copied');
    setTimeout(() => tr.classList.remove('row-copied'), 800);
  });
});

function updatePathBar() {
  const bar = document.getElementById('path-bar');
  const parts = currentDir.split('/').filter(Boolean);
  let html = '<a onclick="loadDir(\'/\')">~</a>';
  let href = '';
  parts.forEach(p => {
    href += '/' + p;
    const h = href;
    html += '<span class="sep">/</span><a onclick="loadDir(\'' + h + '\')">' + esc(p) + '</a>';
  });
  bar.innerHTML = html;
}

// Search
let searchDebounce;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => runSearch(e.target.value.trim()), 300);
});

async function runSearch(q) {
  if (!q) { loadDir(currentDir); return; }
  const mode = document.querySelector('input[name="smode"]:checked').value;
  const results = await api('search', { q, mode, path: currentDir });
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  if (!results.length) {
    list.innerHTML = '<div style="padding:16px;color:var(--text-dim);font-size:12px">No results</div>';
    return;
  }
  for (const r of results) {
    const el = document.createElement('div');
    el.className = 'file-entry' + (r.isDir ? ' is-dir' : '');
    const icon = r.isDir ? '&#128193;' : '&#128196;';
    el.innerHTML = '<span class="file-icon">' + icon + '</span>' + esc(r.path);
    if (!r.isDir) {
      const fullPath = currentDir === '/' ? '/' + r.path : currentDir + '/' + r.path;
      el.addEventListener('click', () => loadFile(fullPath, el));
    }
    list.appendChild(el);
  }
}

function fileIcon(name) {
  if (name.endsWith('.json') || name.endsWith('.secrets')) return '&#128196;';
  if (name.endsWith('.md')) return '&#128220;';
  if (name.endsWith('.nix')) return '&#9881;';
  if (name.endsWith('.yaml') || name.endsWith('.yml')) return '&#128203;';
  if (name.endsWith('.sh')) return '&#9654;';
  return '&#128196;';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadDir('/');
</script>
</body>
</html>
