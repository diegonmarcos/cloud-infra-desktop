<?xml version="1.0" encoding="UTF-8"?>
<!-- Cloud Android desktop icon — the SAME adaptive-icon design as every ea_cloud-*
     app (background #0A0A0A + bold white brand glyph + translucent cloud-tick badge),
     ported 1:1 from ea_cloud-superapp/app/src/main/res/{drawable,mipmap-anydpi-v26}
     /ic_launcher*.xml pathData to SVG (VectorDrawable path syntax === SVG path syntax,
     same nonzero fill-rule, so the glyph's counter/hole reproduces without edits).
     Used as-is (no adaptive-icon masking — KDE has no notion of it) for the Waydroid
     .desktop entry: see build.json desktop_entry / build.sh cmd_install. -->
