# Generated/driven by build.sh. Two profiles: cli + gui + scanners.
# Network: host (rules: install.json .container.network_mode = "host").
#
# IMAGE PER PROFILE:
#   • kali-cli       → kali-os:latest  (~400 MB, no tools, no GUI — fast pull)
#   • kali-gui       → kali-lib:latest (FROM kali-os, ~34.5 GB — XFCE+VNC+tools)
#   • scanner-*      → kali-lib:latest (needs nmap/metasploit/etc.)
#
# Override per-profile via env: KALI_OS_IMAGE, KALI_LIB_IMAGE.
x-kali-common: &kali-common
  hostname: ${KALI_HOSTNAME:-kali}
  network_mode: host
  extra_hosts:
    - "kali:127.0.0.1"
  restart: unless-stopped
  shm_size: 2g
  cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
    - apparmor=unconfined
    - no-new-privileges:false
  environment:
    TZ: ${TZ:-Etc/UTC}
    LANG: ${LANG:-en_US.UTF-8}
    KALI_INSTALL_JSON: /install.json
    KALI_VNC_PASSWORD: ${KALI_VNC_PASSWORD:-kali}
  volumes:
    - ./install.json:/install.json:ro
    - ./data/home:/home/kali
    - ./data/workspace:/workspace
    - ./data/loot:/loot

services:
  kali-cli:
    <<: *kali-common
    image: ${KALI_OS_IMAGE:-kali-os:latest}
    container_name: kali-linux-cli
    profiles: ["cli"]
    stdin_open: true
    tty: true
    command: ["cli"]

  kali-gui:
    <<: *kali-common
    image: ${KALI_LIB_IMAGE:-kali-lib:latest}
    container_name: kali-linux-gui
    profiles: ["gui"]
    command: ["gui"]

  # ── Scanner: NETWORK profile ─────────────────────────────────────────────
  # Runs as kali user. No host bind-mount. Auth gate via targets.json.
  scanner-network:
    <<: *kali-common
    image: ${KALI_LIB_IMAGE:-kali-lib:latest}
    container_name: kali-scanner-network
    profiles: ["scan-network"]
    restart: "no"
    entrypoint: ["/usr/local/bin/scanner.sh"]
    environment:
      TZ: ${TZ:-Etc/UTC}
      LANG: ${LANG:-en_US.UTF-8}
      KALI_INSTALL_JSON: /install.json
      VERBOSE: ${VERBOSE:-0}
      QUIET:   ${QUIET:-0}
    volumes:
      - ./install.json:/install.json:ro
      - ./scans.json:/scans.json:ro
      - ./targets.json:/targets.json:ro
      - ./scripts/scanner.sh:/usr/local/bin/scanner.sh:ro
      - ./scripts/reporter.sh:/usr/local/bin/reporter.sh:ro
      - ./scripts/survey-wifi.sh:/usr/local/bin/survey-wifi.sh:ro
      - ./scripts/safety-analyzer.sh:/usr/local/bin/safety-analyzer.sh:ro
      - ./data/home:/home/kali
      - ./data/loot:/loot

  # ── Scanner: LOCAL profile ───────────────────────────────────────────────
  # Runs as ROOT. Read-only host filesystem at /host. Audits THIS machine.
  scanner-local:
    <<: *kali-common
    image: ${KALI_LIB_IMAGE:-kali-lib:latest}
    container_name: kali-scanner-local
    profiles: ["scan-local"]
    restart: "no"
    user: "0:0"
    pid: host
    entrypoint: ["/usr/local/bin/scanner.sh"]
    environment:
      TZ: ${TZ:-Etc/UTC}
      LANG: ${LANG:-en_US.UTF-8}
      KALI_INSTALL_JSON: /install.json
      FSROOT: /host
      VERBOSE: ${VERBOSE:-0}
      QUIET:   ${QUIET:-0}
    volumes:
      - ./install.json:/install.json:ro
      - ./scans.json:/scans.json:ro
      - ./targets.json:/targets.json:ro
      - ./scripts/scanner.sh:/usr/local/bin/scanner.sh:ro
      - ./scripts/reporter.sh:/usr/local/bin/reporter.sh:ro
      - ./scripts/survey-wifi.sh:/usr/local/bin/survey-wifi.sh:ro
      - ./scripts/safety-analyzer.sh:/usr/local/bin/safety-analyzer.sh:ro
      - ./data/loot:/loot
      - /:/host:ro
