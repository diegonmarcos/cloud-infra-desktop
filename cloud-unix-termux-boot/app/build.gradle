apply plugin: 'com.android.application'

// Package name is NOT com.termux.boot and NOT a Termux plugin in the usual
// sense. See BootReceiver.java for why this app cannot use sharedUserId and
// therefore cannot be a fork of termux-boot.
def hostPackage = project.findProperty("NOD_PACKAGE_NAME") ?: "com.termux.nix"

android {
    namespace "com.termux.nix.boot"
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        applicationId "com.termux.nix.boot"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1
        versionName "1.0.0"

        // The host package is compiled in: every intent action, extra key and
        // permission below is namespaced by it (TermuxConstants derives them
        // all from TERMUX_PACKAGE_NAME), so it must match the installed app.
        manifestPlaceholders.NOD_PACKAGE_NAME = hostPackage
        buildConfigField "String", "NOD_PACKAGE_NAME", "\"${hostPackage}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("cloud-boot_v" + variant.versionName + "+" + variant.buildType.name + ".apk")
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.7.0"
}
