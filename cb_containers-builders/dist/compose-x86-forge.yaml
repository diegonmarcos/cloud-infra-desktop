services:
  builder:
    image: ghcr.io/diegonmarcos/cloud-builder-forge-rust-go-clang:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host
      args:
        NIX_SYSTEM: x86_64-linux
    container_name: cloud-builder-x86-forge
    
    network_mode: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME:-/root}/.ssh:/root/.ssh:ro
      - ${HOME:-/root}/.config/sops:/root/.config/sops:ro
    working_dir: /workspace
    entrypoint: ["/opt/cloud-builder/entrypoint.sh"]
    environment:
      - TERM=xterm-256color
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_ACTOR=${GITHUB_ACTOR:-}
    labels:
      diego.managed-by: "build.sh"
      diego.image.variant: "x86-forge"
