services:
  cloud-builder:
    image: ghcr.io/diegonmarcos/cloud-builder-x-deb-nixhm:latest
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/root/.ssh:ro
      - ${HOME}/.config/sops:/root/.config/sops:ro
    environment:
      - GITHUB_TOKEN
      - GITHUB_ACTOR
      - GITHUB_ACTIONS
      - GITHUB_EVENT_NAME
      - GITHUB_REPOSITORY
      - GITHUB_RUN_ID
      - GITHUB_SHA
      - SSH_KEY
      - SSH_HOST
      - SSH_USER
      - SSH_ALIAS
      - SOPS_AGE_KEY
      - WG_PRIVATE_KEY
      - CHANGED_DIRS
      - OCI_SSH_KEY
      - GCP_PROXY_SSH_KEY
      - GCP_T4_SSH_KEY
