set timeout=5
set timeout_style=menu
set gfxmode=auto
set gfxpayload=keep

# Locate /boot partition (this cfg lives at $drive1/grub/grub.cfg)
search --no-floppy --set=drive1 --fs-uuid 0eaf7961-48c5-4b55-8a8f-04cd0b71de07

# grubenv: support grub-reboot one-time selection
if [ -s $prefix/grubenv ]; then
  load_env
fi

if [ "${next_entry}" ]; then
  set default="${next_entry}"
  set next_entry=
  save_env next_entry
  set timeout=1
  set boot_once=true
else
  set default=0
  set timeout=5
fi

function savedefault {
  if [ -z "${boot_once}" ]; then
    saved_entry="${chosen}"
    save_env saved_entry
  fi
}

