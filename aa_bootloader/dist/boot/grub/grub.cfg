set timeout=5
set default=0
set gfxmode=auto
set gfxpayload=keep

# Load required modules
insmod part_gpt
insmod fat
insmod ext2
insmod btrfs
insmod luks2
insmod cryptodisk
insmod gcry_rijndael
insmod gcry_sha256

# Theme
set menu_color_normal=white/black
set menu_color_highlight=black/white
if [ -f /boot/background.png ]; then
  background_image /boot/background.png
fi

