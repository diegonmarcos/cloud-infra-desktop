# ─── UI ─────────────────────────────────────────────────────────────────────

if loadfont ($drive1)/grub/fonts/unicode.pf2 ; then
  insmod gfxterm
  set gfxmode=auto
  set gfxpayload=keep
  terminal_output gfxterm
elif loadfont ($drive1)/converted-font.pf2 ; then
  insmod gfxterm
  set gfxmode=auto
  set gfxpayload=keep
  terminal_output gfxterm
fi

